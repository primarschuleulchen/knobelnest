*{box-sizing:border-box}
:root{--bg:#f4f9fd;--ink:#1f2421;--soft:#5f6963;--line:#e1edf7;--line2:#c5d8e8;--gold:#d6ad45;--gold-d:#c4952f;
  --sky:#dcf0fd;--sky-d:#3f78a8;--leaf:#e9f1e3;--rose:#fcefed;--sun:#fbf3dc;--lila:#efe7f7;--ok:#5f9a4a;--no:#c8574e;
  --sch:0 10px 26px rgba(63,120,168,.18),0 2px 6px rgba(63,120,168,.10);--sch-k:0 4px 12px rgba(63,120,168,.14)}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,#e3f1fc 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#fbf3dc 0%,transparent 60%),var(--bg);
  color:var(--ink);font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;font-size:21px;line-height:1.3;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 28px}
.top{width:100%;max-width:960px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top .t{flex:1;text-align:center;font-size:23px}
.top .t::after{content:" ✦";color:var(--gold);font-size:.6em;vertical-align:super}
.pill{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 14px;min-height:46px;box-shadow:var(--sch-k);transition:transform .15s}
.pill:hover{transform:translateY(-2px)}.pill:active{transform:translateY(1px)}
.kopf{text-align:center;margin:6px 0 4px}
.ring{width:104px;height:104px;border-radius:50%;display:inline-grid;place-items:center;font-size:54px;background:var(--sun);border:3px solid var(--gold);
  box-shadow:inset 0 0 0 6px #fff,0 8px 18px rgba(63,120,168,.18)}
.kopf h1{margin:10px 0 2px;font-size:42px;font-weight:400;line-height:1}
.kopf h1::after{content:" ✦";color:var(--gold);font-size:.5em;vertical-align:super}
.kopf p{margin:6px auto 0;max-width:540px;color:var(--soft);font-size:20px}
.deko{color:var(--gold);letter-spacing:.35em;font-size:13px;margin-top:8px}
.lvs{width:100%;max-width:600px;display:grid;gap:12px;margin-top:16px}
.lv{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#fff 0%,#fff 70%,#f7fbfe 100%);border:1.5px solid var(--line);border-radius:24px;
  padding:12px 18px;text-align:left;min-height:78px;box-shadow:var(--sch);transition:transform .15s,box-shadow .15s}
.lv:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(63,120,168,.26),0 3px 8px rgba(63,120,168,.14)}
.lv:active{transform:translateY(1px)}
.lv .n{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid var(--gold);box-shadow:inset 0 0 0 4px #fff}
.lv .tx{flex:1}.lv .tx b{display:block;font-weight:400;font-size:25px;line-height:1.1}.lv .tx span{color:var(--soft);font-size:18px}
.stars{color:var(--gold);font-size:24px;letter-spacing:2px;white-space:nowrap}.stars .off{color:#e6dcc2}
.msg{min-height:60px;font-size:25px;text-align:center;margin:2px 0 10px;max-width:760px;line-height:1.35}
.msg .em{font-size:42px;vertical-align:middle;margin:0 4px;line-height:1}
.msg small{color:var(--soft);font-size:19px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 4px}
.dots i{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--line2);display:block}.dots i.ok{background:var(--ok);border-color:var(--ok)}.dots i.no{background:var(--no);border-color:var(--no)}
.stage{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:min(420px,90%);height:14px;border-radius:99px;background:#fff;border:2px solid var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8c56a,var(--gold));width:100%;transition:width linear}
.go{background:var(--sky);border:2px solid var(--ink);border-radius:16px;padding:8px 22px;font-size:23px;min-height:54px;box-shadow:var(--sch);transition:transform .15s}
.go:hover{transform:translateY(-2px)}.go:active{transform:translateY(1px)}
.go.alt{background:#fff}.go.sun{background:var(--sun)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;display:grid;place-items:center;aspect-ratio:1;font-size:clamp(28px,7vw,54px);line-height:1;
  box-shadow:var(--sch-k);transition:background .2s,border-color .2s,transform .12s;position:relative}
button.card:active{transform:scale(.96)}
.grid{display:grid;gap:clamp(6px,1.6vw,12px);width:100%;margin:0 auto}
.grid .card{font-size:inherit}
.card.cover{background:linear-gradient(135deg,#e6f3fd,#c4e2f8);color:var(--gold);border-color:#b9d6ee}
.card.cover::after{content:"✧";font-size:.45em;opacity:.9}
.card.ok{border-color:var(--ok);background:#f1f7ec}
.card.no{border-color:var(--no);background:#fbefed}
.card.hint{border-color:var(--gold);background:var(--sun)}
.card.zahl{color:var(--sky-d)}
.end{background:linear-gradient(180deg,#fff 0%,#fff 70%,#fbf3dc 100%);border:1.5px solid var(--line);border-radius:30px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:var(--sch)}
.end .big{font-size:64px}.end h2{margin:6px 0;font-weight:400;font-size:36px}.end p{color:var(--soft);margin:4px 0 18px;font-size:22px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .3s}@keyframes pp{50%{transform:scale(1.1)}}
.szene{position:relative;width:min(100%,600px);aspect-ratio:3/2;max-height:52vh;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:var(--sch)}
.szene span{position:absolute;transform:translate(-50%,-50%);font-size:clamp(26px,6vw,46px);line-height:1}
.szene.zu{background:linear-gradient(135deg,#e6f3fd,#c4e2f8)}
.nm{position:absolute;left:4px;right:4px;bottom:6%;font-size:clamp(15px,3.2vw,20px);text-align:center;background:var(--sun);border-radius:10px;padding:1px 2px}
.karte{padding-bottom:22%}
@media (max-height:640px){.ring{width:80px;height:80px;font-size:40px}.kopf h1{font-size:32px}.msg{min-height:50px;font-size:21px}}

#app{padding:8px 10px 10px}
.stage{max-width:1500px}
.msg{min-height:0;font-size:19px;margin:0 0 6px}
.msg .em{font-size:30px}
.lv.frei{border:2px dashed var(--line2);background:#fff}
.owbox{position:relative;width:100%;height:calc(100vh - 112px);min-height:380px;border-radius:22px;overflow:hidden;border:3px solid var(--gold);box-shadow:var(--sch);background:#bfe3f7;user-select:none;-webkit-user-select:none;touch-action:none}
.ow{position:absolute;inset:0}.ow canvas{display:block;width:100%;height:100%}
.owbox .card{position:absolute;left:12px;top:12px;width:min(410px,44%);max-height:calc(100% - 110px);overflow:auto;aspect-ratio:auto;display:block;place-items:initial;
  background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:20px;padding:10px 16px 12px;box-shadow:var(--sch);font-size:21px;text-align:left;line-height:1.3}
.owbox .card .hd{font-size:24px;margin-bottom:4px}.owbox .card .hd small{color:var(--soft);font-size:18px}
.owbox .card b{font-weight:400;color:var(--sky-d)}
.owbox .de{font-size:18px;color:var(--soft);margin:6px 0}
.steps{margin:6px 0 8px;padding-left:28px}
.steps li{font-size:22px;margin:3px 0;cursor:pointer;border-radius:10px;padding:1px 6px}
.steps li:hover{background:var(--sky)}
.steps li.q{list-style:none;margin-left:-22px;color:var(--soft);font-style:italic;cursor:default}
.steps li.q:hover{background:none}
.steps.rv li.ok::marker{color:var(--ok)}.steps.rv li.ok{color:#2f5a22}
.steps.rv li.no{background:#fbe5e2;border:2px solid var(--no)}
.why{font-size:18px;color:#8a2a22;margin-top:3px;line-height:1.3}
.owbox .row{justify-content:flex-start;gap:8px;margin-top:6px}
.owbox .go{font-size:20px;min-height:46px;padding:6px 14px}
.leg{font-size:17px;color:var(--soft);margin:8px 0 2px}.leg span{display:inline-block;width:26px;height:8px;border-radius:4px;vertical-align:middle;margin-right:4px}
.leg .r{background:#e0362c}.leg .b{background:#2f6fd0}
.tools{position:absolute;right:12px;top:12px;display:flex;gap:8px}
.tools .pill{font-size:19px;min-height:42px;padding:4px 12px;background:rgba(255,255,255,.95)}
.tools .pill.on{background:var(--sun);border-color:var(--gold-d)}
.pad{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}
.pad button{background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:16px;font-size:30px;box-shadow:var(--sch-k);touch-action:none}
.pad button:active{background:var(--sun);transform:scale(.95)}
.mark{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--sun);border:2px solid var(--ink);border-radius:18px;font-size:24px;padding:8px 20px;min-height:58px;box-shadow:var(--sch);white-space:nowrap}
.mark:active{transform:translateX(-50%) scale(.96)}
.mini{position:absolute;right:12px;bottom:12px;width:216px;height:144px;border-radius:14px;border:3px solid #fff;box-shadow:var(--sch-k)}
.mini.aus{display:none}
.near{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(31,36,33,.78);color:#fff;border-radius:14px;padding:4px 16px;font-size:20px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.near.on{opacity:1}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);background:#fff;border:2px solid var(--gold);border-radius:18px;padding:10px 18px;font-size:22px;box-shadow:var(--sch);opacity:0;transition:all .25s;pointer-events:none;text-align:center;max-width:80%}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pop{position:absolute;inset:0;background:rgba(20,40,60,.35);display:grid;place-items:center;z-index:5}
.pop[hidden]{display:none}
.pp{background:#fff;border:2px solid var(--line);border-radius:24px;padding:14px 20px;max-width:min(620px,94%);max-height:92%;overflow:auto;box-shadow:var(--sch);text-align:center}
.pp h3{font-weight:400;font-size:28px;margin:4px 0 10px}
.pp table{border-collapse:collapse;text-align:left;font-size:19px;margin:0 auto}
.pp td{padding:3px 8px;border-bottom:1px solid var(--line)}.pp td.ic{font-size:24px;text-align:center}
.pp td b{font-weight:400;color:var(--sky-d);cursor:pointer}
.pp .kl{font-size:17px;color:var(--soft)}
.pp .row{justify-content:center}.pp .go small{font-size:18px;color:var(--soft)}
.owbox.review .pad,.owbox.review .mark,.owbox.review .near{display:none}
@media (max-width:760px){
  .owbox{height:calc(100vh - 100px)}
  .owbox .card{left:8px;right:8px;top:8px;width:auto;max-height:42%;padding:8px 12px;font-size:19px}
  .owbox .card .hd{font-size:21px}.steps li{font-size:19px}
  .owbox.review .card{max-height:60%}
  .tools{top:auto;bottom:118px;right:8px;flex-direction:column}
  .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);left:8px;bottom:8px}
  .mini{width:132px;height:88px;right:8px;bottom:8px}
  .mark{bottom:122px;font-size:20px;min-height:48px;padding:6px 14px}
  .near{bottom:176px;font-size:17px}
}
/* Logo statt Emoji im Kreis oben (das Bild hat den Goldrand schon) */
.ring{width:150px;height:150px;background:none;border:none;box-shadow:0 8px 18px rgba(63,120,168,.18)}.ring .logo{width:100%;height:100%;display:block;border-radius:50%}
.pls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pl{position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;background:rgba(31,36,33,.85);color:#fff;border:2px solid var(--gold);border-radius:12px;padding:1px 9px;font-size:17px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.25)}
@media (max-width:760px){.pl{font-size:14px;padding:0 7px}}
/* bis 10 Sterne pro Stufe: rechts in zwei Reihen à 5 */
.lv .stars{flex:none;width:5.3em;font-size:19px;letter-spacing:0;line-height:1.15;white-space:normal;word-break:break-all;text-align:left}
</style>

buildPlan();

// ---------------------------------------------------------------------- Wege erfinden

      if (b.dataset.x === 'next') { if (!alive()) return; var more = api.answer(task.ok, true); k++; if (more) nextTask(); else { U.card.innerHTML = '<div class="hd">🏁 Fertig!</div>'; OW.lock = true; } }
      if (b.dataset.x === 'replay') replay();
    };
    if (task.typ === 'weg' && lv.listen && !task.heard) { task.heard = 1; setTimeout(function () { if (alive()) sayTask(); }, 500); }
  }
  function sayTask() {
    if (task.typ === 'weg') {
      var sent = task.r.steps.map(function (s) { return s.text; }).concat(['Where are you?']);
      if (!(lv.listen ? sayList(sent, .78, 1600) : sayList(sent, .88, 600))) { task.show = true; showTask(); toast('Vorlesen geht auf diesem Gerät nicht – lies den Text.'); }
    }
    else if (task.typ === 'job') say('Where does the ' + task.job[0] + ' work?');
    else say('Walk to the ' + PLACES[task.place].en + '.');
  }

  function check(L) {
    if (!alive() || task.done) return;
    task.done = true; OW.lock = true; OW.held = false;
    var ok, rv = { kid: OW.trace.slice() };
    if (task.typ === 'weg') { ok = L === task.r.target; rv.sol = task.r.nodes; rv.T = task.r.target; }
    else { ok = L.place === task.place; var T = LOTS.filter(function (x) { return x.place === task.place; })[0]; rv.T = T; var to = {}; to[T.stop] = 1; rv.sol = shortest(task.start.stop, to); }
    task.ok = ok; if (ok) good(); else bad();
    review(L, ok, rv);
  }
  function review(L, ok, rv) {
    U.box.classList.add('review');
    WD.workers.forEach(function (w) { w.lb.visible = true; });
    var T = rv.T, P = PLACES[T.place], o = '';
    var redM = tube(rv.sol, '#e0362c', 1, 1.1), blueM = tube(rv.kid, '#2f6fd0', 1.6, .6);
    if (task.flag) floatMark(task.flag[0], task.flag[1], 16, '🚩');
    WD.grow = { t: 0, dur: 2.2, list: [redM, blueM].filter(Boolean) }; WD.grow.list.forEach(function (m) { m.geometry.setDrawRange(0, 0); });
    WD.miniPaths = { sol: rv.sol, kid: rv.kid }; WD.miniStar = { x: T.x, z: T.z };
    floatMark(T.x, T.z, (T.place === 'hospital' ? 26 : T.place === 'space' ? 32 : 16), '⭐', true);
    if (!ok) { ringMark(L.x + L.fx * (L.d / 2 + 2), L.z + L.fz * (L.d / 2 + 2), '#2f6fd0'); }
    viewFit([rv.sol, rv.kid]);
    if (task.typ === 'weg') {
      var ex = explain(task.r, rv.kid, L);
      o = '<div class="hd">' + (ok ? '🎉 Right! You are at the <b>' + h(P.en) + '</b>.' : '🤔 Not quite. The goal was the <b>' + h(P.en) + '</b>.') + '</div>';
      o += '<p class="de">' + h(P.en) + ' = ' + h(P.de) + (ok ? '' : ' · Du warst bei: ' + h(lotArt(L))) + '</p>';
      o += '<ol class="steps rv">'; task.r.steps.forEach(function (s, i) { var c = ex.step == null ? 'ok' : i < ex.step ? 'ok' : i === ex.step ? 'no' : ''; o += '<li data-i="' + i + '" class="' + c + '">' + h(s.text) + (i === ex.step ? '<div class="why">' + ex.why + '</div>' : '') + '</li>'; }); o += '</ol>';
      if (!ok && ex.node) { var n = NODES[ex.node]; floatMark(n.x, n.z, 6, '❗'); ringMark(n.x, n.z, '#f6c623'); }
    } else {
      var J = task.job;
      if (ok) o = '<div class="hd">🎉 Yes! ' + (J ? 'The <b>' + h(J[0]) + '</b> works at the <b>' + h(P.en) + '</b>.' : 'This is the <b>' + h(P.en) + '</b>.') + '</div>';
      else o = '<div class="hd">🤔 This is ' + h(lotArt(L)) + '.</div><p class="de">' + (J ? 'The ' + h(J[0]) + ' (' + h(J[3]) + ') arbeitet hier: ' : 'Gesucht war ') + '<b>the ' + h(P.en) + '</b> ⭐</p>';
      o += '<p class="de">' + h(P.en) + ' = ' + h(P.de) + (J ? ' · ' + h(J[0]) + ' = ' + h(J[3]) : '') + '</p>';
      say(ok ? (J ? 'Yes! The ' + J[0] + ' works at the ' + P.en + '.' : 'Yes! This is the ' + P.en + '.') : 'This is ' + lotArt(L) + '. The ' + (J ? J[0] + ' works at the ' : '') + P.en + ' is here.');
    }
    o += '<p class="leg"><span class="r"></span> richtiger Weg &nbsp; <span class="b"></span> dein Weg</p>';
    o += '<div class="row"><button class="go alt" data-x="replay">▶ Nochmal zeigen</button><button class="go sun" data-x="next">' + (k + 1 < N ? 'Weiter →' : 'Fertig ✓') + '</button></div>';
    U.card.innerHTML = o; U.card.scrollTop = 0;
    if (task.typ === 'weg' && ok) say('Right! You are at the ' + P.en + '.');
  }
  function replay() { if (!WD.paths.children.length) return; WD.grow = { t: 0, dur: 2.2, list: WD.paths.children.slice() }; WD.paths.children.forEach(function (m) { m.geometry.setDrawRange(0, 0); }); }
  nextTask();
}

// Wo wurde der Weg falsch verstanden?  → { step: Satz-Nummer oder null, why: Erklärung, node }
function explain(r, kid, L) {
  var sol = r.nodes, d = 0;
  while (d < sol.length && d < kid.length && sol[d] === kid[d]) d++;
  if (L === r.target) return { step: null, why: '' };
  var last = r.steps.length - 1, fin = r.steps[last];
  if (d === sol.length && kid.length === sol.length) {
    // richtiger Haltepunkt, aber falsches Gebäude
    return { step: last, node: sol[sol.length - 1], why: 'Der Weg stimmt! Aber «on your ' + DIR[fin.side] + '» heisst ' + DIRDE[fin.side] + '. Du hast das Gebäude auf der anderen Seite gewählt.' };
  }
  if (d >= kid.length) {
    // zu früh stehen geblieben
    var s = r.stepOf[d] != null ? r.stepOf[d] : last;
    return { step: s, node: kid[kid.length - 1], why: 'Hier bist du stehen geblieben – das Ziel ist noch weiter. ' + (s === last ? 'Zähle die Gebäude auf der ' + (fin.side === 'L' ? 'linken' : 'rechten') + ' Seite: «the ' + ORD[fin.ord - 1] + ' building» = das ' + ORDDE[fin.ord - 1] + ' Gebäude.' : 'Lies den Satz nochmals genau.') };
  }
  if (d >= sol.length) {
    return { step: last, node: sol[sol.length - 1], why: 'Du bist zu weit gegangen. «the ' + ORD[fin.ord - 1] + ' building on your ' + DIR[fin.side] + '» = das ' + ORDDE[fin.ord - 1] + ' Gebäude ' + DIRDE[fin.side] + '.' };
  }
  var at = sol[d - 1], step = r.stepOf[d - 1], st = r.steps[step], n = NODES[at];
  var inH = d - 2 >= 0 ? hdOf(sol[d - 2], at, true) : r.face;
  var want = rel(inH, hdOf(at, sol[d])), did = rel(inH, hdOf(at, kid[d]));
  if (d - 1 === 0) {
    return { step: 0, node: at, why: 'Am Anfang stehst du mit dem Rücken zum Gebäude. «turn ' + DIR[st.turn] + '» heisst ' + DIRDE[st.turn] + '. Du bist ' + DIRDE[did] + ' gegangen.' };
  }
  if (n.t === 'R') {
    var entry = sol.indexOf(sol.filter(function (x) { return NODES[x].t === 'R'; })[0]), kEx = 0;
    for (var q = entry + 1; q < kid.length && NODES[kid[q]].t === 'R'; q++) kEx++;
    return { step: step, node: at, why: '«take the ' + ORD[st.exit - 1] + ' exit» heisst: die ' + ORDDE[st.exit - 1] + ' Ausfahrt aus dem Kreisel. ' + (kEx ? 'Du hast die ' + kEx + '. Ausfahrt genommen.' : 'Zähle die Ausfahrten.') };
  }
  if (n.t === 'S' || did === 'B') return { step: step, node: at, why: 'Hier bist du umgekehrt. Geh weiter in dieselbe Richtung.' };
  if (st.t === 'turn' && want === 'S') {
    return { step: step, node: at, why: 'Hier bist du schon abgebogen. Das war erst die ' + (r.crossNo[d - 1] || 1) + '. Kreuzung. «at the ' + ORD[st.n - 1] + ' crossing» = bei der ' + ORDDE[st.n - 1] + ' Kreuzung. Zähle die Kreuzungen!' };
  }
  if (want === 'S') return { step: step, node: at, why: 'Hier musst du geradeaus gehen («walk straight on»). Du bist ' + DIRDE[did] + ' gegangen.' };
  if (did === 'S') return { step: step, node: at, why: 'Hier musst du abbiegen: «turn ' + DIR[want] + '» heisst ' + DIRDE[want] + '. Du bist geradeaus gegangen.' + (st.t === 'turn' && st.n > 1 ? ' Das ist die ' + ORDDE[st.n - 1] + ' Kreuzung.' : '') };
  return { step: step, node: at, why: '«turn ' + DIR[want] + '» heisst ' + DIRDE[want] + '. Du bist ' + DIRDE[did] + ' gegangen. Tipp: Links ist, wo der Daumen der linken Hand ein «L» macht.' };
}
function hdOf(a, b, end) { var e = EMAP[a + '>' + b]; if (!e) { var A = NODES[a], B = NODES[b]; return Math.atan2(B.z - A.z, B.x - A.x); } return end ? e.h1 : e.h0; }

// Knopf «Frei spazieren» im Stufen-Menü
G.extra = function () {
  var lvs = app.querySelector('.lvs'); if (!lvs) return;
  var b = document.createElement('button'); b.className = 'lv frei'; b.innerHTML = '<span class="n" style="background:#fff">🚶</span><span class="tx"><b>Free walk</b><span>Frei durch die Stadt spazieren und Wörter hören</span></span>';
  b.onclick = function () { tone(520, .08); freeWalk(); };
  lvs.appendChild(b);
};
function freeWalk() {
  stopAll(); RUN++; CUR = -1; KN.level(null);
  app.innerHTML = '<div class="top"><button class="pill" data-back>← Stufen</button><span class="t">Free walk</span>' + sndBtn() + '</div><div class="msg" id="msg"></div><div class="stage" id="stage"></div>';
  app.querySelector('[data-back]').onclick = menu;
  var stage = document.getElementById('stage'), msgEl = document.getElementById('msg');
  G.play({ typ: 'frei' }, { stage: stage, msg: function (t) { msgEl.innerHTML = t; }, later: function (fn, ms) { setTimeout(fn, ms); }, answer: function () { return true; } }, -1);
}


var MODE = window.knobelnest ? 'srcdoc' : window.parent !== window ? (/[?&]vorschau/.test(location.search) ? 'vorschau' : 'url') : 'solo';
var ST = {}, AW = { lv: {}, max: 0 }, booted = false;
function loadST(s) { try { ST = JSON.parse(s || '{}') || {}; } catch (e) { ST = {}; } }
function send(m) { if (MODE !== 'url') return; m.knobelnest = 1; try { parent.postMessage(m, '*'); } catch (e) {} }
var KN = MODE === 'srcdoc' ? window.knobelnest : {
  answer: function (ok) { send({ type: 'answer', ok: !!ok }); },
  level: function (n) { send({ type: 'level', level: n == null ? null : String(n) }); },
  round: function () { send({ type: 'round' }); },
  sterne: function (k) { return { have: +((AW.lv || {})[k]) || 0, max: +AW.max || 3 }; }
};
function save() {
  var s = JSON.stringify(ST);
  if (MODE === 'url') send({ type: 'store', data: { en: s } }); else try { localStorage.setItem('en', s); } catch (e) {}
}
var app = document.getElementById('app'), TM = [], RUN = 0, AC = null, CUR = -1;
var LV_COL = ['#e9f1e3', '#dcf0fd', '#fbf3dc', '#fcefed', '#efe7f7', '#e3f4f1'];
function h(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a, n) { return shuffle(a).slice(0, n); }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
function anyCat() { var k = Object.keys(BILD); return BILD[k[rnd(0, k.length - 1)]]; }
function stopAll() { TM.forEach(clearTimeout); TM = []; }
function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
// Raster, das auf den Bildschirm passt (reserve = Platz für Kopf und Text)
function grid(cols, rows, maxPx, reserve) {
  var g = document.createElement('div'); g.className = 'grid'; g.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
  var w = Math.min(window.innerWidth - 32, (window.innerHeight - (reserve || 210)) * cols / rows, cols * (maxPx || 130));
  g.style.maxWidth = Math.max(160, w) + 'px'; g.style.fontSize = Math.max(22, Math.min(64, w / cols * 0.5)) + 'px';
  return g;
}
function bigBox() { var b = document.createElement('div'); b.className = 'card'; b.style.cssText = 'width:min(46vw,200px);font-size:min(24vw,112px)'; return b; }
function optBtn(t, wide) { var b = document.createElement('button'); b.className = 'card'; b.style.cssText = wide ? 'aspect-ratio:auto;padding:10px 18px;font-size:26px;min-height:58px' : 'width:clamp(60px,15vw,92px);font-size:clamp(32px,7.5vw,52px)'; b.innerHTML = t; return b; }
function tone(f, d, type, vol) {
  if (ST.mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) {}
}
function good() { tone(660, 0.12); setTimeout(function () { tone(990, 0.2); }, 110); }
function bad() { tone(200, 0.3, 'triangle', 0.16); }
function stars(have, max) { var o = ''; for (var i = 0; i < max; i++) o += i < have ? '★' : '<span class="off">★</span>'; return '<span class="stars">' + o + '</span>'; }
function sndBtn() { return '<button class="pill" data-snd aria-label="Ton ein oder aus">' + (ST.mute ? '🔇' : '🔊') + '</button>'; }
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-snd]'); if (!b) return;
  ST.mute = !ST.mute; save(); b.textContent = ST.mute ? '🔇' : '🔊';
});
var showStars = MODE === 'url' || MODE === 'srcdoc';

function menu() {
  stopAll(); RUN++; CUR = -1; KN.level(null);
  var o = '<div class="top"><span style="flex:1"></span>' + sndBtn() + '</div><div class="kopf"><span class="ring">' + G.icon + '</span><h1>' + h(G.title) + '</h1><p>' + G.intro + '</p><div class="deko">✦ ✧ ✦</div></div><div class="lvs">';
  G.levels.forEach(function (lv, i) {
    var s = KN.sterne('Stufe ' + (i + 1)), mx = s.max || 3;
    o += '<button class="lv" data-lv="' + i + '"><span class="n" style="background:' + LV_COL[i] + '">' + (i + 1) + '</span><span class="tx"><b>' + h(lv.name) + '</b><span>' + h(lv.info) + '</span></span>' +
      (showStars ? stars(Math.min(s.have, mx), mx) : '') + '</button>';
  });
  app.innerHTML = o + '</div>'; if (G.extra) G.extra();
  Array.prototype.forEach.call(app.querySelectorAll('[data-lv]'), function (b) { b.onclick = function () { tone(520, 0.08); start(+b.dataset.lv); }; });
}

function start(i) {
  stopAll(); var run = ++RUN, lv = G.levels[i], res = [], N = G.n || 0; CUR = i;
  KN.level('Stufe ' + (i + 1));
  app.innerHTML = '<div class="top"><button class="pill" data-back>← Stufen</button><span class="t">Stufe ' + (i + 1) + ' · ' + h(lv.name) + '</span>' + sndBtn() + '</div>' +
    (N && MODE !== 'url' && MODE !== 'srcdoc' ? '<div class="dots" id="dots"></div>' : '') + '<div class="msg" id="msg"></div><div class="stage" id="stage"></div>';
  app.querySelector('[data-back]').onclick = menu;
  var stage = document.getElementById('stage'), msgEl = document.getElementById('msg');
  function dots() { var d = document.getElementById('dots'); if (!N || !d) return; var o = ''; for (var k = 0; k < N; k++) o += '<i class="' + (k < res.length ? (res[k] ? 'ok' : 'no') : '') + '"></i>'; d.innerHTML = o; }
  dots();
  var api = {
    stage: stage,
    msg: function (t) { msgEl.innerHTML = t; },
    later: function (fn, ms) { TM.push(setTimeout(function () { if (run === RUN) fn(); }, ms)); },
    // Antwort melden. Gibt false zurück, wenn die Runde fertig ist.
    answer: function (ok, quiet) {
      KN.answer(!!ok);
      if (!quiet) { if (ok) good(); else bad(); }
      if (!N) return true;
      res.push(!!ok); dots();
      if (res.length >= N) { var c = res.filter(Boolean).length; api.later(function () { end(i, c + ' von ' + N + ' richtig', c / N); }, 1600); return false; }
      return true;
    },
    // Für Spiele ohne feste Anzahl Aufgaben (Paare finden)
    done: function (line, q) { KN.round(); end(i, line, q); },
    best: function (key, v, lower) {
      ST.best = ST.best || {}; var old = ST.best[key], rec = old == null || (lower ? v < old : v > old);
      if (rec) { ST.best[key] = v; save(); } return { old: old, rec: rec };
    },
    // Merkzeit mit Balken und Knopf «Ich bin bereit»
    watch: function (ms, after) {
      var w = document.createElement('div'); w.className = 'stage'; w.style.gap = '10px';
      w.innerHTML = '<div class="bar"><i></i></div><button class="go alt">Ich bin bereit ✓</button>';
      stage.appendChild(w);
      var bar = w.querySelector('i'), fired = false;
      function fire() { if (fired || run !== RUN) return; fired = true; w.remove(); after(); }
      requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.transitionDuration = ms + 'ms'; bar.style.width = '0%'; }); });
      w.querySelector('button').onclick = fire;
      api.later(fire, ms);
    }
  };
  G.play(lv, api, i);
}

function end(i, line, q) {
  stopAll(); RUN++;
  var em = q >= 0.9 ? '🏆' : q >= 0.7 ? '🌟' : q >= 0.5 ? '👍' : '💪', t = q >= 0.9 ? 'Super gemacht!' : q >= 0.7 ? 'Gut gemacht!' : q >= 0.5 ? 'Geschafft!' : 'Weiter üben!';
  var next = i + 1 < G.levels.length;
  app.innerHTML = '<div class="top"><span style="flex:1"></span>' + sndBtn() + '</div><div class="stage" style="margin-top:30px"><div class="end"><div class="big">' + em + '</div><h2>' + t + '</h2><p>' + line + '</p><div class="row">' +
    '<button class="go" data-again>Nochmal</button>' + (next && q >= 0.7 ? '<button class="go sun" data-next>Nächste Stufe →</button>' : '') + '<button class="go alt" data-menu>Stufen</button></div><div class="deko" style="margin-top:16px">✦ ✧ ✦</div></div></div>';
  app.querySelector('[data-again]').onclick = function () { start(i); };
  if (app.querySelector('[data-next]')) app.querySelector('[data-next]').onclick = function () { start(i + 1); };
  app.querySelector('[data-menu]').onclick = menu;
  if (q >= 0.7) { good(); setTimeout(function () { tone(1320, 0.25); }, 260); }
}

function boot() {
  if (booted) return; booted = true;
  var m = /[?&]stufe=(\d)/.exec(location.search), s = m ? +m[1] - 1 : -1;
  if (s >= 0 && s < G.levels.length) start(s); else menu();
}
if (MODE === 'url') {
  window.addEventListener('message', function (e) {
    var d = e.data; if (e.source !== parent || !d) return;
    if (d.knobelnestInit && !booted) { var x = d.knobelnestInit; loadST(x.store && x.store.en); if (x.award && typeof x.award === 'object') AW = x.award; boot(); }
    if (d.knobelnestAward) { AW = d.knobelnestAward; if (booted && CUR < 0) menu(); }
  });
  send({ type: 'hello' });
  setTimeout(boot, 2500);
} else {
  try { loadST(localStorage.getItem('en')); } catch (e) {}
  if (MODE === 'srcdoc') window.addEventListener('knobelnest-sterne', function () { if (CUR < 0) menu(); });
  boot();
}

</script>
