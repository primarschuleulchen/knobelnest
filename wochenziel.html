<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}/* kn-back */#knBack,.kn-back{align-items:center;gap:6px;padding:3px 4px 3px 13px!important;min-height:0!important;height:auto!important;border-radius:999px!important;background:#fff!important;color:#1f2421!important;border:0!important;text-decoration:none;font:700 19px/1 system-ui,-apple-system,sans-serif!important;box-shadow:0 4px 14px rgba(63,120,168,.2)!important;flex:none;cursor:pointer}#knBack:not([hidden]),.kn-back{display:inline-flex}#knBack:hover,.kn-back:hover{box-shadow:0 6px 18px rgba(63,120,168,.3)!important;transform:none}#knBack img,.kn-back img{width:34px;height:34px;display:block;border-radius:50%}
</style></head><body>
<title>Mein Wochenziel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mein Wochenziel aus der Klassenkiste: Kinder setzen sich jede Woche ein Ziel und beurteilen es am Ende der Woche. Die Lehrperson sieht alle Ziele und beurteilt mit.">
<link rel="stylesheet" href="schriften/schriften.css">
<style>
/* Layout: Klassenkiste. Lehrperson im Eulenkisten-Stil (hellblau, weisse Karten mit weichem blauem Schatten, Gold-Sterne, Patrick Hand),
   Kinder im Kinderstil der Klassenkiste (kräftige schwarze Ränder, harter Schatten, Fredoka/Andika, grosse Tippflächen).
   Bewusst nur hell, damit es am Beamer und auf dem Tablet gleich aussieht wie die übrigen Klassenkisten-Werkzeuge. */
:root{
  color-scheme:light;
  --bg:#f4f9fd; --kid:#dceefc; --card:#ffffff; --ink:#1f2421; --soft:#5f6963; --line:#dbe7f1; --line2:#c5d8e8;
  --sky:#dcf0fd; --sky-2:#c9e7fb; --sky-d:#3f78a8; --gold:#d6ad45; --gold-d:#a77d1f;
  --rose:#fcefed; --rose-d:#9a3b33; --leaf:#e9f1e3; --leaf-d:#3f6b2e; --sun:#fbf3dc;
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --h:"Fredoka","Andika",system-ui,sans-serif;
  --b:"Andika","Trebuchet MS",system-ui,sans-serif;
  --schatten:0 10px 26px rgba(63,120,168,.18),0 2px 6px rgba(63,120,168,.10);
  --schatten-hoch:0 16px 34px rgba(63,120,168,.26),0 3px 8px rgba(63,120,168,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--b);font-size:17px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--soft)}
svg{display:block}

/* ---------- Grundbausteine ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:2px solid var(--ink);background:#fff;
  font-family:var(--hand);font-size:19px;box-shadow:var(--schatten);transition:transform .15s,box-shadow .15s;color:var(--ink)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--schatten-hoch)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sky)}
.btn.primary:hover{background:var(--sky-2)}
.btn.sm{min-height:38px;padding:0 13px;font-size:17px;border-radius:11px;box-shadow:0 4px 12px rgba(63,120,168,.14)}
.btn.ghost{border-color:var(--line2);box-shadow:none}
.btn.danger{border-color:#b5524a;color:var(--rose-d);box-shadow:none}
.btn.danger.armed{background:#b5524a;color:#fff}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.linkbtn{border:0;background:none;padding:2px;color:var(--sky-d);text-decoration:underline;font:inherit}
.input{min-height:46px;padding:9px 14px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;width:100%;font-family:var(--hand);font-size:19px}
textarea.input{resize:vertical;line-height:1.3}
.input:focus{outline:3px solid #9fd0f3;border-color:var(--sky-d)}
.lbl{font-family:var(--hand);font-size:18px;color:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;font-size:15px;font-family:var(--hand);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.p-none{background:var(--rose);color:var(--rose-d)}
.p-set{background:var(--sky);color:#2f5f8f}
.p-self{background:var(--sun);color:#7a5a12}
.p-done{background:var(--leaf);color:var(--leaf-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-family:var(--hand);font-size:18px}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;width:100%;padding:8px 12px 8px 16px;border-radius:14px;border:1.5px solid var(--line);
  background:#f7fbfe;color:var(--soft);text-align:left;font-family:var(--hand);font-size:18px}
.switch[aria-checked="true"]{background:var(--leaf);border-color:#7ea56a;color:var(--leaf-d)}
.track{flex:none;width:48px;height:28px;border-radius:999px;background:#9aafc6;position:relative}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
[aria-checked="true"] .track{background:#7ea56a}
[aria-checked="true"] .track::after{left:23px}
.ini{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--h);font-size:21px;font-weight:500;color:var(--ink);border:2px solid rgba(31,36,33,.15)}
.err{color:var(--rose-d);font-family:var(--hand);font-size:18px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;
  font-family:var(--hand);font-size:19px;z-index:80;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--schatten)}
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--sun);border-bottom:1.5px dashed var(--gold);padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));
  font-family:var(--hand);font-size:18px;color:#4a3d1a;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;text-align:center}
.boot{padding:80px 20px;text-align:center;font-family:var(--hand);font-size:22px;color:var(--soft)}
.sym{display:inline-grid;place-items:center}
.sym svg{width:100%;height:100%}

/* ---------- Start ---------- */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login-hero{flex:1 1 420px;background:var(--sky);padding:44px max(28px,env(safe-area-inset-left,0px)) 44px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.login-hero h1{font-family:var(--hand);font-size:clamp(40px,6vw,62px);line-height:1}
.login-hero p{font-family:var(--hand);font-size:22px;color:#36597d;max-width:28em;margin-top:12px}
.login-form{flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px 20px}
.login-form .stack{width:100%;max-width:440px;gap:16px}
.marke{display:flex;align-items:center;gap:12px;color:var(--ink)}
.marke-bild{flex:none;width:60px;height:60px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(63,120,168,.25);transform:rotate(-6deg)}
.marke-text b{display:block;font-family:var(--hand);font-size:34px;line-height:.95;font-weight:400}
.marke-text em{font-style:normal;color:var(--gold-d)}
.marke-text i{font-style:normal;color:var(--gold);font-size:.55em;vertical-align:super;margin-left:2px}
.marke-text small{display:inline-block;margin-top:3px;font-family:var(--hand);font-size:16px;color:var(--soft);border-top:1.5px dashed var(--gold);padding-top:1px}
.hero-scale{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.hero-scale figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:76px}
.hero-scale .sym{width:64px;height:64px}
.hero-scale .sym.wide{width:76px;height:auto}
.hero-scale figcaption{font-family:var(--hand);font-size:15px;line-height:1.1;text-align:center;color:#36597d}
.door{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--ink);background:#fff;box-shadow:var(--schatten);text-align:left;transition:transform .15s,box-shadow .15s}
.door:hover{transform:translateY(-2px);box-shadow:var(--schatten-hoch)}
.door .di{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--sky)}
.door .di svg{width:40px;height:40px}
.door b{display:block;font-family:var(--hand);font-size:26px;font-weight:400;line-height:1.05}
.door span span{font-family:var(--hand);font-size:17px;color:var(--soft)}
.door.kid .di{background:var(--sun)}
.storenote{font-family:var(--hand);font-size:17px;color:var(--soft);display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.storenote i{width:9px;height:9px;border-radius:50%;background:#9aafc6;flex:none}
.storenote.db i{background:#7ea56a}

/* ---------- Kinder ---------- */
.kid{min-height:100vh;background:var(--kid);padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kid-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.kid-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.kid-top .who{display:flex;align-items:center;gap:12px;font-family:var(--h);font-size:24px;font-weight:500}
.kid-btn{min-height:50px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-family:var(--h);font-weight:500;font-size:18px}
.kid h1{font-family:var(--h);font-weight:500;font-size:clamp(30px,6vw,44px);line-height:1.1}
.kid .lead{font-size:20px}
.kid-card{width:100%;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:30px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:20px}
.kid-card.narrow{max-width:600px;margin:0 auto;text-align:center}
.kid-card h2{font-family:var(--h);font-weight:500;font-size:clamp(24px,4.4vw,32px);line-height:1.15}
.kid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.kid-name{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 14px;border-radius:18px;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);text-align:left}
.kid-name:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.kid-name b{font-family:var(--h);font-size:22px;font-weight:500;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.kid-go{min-height:64px;border-radius:18px;border:0;background:#4a8bd0;color:#fff;font-family:var(--h);font-weight:500;font-size:24px;padding:0 26px;width:100%}
.kid-go:hover{background:#3b7cc4}
.kid-go[disabled]{background:#c9cfcc;color:var(--soft);cursor:default}
.kid-go.alt{background:#fff;color:var(--ink);border:3px solid var(--ink)}
.kid-go.alt:hover{background:var(--sun)}
.pwslots{display:flex;gap:12px;justify-content:center}
.pwslots span{width:72px;height:72px;border-radius:18px;border:3px dashed #9aafc6;display:grid;place-items:center;background:#fafcff}
.pwslots span.on{border-style:solid;border-color:var(--ink)}
.pwslots svg{width:54px;height:54px}
.syms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.symbtn{height:96px;border-radius:20px;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center}
.symbtn svg{width:64px;height:64px}
.symbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.goalbox{background:var(--sun);border:2.5px dashed var(--gold);border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.goalbox .wk{font-family:var(--h);font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d)}
.goalbox .gt{font-family:var(--hand);font-size:clamp(28px,5vw,40px);line-height:1.12;overflow-wrap:anywhere}
.goalbox .gp{font-family:var(--hand);font-size:21px;color:#5b4a1e;overflow-wrap:anywhere}
.goalbox .gp b{font-family:var(--h);font-weight:500;font-size:15px;letter-spacing:.05em;text-transform:uppercase;display:block;color:var(--gold-d)}
.rate{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.rate button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:14px 6px 12px;border-radius:20px;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);min-width:0}
.rate button .sym{width:min(84px,100%);aspect-ratio:1}
.rate button .sym.wide{aspect-ratio:auto;width:100%}
.rate button span.t{font-family:var(--h);font-weight:500;font-size:17px;line-height:1.1;text-align:center}
.rate button[aria-pressed="true"]{background:var(--sky);transform:translateY(3px);box-shadow:0 2px 0 var(--ink);outline:4px solid #4a8bd0;outline-offset:2px}
@media (max-width:560px){.rate{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}.rate button span.t{font-size:15px}}
.ktext{min-height:64px;border:3px solid var(--ink);border-radius:18px;background:#fafcff;padding:12px 16px;font-family:var(--hand);font-size:26px;line-height:1.2;width:100%;resize:vertical}
.ktext:focus{outline:4px solid #9fd0f3}
.ktext.small{font-size:21px;min-height:56px}
.klbl{font-family:var(--h);font-weight:500;font-size:19px;display:block;margin-bottom:6px}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.idea{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-family:var(--hand);font-size:19px;line-height:1.15;text-align:left}
.idea:hover{background:var(--sun)}
.feedback{display:flex;gap:16px;align-items:center;background:var(--leaf);border-radius:20px;padding:14px 18px}
.feedback .sym{width:62px;height:62px;flex:none}
.feedback .sym.wide{width:96px;height:auto}
.feedback p{font-family:var(--hand);font-size:21px;line-height:1.2}
.feedback small{display:block;font-family:var(--h);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-d)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.strip figure{margin:0;flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:4px}
.strip .sym{width:58px;height:58px}
.strip .sym.wide{width:72px;height:auto}
.strip .sym.leer{border:2.5px dashed #9aafc6;border-radius:50%}
.strip figcaption{font-family:var(--h);font-size:14px;color:var(--soft)}
.hist{display:flex;flex-direction:column;gap:12px}
.hitem{background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.hitem .wk{font-family:var(--h);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.hitem .gt{font-family:var(--hand);font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.hitem .cm{font-family:var(--hand);font-size:18px;color:var(--soft);overflow-wrap:anywhere}
.hitem .rs{display:flex;gap:12px;grid-row:1/span 3;grid-column:2}
.hitem .rs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.hitem .rs .sym{width:50px;height:50px}
.hitem .rs .sym.wide{width:70px;height:auto}
.hitem .rs figcaption{font-family:var(--h);font-size:13px;color:var(--soft)}
.party{font-size:0;display:flex;justify-content:center}
.party svg{width:120px;height:120px}
.kid h3{font-family:var(--h);font-weight:500;font-size:24px}

/* ---------- Lehrperson ---------- */
.lp{min-height:100vh;font-family:var(--hand);font-size:19px}
.top{background:rgba(244,249,253,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(214,173,69,.35);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in,.tabs,.main{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.topbar{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #e1edf7;border-radius:999px;padding:5px;box-shadow:var(--schatten);flex-wrap:wrap}
.topbar .btn{border:0;box-shadow:none;border-radius:999px;min-height:40px;background:transparent;font-size:18px}
.topbar .btn:hover{background:var(--sky);transform:none}
.topbar .cls{background:var(--sky);border-radius:999px;padding:6px 16px;font-size:18px}
.tabs{display:flex;gap:6px;padding-block:2px 12px;overflow-x:auto}
.tab{min-height:42px;padding:0 18px;border:1.5px solid transparent;border-radius:999px;background:none;font-family:var(--hand);font-size:19px;white-space:nowrap}
.tab:hover{background:var(--sky)}
.tab[aria-selected="true"]{background:#fff;border-color:var(--ink);box-shadow:var(--schatten)}
.main{padding-block:26px 80px;display:flex;flex-direction:column;gap:26px}
.h2{font-size:clamp(30px,4vw,40px);line-height:1.05;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h2::after{content:"✦ ✧ ✦";font-size:13px;letter-spacing:.3em;color:var(--gold)}
.card{background:linear-gradient(180deg,#fff 0%,#fff 70%,#f7fbfe 100%);border:1.5px solid #e1edf7;border-radius:26px;box-shadow:var(--schatten);padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:25px;line-height:1.1}
.card .sub{color:var(--soft);font-size:17px}
.weeknav{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e1edf7;border-radius:999px;padding:4px;box-shadow:var(--schatten)}
.weeknav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--sky);font-size:22px;line-height:1}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav .wl{padding:0 10px;text-align:center;line-height:1.05;min-width:150px}
.weeknav .wl b{display:block;font-weight:400;font-size:21px}
.weeknav .wl small{font-size:15px;color:var(--soft)}
.summary{display:flex;flex-wrap:wrap;gap:10px}
.sumbox{background:#fff;border:1.5px solid #e1edf7;border-radius:18px;padding:8px 16px;box-shadow:0 4px 12px rgba(63,120,168,.1);display:flex;align-items:baseline;gap:8px}
.sumbox b{font-family:var(--h);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.sumbox span{color:var(--soft);font-size:17px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.kc{display:flex;flex-direction:column;gap:10px;text-align:left;background:#fff;border:1.5px solid #e1edf7;border-radius:22px;box-shadow:var(--schatten);padding:14px 16px 12px;min-width:0;transition:transform .15s,box-shadow .15s}
.kc:hover{transform:translateY(-2px);box-shadow:var(--schatten-hoch)}
.kc-top{display:flex;align-items:center;gap:10px;min-width:0}
.kc-top b{font-weight:400;font-size:23px;line-height:1.05;flex:1;min-width:0;overflow-wrap:anywhere}
.kc-goal{background:var(--sun);border-radius:14px;padding:10px 12px;font-size:21px;line-height:1.15;min-height:64px;overflow-wrap:anywhere}
.kc-goal.none{background:#f4f6f8;color:#8a948e;font-size:18px;display:flex;align-items:center}
.kc-goal small{display:block;font-size:14px;color:var(--gold-d);margin-top:2px}

function saveLocal() { if (S.backend !== 'local') return; try { localStorage.setItem(LSKEY, JSON.stringify(real)); } catch (e) {} }
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem(LSKEY) || 'null'); if (o) { real.kids = o.kids || []; real.goals = o.goals || []; real.set = { ...DEF, ...(o.set || {}) }; } } catch (e) {}
}
function upsert(arr, obj) { const i = arr.findIndex(x => x.id === obj.id); if (i < 0) arr.push(obj); else arr[i] = obj; }
const strip = o => { const c = { ...o }; delete c.id; return c; };

function writeFail(e) {
  const c = e && e.code;
  toast(c === 'not_granted' ? 'Speichern geht nicht: Mit diesem Zugang darf man nur lesen.' : 'Speichern hat nicht geklappt. Bitte nochmals versuchen.');
}
const store = {
  put(col, obj) {
    upsert(D()[col], obj); render();
    if (S.demo) return;
    if (S.backend === 'db') dbRef.collection(col === 'kids' ? 'kinder' : 'ziele').doc(obj.id).set(strip(obj)).catch(writeFail);
    else saveLocal();
  },
  del(col, id) {
    const a = D()[col]; const i = a.findIndex(x => x.id === id); if (i >= 0) a.splice(i, 1); render();
    if (S.demo) return;
    if (S.backend === 'db') dbRef.collection(col === 'kids' ? 'kinder' : 'ziele').doc(id).delete().catch(writeFail);
    else saveLocal();
  },
  setSettings(p) {
    D().set = { ...D().set, ...p }; render();
    if (S.demo) return;
    if (S.backend === 'db') dbRef.doc('einstellungen/klasse').set({ ...D().set }).catch(writeFail);
    else saveLocal();
  }
};

async function init() {
  let db = null;
  try {
    if (KNW && KNW.claude) db = await KNW.claude.use('db');
    else if (window.claude && typeof window.claude.use === 'function')
      db = await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 10000))]);
  } catch (e) { db = null; }
  if (!db) { S.backend = 'local'; loadLocal(); S.screen = 'start'; render(); return; }
  dbRef = db; S.backend = 'db';
  const got = new Set();
  const ready = k => { got.add(k); if (got.size === 3 && S.screen === 'loading') { clearTimeout(timer); S.screen = knStart(); } render(); };
  const timer = setTimeout(() => {
    if (S.screen === 'loading') { S.backend = 'local'; loadLocal(); S.screen = 'start'; render(); toast('Die Klassendaten antworten nicht. Es wird vorerst nur auf diesem Gerät gespeichert.'); }
  }, 10000);
  const onErr = () => { if (KNW) { clearTimeout(timer); S.screen = 'knaus'; render(); return; } if (S.screen === 'loading') { clearTimeout(timer); S.backend = 'local'; loadLocal(); S.screen = 'start'; render(); } };
  db.collection('kinder').onSnapshot(s => { if (S.backend !== 'db') return; real.kids = s.docs.map(d => ({ id: d.id, ...d.data() })); ready('k'); }, onErr);
  db.collection('ziele').onSnapshot(s => { if (S.backend !== 'db') return; real.goals = s.docs.map(d => ({ id: d.id, ...d.data() })); ready('g'); }, onErr);
  db.doc('einstellungen/klasse').onSnapshot(s => { if (S.backend !== 'db') return; real.set = { ...DEF, ...(s.exists ? s.data() : {}) }; ready('s'); }, onErr);
}

const goalAt = (id, wk) => D().goals.find(g => g.kind === id && g.woche === wk);
function streak(g) {
  let n = 1, wk = g.woche;
  for (;;) { const p = goalAt(g.kind, addWeeks(wk, -1)); if (p && norm(p.text) === norm(g.text)) { n++; wk = p.woche; } else break; }

}

const $app = document.getElementById('app');
function render() {
  const a = document.activeElement;
  const keep = a && a.id && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  const drafts = {};
  $app.querySelectorAll('textarea[id],input[id]').forEach(el => { if (el.dataset.dirty) drafts[el.id] = el.value; });
  const sc = document.querySelector('.sheet-body'); const sheetTop = sc ? sc.scrollTop : 0;
  let h = '';
  if (S.demo) h += `<div class="demobar"><span><b>Beispielklasse</b> mit erfundenen Namen · nichts wird gespeichert · Bildpasswort ist hier ausgeschaltet</span><button class="btn sm" data-a="demoEnd">Beispiel beenden</button></div>`;
  switch (S.screen) {

    case 'knaus': h += `<div class="kid"><div class="kid-in"><div class="kid-card narrow"><h2>Mein Wochenziel ist gerade zu.</h2><p class="lead">Frag deine Lehrperson.</p></div></div></div>`; break;
    case 'start': h += vStart(); break;
    case 'kidpick': h += vKidPick(); break;
    case 'kidpw': h += vKidPw(); break;
    case 'kid': h += vKid(); break;
    case 'lppin': h += vLpPin(); break;
    case 'lp': h += vLp(); break;
  }
  if (KNT && (S.screen === 'kidpick' || S.screen === 'kid'))
    h = `<div class="knlpbar"><span>👁 Kinderansicht${S.screen === 'kid' && kidById(S.kidId) ? ' · so sieht es ' + esc(kidById(S.kidId).name) : ' · wähle ein Kind'}</span><button class="btn sm" data-a="knLp">Zur Übersicht</button></div>` + h;
  $app.innerHTML = h;
  for (const id in drafts) { const el = document.getElementById(id); if (el) { el.value = drafts[id]; el.dataset.dirty = '1'; } }
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  const sc2 = document.querySelector('.sheet-body'); if (sc2) sc2.scrollTop = sheetTop;
}

      <h2>${title}</h2>
      <div class="goalbox"><span class="wk">${kw(g.woche)} · ${weekRange(g.woche)}${streak(g) > 1 ? ` · ${streak(g)}. Woche` : ''}</span><p class="gt">${esc(g.text)}</p>
        ${g.plan ? `<p class="gp"><b>So schaffe ich das</b>${esc(g.plan)}</p>` : ''}</div>
      ${hint || ''}
    </div>`;

  if (past) {
    main = rateCard(past, `Wie lief dein Ziel aus ${kw(past.woche)}?`);
  } else if (cur && !cur.kindBew && !S.editing) {
    main = S.rateSel !== null && S.rateOpen
      ? rateCard(cur, 'Wie lief deine Woche?')
      : showGoal(cur, 'Mein Wochenziel', `<div class="row"><button class="kid-go" style="flex:1 1 260px" data-a="openRate">Woche beurteilen</button>
          ${!cur.lpBew ? `<button class="kid-btn" data-a="editGoal">Ziel ändern</button>` : ''}</div>
          <p class="muted" style="text-align:center">Am Ende der Woche tippst du auf «Woche beurteilen».</p>`);
  } else if (S.editing && cur && !cur.kindBew) {
    main = goalForm(cw);
  } else if (!cur) {
    main = goalForm(cw, null);
  } else if (!next || (S.editing && next)) {
    main = next && !S.editing ? '' : goalForm(nw, cur);
  }
  if (!main && next) {
    main = showGoal(next, 'Dein Ziel für nächste Woche', `${!next.lpBew ? `<div class="row"><button class="kid-btn" data-a="editGoal" data-wk="${next.woche}">Ziel ändern</button></div>` : ''}
      <p class="lead" style="text-align:center">Super, alles erledigt!${KNT ? '' : ' Du kannst jetzt auf «Fertig» tippen.'}</p>`);
  }

  // Rückmeldung der Lehrperson zur letzten beurteilten Woche
  let fb = '';
  if (set.lpSichtbar) {
    const lastLp = [...gs].reverse().find(g => g.lpBew || g.lpKom);
    if (lastLp) fb = `<div class="feedback">${lastLp.lpBew ? symHtml(lastLp.lpBew) : ''}<p><small>Deine Lehrperson zu ${kw(lastLp.woche)}</small>${lastLp.lpBew ? esc(label(lastLp.lpBew, set.stufen)) + '. ' : ''}${esc(lastLp.lpKom || '')}</p></div>`;
  }

  const recent = gs.filter(g => g.kindBew).slice(-10);
  const hist = [...gs].reverse().filter(g => g.kindBew);
  return `<div class="kid"><div class="kid-in">
    <div class="kid-top"><span class="who">${iniHtml(k)}Hallo ${esc(k.name)}</span><button class="kid-btn" data-a="kidDone">${KNT ? '‹ Anderes Kind' : 'Fertig'}</button></div>
    ${main}
    ${fb}
    ${recent.length ? `<section class="stack"><h3>Meine Wochen</h3><div class="strip">${recent.map(g => `<figure>${symHtml(g.kindBew)}<figcaption>${kw(g.woche)}</figcaption></figure>`).join('')}</div></section>` : ''}
    ${hist.length ? `<section class="stack"><h3>Meine Ziele bisher</h3><div class="hist">${hist.map(g => `<div class="hitem">
        <span class="wk">${kw(g.woche)} · ${weekRange(g.woche)}</span><p class="gt">${esc(g.text)}</p>
        ${g.kindKom ? `<p class="cm">«${esc(g.kindKom)}»</p>` : '<span></span>'}
        <div class="rs"><figure>${symHtml(g.kindBew)}<figcaption>Ich</figcaption></figure>${set.lpSichtbar && g.lpBew ? `<figure>${symHtml(g.lpBew)}<figcaption>Lehrperson</figcaption></figure>` : ''}</div>
      </div>`).join('')}</div></section>` : ''}
  </div></div>`;
}

        <span class="kc-top">${iniHtml(k)}<b>${esc(k.name)}</b>${status(g)}</span>

        <span class="kc-foot"><figure>${symHtml(g && g.kindBew)}Kind</figure><figure>${symHtml(g && g.lpBew)}Sie</figure><span class="more">Verlauf ›</span></span>
      </button>`).join('')}</div>` : `<div class="empty"><p>In diesem Filter ist gerade niemand.</p></div>`}

      </article>`).join('') : `<div class="empty"><p>${esc(k.name)} hat noch kein Wochenziel gesetzt.</p></div>`}

/* ================= Aktionen ================= */
let toastT;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
function kidReset() { S.kidId = null; S.pwSel = []; S.pwErr = false; S.rateSel = null; S.rateOpen = false; S.editing = false; S.justDone = false; }
const go = sc => { S.screen = sc; S.armed = null; render(); window.scrollTo(0, 0); };

document.addEventListener('input', e => { if (e.target.id) e.target.dataset.dirty = '1'; });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  if (t.dataset.a === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('.x')) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a !== 'delKid' && a !== 'delGoal') S.armed = null;
  switch (a) {
    case 'home': if (KNK) { try { KNW.back(); } catch (e) {} break; }
      if (KNT) { kidReset(); go('lp'); break; }
      kidReset(); S.lpOk = false; go('start'); break;
    case 'knLp': kidReset(); go('lp'); break;
    case 'demo': demoData = makeDemo(); S.demo = true; kidReset(); S.lpOk = true; go('start'); break;
    case 'demoEnd': S.demo = false; demoData = null; kidReset(); S.lpOk = false; S.openKid = null; go('start'); break;
    case 'goKid': kidReset(); S.openKid = null; if (!S.demo && !KNT) S.lpOk = false; go('kidpick'); break;
    case 'pickKid': {
      kidReset(); S.kidId = id;
      const k = kidById(id);
      go(!KNW && D().set.bildpw && k && (k.pw || []).length === 3 ? 'kidpw' : 'kid'); break;
    }
    case 'pw': {
      if (S.pwSel.length >= 3) break;
      S.pwSel.push(t.dataset.k); S.pwErr = false;
      if (S.pwSel.length === 3) {
        const k = kidById(S.kidId);
        if (k && S.pwSel.join() === (k.pw || []).join()) { S.pwSel = []; go('kid'); }
        else { render(); setTimeout(() => { S.pwSel = []; S.pwErr = true; render(); }, 450); }
      } else render();
      break;
    }
    case 'pwClear': S.pwSel = []; S.pwErr = false; render(); break;
    case 'kidDone': if (KNK) { try { KNW.back(); } catch (e) {} break; } kidReset(); go('kidpick'); break;
    case 'openRate': S.rateOpen = true; S.rateSel = 0; render(); break;
    case 'rateKid': S.rateSel = Number(t.dataset.l); render(); break;
    case 'saveRate': {
      const g = D().goals.find(x => x.id === id); if (!g || !S.rateSel) break;
      store.put('goals', { ...g, kindBew: S.rateSel, kindKom: val('kidKom').trim(), bewertetAm: Date.now() });
      S.rateSel = null; S.rateOpen = false; S.justDone = true; S.editing = false; render(); window.scrollTo(0, 0); break;
    }
    case 'editGoal': S.editing = true; render(); break;
    case 'cancelEdit': S.editing = false; render(); break;
    case 'idea': { const el = document.getElementById('zielText'); if (el) { el.value = D().set.ideen[Number(t.dataset.i)] || ''; el.dataset.dirty = '1'; el.focus(); } break; }
    case 'sameGoal': {
      const gs = goalsOf(S.kidId), last = gs[gs.length - 1]; if (!last) break;
      const a1 = document.getElementById('zielText'), a2 = document.getElementById('zielPlan');
      if (a1) { a1.value = last.text; a1.dataset.dirty = '1'; } if (a2) { a2.value = last.plan || ''; a2.dataset.dirty = '1'; }
      if (a1) a1.focus();
      break;
    }
    case 'saveGoal': {
      const text = val('zielText').trim(), wk = t.dataset.wk;
      if (text.length < 3) { const er = document.getElementById('zielErr'); if (er) er.textContent = 'Schreib zuerst dein Ziel auf.'; break; }
      const old = goalAt(S.kidId, wk);
      store.put('goals', { ...(old || {}), id: old ? old.id : S.kidId + '_' + wk, kind: S.kidId, woche: wk, text, plan: val('zielPlan').trim(),
        kindBew: old ? old.kindBew || null : null, kindKom: old ? old.kindKom || '' : '', lpBew: old ? old.lpBew || null : null, lpKom: old ? old.lpKom || '' : '', erstellt: old ? old.erstellt : Date.now() });
      S.editing = false; S.justDone = false; render(); window.scrollTo(0, 0); toast('Dein Ziel ist gespeichert.'); break;
    }
    case 'goLp': S.openKid = null; if (S.demo || S.lpOk) go('lp'); else { S.pinErr = ''; go('lppin'); setTimeout(() => { const el = document.getElementById('pinIn') || document.getElementById('pinNew'); if (el) el.focus(); }, 30); } break;
    case 'noPin': S.lpOk = true; go('lp'); break;
    case 'lpLogout': S.lpOk = false; S.openKid = null; go('start'); break;
    case 'tab': S.lpTab = t.dataset.t; S.openKid = null; render(); break;
    case 'wk': { const nw = addWeeks(S.lpWeek, Number(t.dataset.d)); if (nw <= addWeeks(thisWeek(), 1)) { S.lpWeek = nw; render(); } break; }
    case 'filt': S.lpFilter = t.dataset.f; render(); break;
    case 'openKid': S.openKid = id; render(); setTimeout(() => { const x = document.querySelector('.sheet .x'); if (x) x.focus(); }, 30); break;
    case 'closeSheet': S.openKid = null; render(); break;
    case 'lpRate': {
      const g = D().goals.find(x => x.id === id); if (!g) break;
      const l = Number(t.dataset.l);
      store.put('goals', { ...g, lpBew: g.lpBew === l ? null : l, lpAm: Date.now() }); break;
    }
    case 'lpKom': {
      const g = D().goals.find(x => x.id === id); if (!g) break;
      const el = document.getElementById('lpk_' + id); if (el) delete el.dataset.dirty;
      store.put('goals', { ...g, lpKom: el ? el.value.trim() : '' }); toast('Rückmeldung gespeichert.'); break;
    }
    case 'delGoal':
      if (S.armed === 'g' + id) { S.armed = null; store.del('goals', id); toast('Ziel gelöscht.'); } else { S.armed = 'g' + id; render(); } break;
    case 'delKid':
      if (S.armed === 'k' + id) { S.armed = null; D().goals.filter(g => g.kind === id).forEach(g => store.del('goals', g.id)); store.del('kids', id); toast('Kind entfernt.'); }
      else { S.armed = 'k' + id; render(); } break;
    case 'newPw': { const k = kidById(id); if (k) store.put('kids', { ...k, pw: randomPw() }); break; }
    case 'mode': store.setSettings({ modus: t.dataset.m }); break;
    case 'stufen': store.setSettings({ stufen: Number(t.dataset.n) }); break;
    case 'tgl': store.setSettings({ [t.dataset.k]: !D().set[t.dataset.k] }); break;
    case 'pinOff': store.setSettings({ pinH: '' }); toast('PIN entfernt.'); break;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.openKid) { S.openKid = null; render(); } });

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-f]'); if (!f) return;
  e.preventDefault();
  const clean = ids => ids.forEach(i => { const el = document.getElementById(i); if (el) delete el.dataset.dirty; });
  switch (f.dataset.f) {
    case 'pin':
      if (hash(val('pinIn')) === D().set.pinH) { S.lpOk = true; S.pinErr = ''; go('lp'); }
      else { S.pinErr = 'Die PIN stimmt nicht.'; render(); const el = document.getElementById('pinIn'); if (el) { el.value = ''; el.focus(); } }
      break;
    case 'pinNew': {
      const p = val('pinNew').trim();
      if (p.length < 4) { S.pinErr = 'Die PIN braucht mindestens 4 Zeichen.'; render(); break; }
      store.setSettings({ pinH: hash(p) }); S.lpOk = true; S.pinErr = ''; go('lp'); toast('PIN gespeichert.'); break;
    }
    case 'pinChange': {
      const p = val('pinChg').trim(); clean(['pinChg']);
      if (p.length < 4) { toast('Die PIN braucht mindestens 4 Zeichen.'); break; }
      store.setSettings({ pinH: hash(p) }); toast('Neue PIN gespeichert.'); break;
    }
    case 'addKids': {
      const names = val('newKids').split(/\n|,|;/).map(s => s.trim()).filter(Boolean);
      if (!names.length) { toast('Bitte mindestens einen Namen eintragen.'); break; }
      const start = D().kids.length;
      clean(['newKids']); const ta = document.getElementById('newKids'); if (ta) ta.value = '';
      names.forEach((n, i) => store.put('kids', { id: uid('k_'), name: n.slice(0, 40), farbe: FARBEN[(start + i) % FARBEN.length], pw: randomPw(), erstellt: Date.now() + i }));
      toast(names.length === 1 ? names[0] + ' ist eingetragen.' : names.length + ' Kinder eingetragen.'); break;
    }
    case 'klasse': clean(['klasseIn']); store.setSettings({ klasse: val('klasseIn').trim().slice(0, 40) }); toast('Gespeichert.'); break;
    case 'ideen': clean(['ideenIn']); store.setSettings({ ideen: val('ideenIn').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 30) }); toast('Ideen gespeichert.'); break;
  }
});

init();
})();
</script>
