<title>Lernpfade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Patrick Hand";src:url(data:font/woff2;base64,%%FONT%%) format("woff2");font-weight:400;font-display:swap}
/* Stil der Eulenkiste: helles Himmelblau, weisse Karten mit weichem blauem Schatten, Gold-Akzente, Handschrift.
   Aufbau: eine Spalte, die Karte füllt die Breite; im Bearbeiten links Formular, rechts Vorschau. Bewusst nur hell (wie Eulenkiste/Klassenkiste). */
:root{
  --bg:#f4f9fd; --ink:#1f2421; --soft:#5f6963; --line:#dbe7f1; --line2:#c5d8e8; --card:#fff;
  --sky:#dcf0fd; --sky-d:#3f78a8; --gold:#d6ad45; --gold-d:#b98d24; --sun:#fbf3dc; --leaf:#e9f1e3; --leaf-d:#3f6b2e; --rose:#fcefed; --rose-d:#9a3b33;
  --h:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --sch:0 10px 26px rgba(63,120,168,.18),0 2px 6px rgba(63,120,168,.10);
  --sch-h:0 16px 34px rgba(63,120,168,.26),0 3px 8px rgba(63,120,168,.14);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--h);font-size:19px;line-height:1.35}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
.muted{color:var(--soft)}
.stars{color:var(--gold);letter-spacing:.2em}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-size:18px;box-shadow:var(--sch);cursor:pointer;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sch-h)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sky)}
.btn.gold{background:var(--sun)}
.btn.danger{border-color:#b5524a;color:var(--rose-d);box-shadow:none}
.btn.sm{min-height:38px;font-size:16px;border-radius:11px;padding:0 12px;box-shadow:0 4px 12px rgba(63,120,168,.14)}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.back:focus-visible{outline:3px solid #9fd0f3;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:16px;background:#fff;border:1.5px solid var(--line2)}
.seg button{border:1.5px solid transparent;background:none;border-radius:12px;min-height:36px;padding:0 12px;font-size:17px;cursor:pointer}
.seg button:hover{background:var(--sky)}
.seg button[aria-pressed="true"]{background:var(--sky);border-color:var(--ink)}
.seg.art button[data-v="z"][aria-pressed="true"]{background:var(--sun)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 6px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:17px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip svg{flex:none}
.chip.help{background:var(--rose);border-color:#e3a59d}

/* Kopf */
.back{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 13px;border-radius:999px;background:#fff;border:0;font:700 19px/1 system-ui,-apple-system,sans-serif;box-shadow:0 4px 14px rgba(63,120,168,.2);cursor:pointer;flex:none}
.back img{width:34px;height:34px;border-radius:50%;display:block}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.bar .ttl{flex:1 1 260px;min-width:0}
.bar h1{font-size:34px}
.bar .sub{color:var(--soft);font-size:18px}
.bar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-block:10px 4px}
.hero img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),var(--sch)}
.hero h1{font-size:46px}
.hero p{margin:4px 0 0;max-width:62ch;color:var(--soft);font-size:19px}

/* Karten */
.card{background:linear-gradient(180deg,#fff 0%,#fff 70%,#f7fbfe 100%);border:1.5px solid #e1edf7;border-radius:28px;box-shadow:var(--sch);padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;overflow:hidden;padding:0}
.pcard .thumb{display:block;border:0;padding:0;background:none;cursor:pointer;border-bottom:1.5px solid #e1edf7}
.pcard .thumb svg{display:block;width:100%;height:auto}
.pcard .pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h2{font-size:26px}
.pcard p{margin:0;color:var(--soft);font-size:17px}
.pcard .row{margin-top:auto}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:260px;border:2.5px dashed var(--gold);border-radius:28px;background:var(--sun);cursor:pointer;font-size:24px;color:#5a4612}
.newcard:hover{background:#f8ebc4}
.newcard b{font-weight:400;font-size:54px;line-height:1}
.note{background:var(--sun);border:1.5px dashed var(--gold);border-radius:20px;padding:12px 16px;color:#4a3d1a;font-size:17px}

/* Karte */
.mapcard{background:#fff;border:1.5px solid #e1edf7;border-radius:28px;box-shadow:var(--sch);overflow:hidden}
.map{position:relative}
.mapsvg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mapsvg text{font-family:var(--h)}
.mapsvg .lbl{font-size:17px;fill:#1f2421;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.mapsvg .tag{font-size:25px;fill:#1f2421;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.mapsvg .zt{font-size:28px;fill:#1f2421;text-anchor:end;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
.mapsvg .tkn{font-size:14px;fill:#1f2421;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.mapsvg .num{font-size:19px;fill:#1f2421;text-anchor:middle;dominant-baseline:central}
.mapsvg .dn{font-size:14px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.v-schatz .lbl,.v-schatz .tag,.v-schatz .zt,.v-schatz .tkn{stroke:#f3e3bd}
.stn{cursor:pointer}
.stn:hover .badge,.stn:focus-visible .badge{stroke-width:3.5}
.stn:focus{outline:none}
.stn.tgt .badge{stroke:#e4572e;stroke-width:4}
.spot.tgt .ring{stroke:#e4572e;stroke-width:4}
.tok{cursor:grab;touch-action:none}
.tok:hover .tkn{font-size:16px}
.dragging{opacity:.25}
.dock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1.5px solid #e1edf7;background:#f7fbfe;min-height:62px}
.dock.tgt{background:var(--sky)}
.dock .docklbl{color:var(--soft);font-size:17px;margin-right:4px}
.dock [data-kid]{touch-action:none;cursor:grab}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;display:flex;flex-direction:column;align-items:center;margin:-40px 0 0 -30px;width:60px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.ghost span{background:#fff;border-radius:999px;padding:0 8px;font-size:16px;white-space:nowrap}
body.dragmode{cursor:grabbing}
.mapcard:fullscreen{border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;background:var(--bg)}
.mapcard:fullscreen .mapsvg{max-height:calc(100vh - 80px);width:auto;margin:0 auto}

.info{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.info h3{font-size:22px;margin-bottom:8px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:17px}
.legend div{display:flex;align-items:center;gap:10px}
.legend svg{flex:none}
.kids{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.info{grid-template-columns:1fr}.bar h1{font-size:28px}.hero h1{font-size:36px}}

/* Bearbeiten */
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.prevcol{position:sticky;top:12px;padding:12px}
.prevcol .mapsvg{border-radius:18px}
@media (max-width:900px){.edgrid{grid-template-columns:1fr}.prevcol{position:static}}
.edcol{display:flex;flex-direction:column;gap:10px}
.edcol h3{font-size:24px;margin-top:10px}
.edcol h3 small{font-size:17px;color:var(--soft)}
.fl{font-size:17px;color:var(--soft)}
.inp{width:100%;box-sizing:border-box;min-height:46px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;font-size:19px}
.inp.sm{min-height:38px;font-size:17px;padding:5px 12px}
textarea.inp{min-height:150px;resize:vertical;line-height:1.3}
.inp:focus{outline:3px solid #9fd0f3;border-color:var(--sky-d)}
.varpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.varpick button{border:2px solid var(--line2);border-radius:18px;background:#fff;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:18px}
.varpick button svg{width:100%;height:auto;border-radius:12px;display:block}
.varpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--sky);box-shadow:var(--sch)}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border:1.5px solid var(--line);border-radius:18px;background:#fff}
.trow.z{background:#fffbef;border-color:#ecd9a4;margin-left:22px}
.tnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);background:#fff;font-size:19px;margin-top:4px}
.trow.z .tnum{background:#ffd75e;border-color:var(--gold-d)}
.trow.i{background:#eef5f1;border-color:#b9d3c6}
.trow.i .tnum{border-radius:8px;background:#2f5d50;border-color:#8a5a2f;font-size:17px}
.seg.art button[data-v="i"][aria-pressed="true"]{background:#d3e8dc}
.inpbtn{background:#eef5f1}
.tmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .seg button{min-height:32px;font-size:16px;padding:0 9px}
.tbtns{display:flex;flex-direction:column;gap:4px}
.ib{width:36px;height:34px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;font-size:17px}
.ib:hover{border-color:var(--ink)}
.ib:disabled{opacity:.3;cursor:default}

/* Fenster */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(31,36,33,.35);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{position:relative;background:#fff;border-radius:26px;box-shadow:var(--sch-h);padding:20px;width:100%;max-width:620px;margin-top:4vh;display:flex;flex-direction:column;gap:12px}
.modal.wide{max-width:1000px}
.modal h2{font-size:30px;display:flex;align-items:center;gap:10px;padding-right:40px}
.modal .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;cursor:pointer;font-size:18px}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:14px;border:1.5px solid var(--line)}
.slist li.here{border-color:var(--ink);background:var(--sky)}
.slist li.z{margin-left:20px;background:#fffbef}
.slist li.z.here{background:var(--sky)}
.slist .t{flex:1;min-width:0}
.slist small{display:block;color:var(--soft);font-size:15px}
.b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);background:#fff;font-size:17px}
.b.z{background:#ffd75e;border-color:var(--gold-d)}
.b.s{background:var(--leaf);border-color:var(--leaf-d)}
.b.i{border-radius:7px;background:#2f5d50;border-color:#8a5a2f;font-size:16px}
.slist li.i{background:#eef5f1}
.slist li.i.here{background:var(--sky)}
.lnk{display:inline-flex;align-items:center;padding:0 10px;text-decoration:none;color:#fff;background:var(--sky-d);border-color:var(--sky-d);white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
.chk{min-width:44px;height:38px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;font-size:16px;color:var(--soft)}
.chk.on{background:#2e9e6a;border-color:#2e9e6a;color:#fff}
.hbtn{min-height:52px;border-radius:16px;border:2px solid #b5524a;background:#fff;color:var(--rose-d);font-size:21px;cursor:pointer}
.hbtn.on{background:#e4572e;color:#fff;border-color:#e4572e}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:16px}
table{border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:400;color:var(--soft)}
th.z{color:var(--gold-d)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
td .chk{min-width:36px;height:32px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:18px;box-shadow:var(--sch-h);pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px)}
.toast[hidden]{display:block!important;opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var EULE='data:image/webp;base64,%%EULE%%';
var KEY='kn_lernpfade_v2';
var NS='http://www.w3.org/2000/svg';
var FARBEN=['#e4572e','#3f78a8','#2e9e6a','#e0a020','#8e5cc2','#e07bb0','#1fa3b5','#a0522d','#6b8e23','#ff8c42','#5c6bc0','#c0392b','#16a085','#d35400','#7d3c98','#2c3e50'];
var VARS=['meer','schatz','berge'];
var VAR={
  meer:  {name:'Meer',        icon:'⛵', figur:'Schiffchen', dein:'dein Schiffchen', hilfe:'🛟', stufen:['kleiner Leuchtturm','mittlerer Leuchtturm','grosser Leuchtturm']},
  schatz:{name:'Schatzkarte', icon:'🗺️', figur:'Stecknadel', dein:'deine Stecknadel', hilfe:'🧭', stufen:['kleine Insel','mittlere Insel','grosse Insel']},
  berge: {name:'Berge',       icon:'⛰️', figur:'Fähnchen',   dein:'dein Fähnchen',   hilfe:'🛖', stufen:['flacher Hügel','Hügel','hoher Berg']}
};
var STUFE=['leicht','mittel','schwer'];

var S, V={v:'liste'}, M=null, UID=0, D=null, prevT=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function cur(){return S.pfade.find(function(p){return p.id===V.id})}
function kidOf(p,id){return p.kids.find(function(k){return k.id===id})}

/* ---------- Speicher (nur dieser Browser) ---------- */
function load(){
  try{var r=localStorage.getItem(KEY)||localStorage.getItem('kn_lernpfade_v1'); if(r){var o=JSON.parse(r); if(o&&Array.isArray(o.pfade)){S=o; return;}}}catch(e){}
  S={pfade:demo()};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function fix(p){
  var ids={}; p.tasks.forEach(function(t){ids[t.id]=1});
  var st={};
  p.kids.forEach(function(k){
    var s=p.st&&p.st[k.id]||{at:'start',hilfe:false,done:{}};
    if(s.at!=='start'&&s.at!=='ziel'&&!ids[s.at]) s.at='start';
    s.done=s.done||{}; Object.keys(s.done).forEach(function(t){if(!ids[t]||!s.done[t]) delete s.done[t]});
    st[k.id]=s;
  });
  p.st=st;
}
function moveKid(p,kid,to){
  var s=p.st[kid]; if(!s) return;
  if(to==='hilfe'){s.hilfe=true; return;}
  s.hilfe=false; s.at=to;
  if(to==='ziel'){p.tasks.forEach(function(t){if(onPath(t)) s.done[t.id]=true});}
  else if(to!=='start'){
    var i=p.tasks.findIndex(function(t){return t.id===to});
    p.tasks.slice(0,i).forEach(function(t){if(onPath(t)) s.done[t.id]=true});
  }
}
function whereText(p,kid){
  var s=p.st[kid]; if(!s) return '';
  if(s.hilfe) return 'braucht Hilfe';
  if(s.at==='start') return 'am Start';
  if(s.at==='ziel') return 'am Ziel';
  var t=p.tasks.find(function(x){return x.id===s.at}); if(!t) return 'am Start';
  return t.art==='z' ? 'bei Zusatz «'+t.t+'»' : t.art==='i' ? 'beim Input «'+t.t+'»' : 'bei Aufgabe '+numOf(p,t.id);
}
function numOf(p,id){var n=0,r='★';p.tasks.forEach(function(t){if(t.art==='p'){n++; if(t.id===id) r=String(n);} else if(t.art==='i'&&t.id===id) r=INP;});return r;}
var INP='🧑‍🏫';
function sym(t,n){return t.art==='z'?'★':t.art==='i'?INP:n;}
function artName(t,lang){return t.art==='z'?(lang?'Zusatzaufgabe':'Zusatz'):t.art==='i'?'Input der Lehrperson':(lang?'Pflichtaufgabe':'Pflicht');}
function onPath(t){return t.art!=='z';}
function safeUrl(u){u=String(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; try{var x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}}
function linkBtn(t,cls,txt){var u=safeUrl(t.link); return u?'<a class="'+cls+'" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" aria-label="Aufgabe öffnen: '+esc(t.t)+'">'+txt+'</a>':'';}
function targetName(p,to){
  if(to==='hilfe') return 'bei «Hilfe»';
  if(to==='start') return 'am Start';
  if(to==='ziel') return 'am Ziel 🎉';
  var t=p.tasks.find(function(x){return x.id===to});
  return t ? (t.art==='z'?'bei der Zusatzaufgabe «'+t.t+'»':t.art==='i'?'beim Input «'+t.t+'»':'bei Aufgabe '+numOf(p,to)) : '';
}

/* ---------- Beispiele (erfundene Namen) ---------- */
function mk(title,ziel,variant,tasks,names,places){
  var p={id:uid(),title:title,ziel:ziel,variant:variant,
    tasks:tasks.map(function(t){return {id:uid(),t:t[0],info:t[1]||'',art:t[2]||'p',stufe:t[3]||1,link:t[4]||''}}),kids:[],st:{}};
  names.forEach(function(n,i){var k={id:uid(),name:n,farbe:FARBEN[i%FARBEN.length]}; p.kids.push(k); p.st[k.id]={at:'start',hilfe:false,done:{}};});
  places.forEach(function(pl){
    var k=p.kids[pl[0]].id; moveKid(p,k,typeof pl[1]==='number'?p.tasks[pl[1]].id:pl[1]); if(pl[2]) p.st[k].hilfe=true;
  });
  return p;
}
function demo(){
  var N=['Lena','David','Mia','Noah','Emily','Luca','Sara','Jonas','Lia','Tim'];
  return [
    mk('dass oder das?','Ich bin ein Rechtschreib-Profi!','meer',[
      ['Input: das oder dass?','Montag, 9 Uhr','i',1],['Regel lesen','Buch S. 9','p',1],['Arbeitsblatt 1','«das» als Begleiter','p',1],['Arbeitsblatt 2','«dass» nach dem Komma','p',2],
      ['Rätselkarten','Zusatzkiste','z',2],['Lesetext','alle das/dass markieren','p',2],['Partnerdiktat','zu zweit','p',3],['Eigene Sätze','5 Sätze mit «dass»','z',3]
    ],N,[[0,3],[1,2],[2,5],[3,4],[4,'ziel'],[5,3,true],[6,1],[7,6]]),
    mk('Einmaleins-Schatzsuche','Ich kenne das Einmaleins!','schatz',[

function mapSVG(p,opt){
  opt=opt||{};
  var v=ART[p.variant]?p.variant:'meer', A=ART[v], L=layout(p), u='m'+(++UID), R=rng(p.id+v);
  var o='<svg class="mapsvg v-'+v+'" viewBox="0 0 1000 640" role="img" aria-label="Lernpfad '+esc(p.title)+' als '+VAR[v].name+'">';
  o+=A.bg(L,u,R);
  L.st.forEach(function(s){o+=A.land(s)});
  o+=A.path(L.d);
  L.st.forEach(function(s){
    if(s.t.art==='z') o+='<path d="M'+f1(s.px)+' '+f1(s.py)+' L'+f1(s.x)+' '+f1(s.y)+'" stroke="'+A.conn+'" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none"/>';
  });
  o+=A.spots(L);
  o+='<text class="zt" x="965" y="46">'+esc(p.ziel||'')+'</text>';
  L.st.forEach(function(s){
    var done=0; p.kids.forEach(function(k){if(p.st[k.id]&&p.st[k.id].done[s.t.id]) done++;});
    o+='<g class="stn" data-st="'+s.t.id+'"'+(opt.mini?'':' tabindex="0" role="button" aria-label="'+esc((s.t.art==='z'?'Zusatz: ':s.t.art==='i'?'Input: ':'Aufgabe '+s.num+': ')+s.t.t)+'"')+'>';
    o+= s.t.art==='z'
      ? '<circle class="badge" cx="'+f1(s.x)+'" cy="'+f1(s.y)+'" r="14" fill="#ffd75e" stroke="#b98d24" stroke-width="2.2"/>'
      : s.t.art==='i' ? board(s.x,s.y,v) : A.mark(s);
    if(s.t.art!=='i') o+='<text class="num" x="'+f1(s.x)+'" y="'+f1(s.y+1)+'"'+(s.t.art==='z'?' fill="#6b4a00" style="fill:#6b4a00"':'')+'>'+s.num+'</text>';
    if(safeUrl(s.t.link)&&!opt.mini) o+='<g transform="translate('+f1(s.x+(s.t.art==='i'?27:16))+' '+f1(s.y+(s.t.art==='i'?-14:-15))+')"><circle r="9" fill="#3f78a8" stroke="#fff" stroke-width="1.5"/><path d="M-3 3 L3 -3 M-1 -3.5 H3.5 V1" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>';
    o+=textLines(s.x,s.y+(s.t.art==='p'?42:36),wrap(s.t.t,15),'lbl');
    if(done&&!opt.mini) o+='<g transform="translate('+f1(s.x-32)+' '+f1(s.y-16)+')"><rect x="-17" y="-10" width="34" height="20" rx="10" fill="#2e9e6a"/><text class="dn" y="1">✓'+done+'</text></g>';
    o+='</g>';
  });
  if(!opt.mini) o+=tokens(p,L);
  return o+'</svg>';
}

    var s=p.st[k.id], n=0;
    c='<h2>'+figSVG(p.variant,k.farbe,40)+esc(k.name)+'</h2><p class="muted" style="margin:0">Tippe auf «Hier», wo du gerade arbeitest. Erledigtes hakst du mit ✓ ab.</p>'+
      '<button class="hbtn'+(s.hilfe?' on':'')+'" data-a="hilfe">'+VAR[p.variant].hilfe+' '+(s.hilfe?'Ich brauche Hilfe (antippen = erledigt)':'Ich brauche Hilfe')+'</button><ol class="slist">';
    c+='<li class="'+(s.at==='start'?'here':'')+'"><span class="b s">S</span><div class="t">Start</div><button class="chk'+(s.at==='start'?' on':'')+'" data-a="go" data-to="start">Hier</button></li>';
    p.tasks.forEach(function(t){
      if(t.art==='p') n++;
      c+='<li class="'+(t.art!=='p'?t.art+' ':'')+(s.at===t.id?'here':'')+'"><span class="b '+t.art+'">'+sym(t,n)+'</span>'+
        '<div class="t">'+esc(t.t)+'<small>'+(t.info?esc(t.info)+' · ':'')+artName(t)+(t.art==='i'?'':' · '+STUFE[t.stufe-1])+'</small></div>'+
        linkBtn(t,'chk lnk','🔗 Öffnen')+
        '<button class="chk'+(s.done[t.id]?' on':'')+'" data-a="done" data-t="'+t.id+'" aria-label="erledigt">✓</button>'+
        '<button class="chk'+(s.at===t.id?' on':'')+'" data-a="go" data-to="'+t.id+'">Hier</button></li>';
    });
    c+='<li class="'+(s.at==='ziel'?'here':'')+'"><span class="b s">🏁</span><div class="t">Ziel<small>'+esc(p.ziel)+'</small></div><button class="chk'+(s.at==='ziel'?' on':'')+'" data-a="go" data-to="ziel">Hier</button></li></ol>';
  }
  else if(M.t==='st'){
    var t=p.tasks.find(function(x){return x.id===M.id}); if(!t){M=null;return '';}
    var here=p.kids.filter(function(k){var s=p.st[k.id];return s.at===t.id}), done=p.kids.filter(function(k){return p.st[k.id].done[t.id]});
    c='<h2><span class="b '+t.art+'">'+numOf(p,t.id)+'</span>'+esc(t.t)+'</h2>'+
      '<p style="margin:0">'+(t.info?esc(t.info)+'<br>':'')+'<span class="muted">'+artName(t,1)+(t.art==='i'?'':' · '+STUFE[t.stufe-1]+' ('+esc(VAR[p.variant].stufen[t.stufe-1])+')')+'</span></p>'+
      (safeUrl(t.link)?'<div class="row">'+linkBtn(t,'btn pri','🔗 Aufgabe öffnen')+'</div>':'')+
      '<h3 style="font-size:21px">'+(t.art==='i'?'Sind gerade hier (':'Arbeiten gerade hier (')+here.length+')</h3><div class="kids">'+(here.length?here.map(function(k){return kidChip(p,k)}).join(''):'<span class="muted">niemand</span>')+'</div>'+
      '<h3 style="font-size:21px">Schon erledigt ('+done.length+')</h3><div class="kids">'+(done.length?done.map(function(k){return kidChip(p,k)}).join(''):'<span class="muted">noch niemand</span>')+'</div>'+
      '<div class="row"><button class="btn sm" data-a="edit">Bearbeiten</button></div>';
  }
  else if(M.t==='prog'){
    wide=true;
    var nn=0;
    c='<h2>Fortschritt</h2><p class="muted" style="margin:0">Tippe auf ein Feld, um eine Aufgabe ab- oder anzuhaken.</p><div class="tw"><table><thead><tr><th>Kind</th>'+
      p.tasks.map(function(t){if(t.art==='p') nn++; return '<th class="'+t.art+'" title="'+esc(t.t)+'">'+sym(t,nn)+'</th>'}).join('')+'<th>Pflicht</th><th style="text-align:left">Wo?</th></tr></thead><tbody>';
    var tp=p.tasks.filter(function(t){return t.art==='p'}).length;
    p.kids.forEach(function(k){
      var s=p.st[k.id], dp=p.tasks.filter(function(t){return t.art==='p'&&s.done[t.id]}).length;
      c+='<tr><td>'+kidChip(p,k)+'</td>'+p.tasks.map(function(t){return '<td><button class="chk'+(s.done[t.id]?' on':'')+'" data-a="done" data-kid2="'+k.id+'" data-t="'+t.id+'" aria-label="'+esc(k.name+': '+t.t)+'">'+(s.done[t.id]?'✓':'')+'</button></td>'}).join('')+
        '<td>'+dp+'/'+tp+'</td><td style="text-align:left">'+esc(whereText(p,k.id))+'</td></tr>';
    });
    if(!p.kids.length) c+='<tr><td colspan="'+(p.tasks.length+3)+'" class="muted">Noch keine Kinder eingetragen.</td></tr>';
    c+='</tbody></table></div>';
    c+=M.reset
      ? '<div class="note">Alle Figuren zurück an den Start und alle Häkchen löschen?<div class="row" style="margin-top:8px"><button class="btn danger sm" data-a="resetyes">Ja, alles zurücksetzen</button><button class="btn sm" data-a="resetno">Abbrechen</button></div></div>'
      : '<div class="row"><button class="btn sm" data-a="resetask">Alle zurück an den Start</button></div>';
  }
  else if(M.t==='new'){
    wide=true;
    c='<h2>Neuer Lernpfad</h2><label class="fl" for="n-title">Titel</label><input class="inp" id="n-title" maxlength="60" placeholder="z. B. Brüche entdecken" value="'+esc(M.title||'')+'">'+
      '<div class="fl">Wie soll der Weg aussehen?</div><div class="varpick">'+VARS.map(function(v){
        return '<button data-a="newvar" data-v="'+v+'" aria-pressed="'+(M.v===v)+'">'+mapSVG(sample(v),{mini:true})+'<span>'+VAR[v].icon+' '+VAR[v].name+'</span></button>'}).join('')+'</div>'+
      '<div class="row"><button class="btn pri" data-a="newgo">Erstellen</button><button class="btn" data-a="close">Abbrechen</button></div>';
  }
  else if(M.t==='del'){
    c='<h2>Lernpfad löschen?</h2><p style="margin:0">«'+esc(p.title)+'» mit allen Aufgaben und Einträgen der Kinder wird gelöscht.</p>'+
      '<div class="row"><button class="btn danger" data-a="delyes">Ja, löschen</button><button class="btn" data-a="close">Abbrechen</button></div>';
  }
  return '<div class="mbg" data-a="bg"><div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Schliessen">✕</button>'+c+'</div></div>';
}
function renderModal(){
  var m=$('#modal'), had=!!m.firstChild, y=had&&m.querySelector('.mbg')?m.querySelector('.mbg').scrollTop:0, tw=m.querySelector('.tw'), tx=tw?tw.scrollLeft:0;
  m.innerHTML=modalHTML();
  var b=m.querySelector('.mbg'); if(b) b.scrollTop=y;
  var t2=m.querySelector('.tw'); if(t2) t2.scrollLeft=tx;
}
function render(){
  var a=$('#app');
  if(V.v!=='liste'){var p=cur(); if(!p){V={v:'liste'};} else fix(p);}
  a.innerHTML = V.v==='liste'?listHTML():V.v==='edit'?editHTML(cur()):mapHTML(cur());
  renderModal();
}
function refresh(){ // nur Karte/Fenster neu, ohne Scroll-Sprung
  if(V.v==='karte'){var y=window.scrollY; $('#app').innerHTML=mapHTML(cur()); window.scrollTo(0,y);}
  else if(V.v==='edit'){var pv=$('#prev'); if(pv) pv.innerHTML=mapSVG(cur());}
  renderModal();
}
var tt=null;
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2200);}

/* ---------- Klicks ---------- */
document.addEventListener('click',function(e){
  var kidEl=e.target.closest('[data-kid]');
  if(kidEl){ if(e.detail===0||kidEl.closest('.kids')||kidEl.closest('.modal')){openKid(kidEl.dataset.kid);} return; } // auf der Karte: siehe pointerup
  var el=e.target.closest('[data-a]');
  var st=e.target.closest('.stn');
  if(!el&&st&&V.v==='karte'){M={t:'st',id:st.dataset.st};renderModal();return;}
  if(!el) return;
  var a=el.dataset.a, p=cur(), id=el.dataset.id, t;
  if(a==='bg'){ if(e.target===el){M=null;renderModal();} return; }
  switch(a){
    case 'close': M=null; renderModal(); break;
    case 'home': V={v:'liste'}; M=null; render(); window.scrollTo(0,0); break;
    case 'open': V={v:'karte',id:id}; render(); window.scrollTo(0,0); break;
    case 'editid': V={v:'edit',id:id}; render(); window.scrollTo(0,0); break;
    case 'edit': V={v:'edit',id:p.id}; M=null; render(); window.scrollTo(0,0); break;
    case 'tomap': syncKids(p); save(); V={v:'karte',id:p.id}; render(); window.scrollTo(0,0); break;
    case 'copy':
      var src=S.pfade.find(function(x){return x.id===id}); var cp=JSON.parse(JSON.stringify(src));
      cp.id=uid(); cp.title=src.title+' (Kopie)'; var map={}; cp.tasks.forEach(function(tk){var n=uid();map[tk.id]=n;tk.id=n;});
      cp.st={}; cp.kids.forEach(function(k){cp.st[k.id]={at:'start',hilfe:false,done:{}}});
      S.pfade.splice(S.pfade.indexOf(src)+1,0,cp); save(); render(); toast('Kopie erstellt (alle am Start)'); break;
    case 'new': M={t:'new',v:'meer',title:''}; renderModal(); setTimeout(function(){var i=$('#n-title');if(i)i.focus()},30); break;
    case 'newvar': M.title=($('#n-title')||{}).value||''; M.v=el.dataset.v; renderModal(); break;
    case 'newgo':
      var np={id:uid(),title:(($('#n-title')||{}).value||'').trim()||'Neuer Lernpfad',ziel:'Ich habe es geschafft!',variant:M.v,kids:[],st:{},
        tasks:[{id:uid(),t:'Aufgabe 1',info:'',art:'p',stufe:1},{id:uid(),t:'Aufgabe 2',info:'',art:'p',stufe:2},{id:uid(),t:'Zusatz',info:'',art:'z',stufe:2},{id:uid(),t:'Aufgabe 3',info:'',art:'p',stufe:3}]};
      S.pfade.push(np); save(); M=null; V={v:'edit',id:np.id}; render(); window.scrollTo(0,0); break;
    case 'setvar': p.variant=el.dataset.v; save(); render(); break;
    case 'addtask':
      t={id:uid(),t:el.dataset.v==='i'?'Input':'',info:'',link:'',art:el.dataset.v,stufe:el.dataset.v==='z'?2:1}; p.tasks.push(t); save(); render();
      setTimeout(function(){var i=$('#t-'+t.id);if(i){i.focus();i.scrollIntoView({block:'center'});}},30); break;
    case 'art': case 'stufe': case 'up': case 'down': case 'deltask':
      var i=p.tasks.findIndex(function(x){return x.id===id}); if(i<0) break;
      if(a==='art') p.tasks[i].art=el.dataset.v;
      if(a==='stufe') p.tasks[i].stufe=+el.dataset.v;
      if(a==='up'&&i>0) p.tasks.splice(i-1,0,p.tasks.splice(i,1)[0]);
      if(a==='down'&&i<p.tasks.length-1) p.tasks.splice(i+1,0,p.tasks.splice(i,1)[0]);
      if(a==='deltask') p.tasks.splice(i,1);
      fix(p); save(); render(); break;
    case 'kidsok': syncKids(p); save(); render(); toast(p.kids.length+' Kinder übernommen'); break;
    case 'delask': M={t:'del'}; renderModal(); break;
    case 'delyes': S.pfade=S.pfade.filter(function(x){return x!==p}); save(); M=null; V={v:'liste'}; render(); toast('Gelöscht'); break;
    case 'prog': M={t:'prog'}; renderModal(); break;
    case 'resetask': M.reset=true; renderModal(); break;
    case 'resetno': M.reset=false; renderModal(); break;
    case 'resetyes': p.kids.forEach(function(k){p.st[k.id]={at:'start',hilfe:false,done:{}}}); M.reset=false; save(); refresh(); toast('Alle sind wieder am Start'); break;
    case 'hilfe': var s=p.st[M.kid]; s.hilfe=!s.hilfe; save(); refresh(); if(s.hilfe) toast('Hilfe ist unterwegs!'); break;
    case 'go': moveKid(p,M.kid,el.dataset.to); save(); refresh(); toast(kidOf(p,M.kid).name+' ist jetzt '+targetName(p,el.dataset.to)); break;
    case 'done':
      var kid=el.dataset.kid2||M.kid, s2=p.st[kid]; if(s2.done[el.dataset.t]) delete s2.done[el.dataset.t]; else s2.done[el.dataset.t]=true; save(); refresh(); break;
    case 'full':
      var mc=$('#mapcard');
      try{ if(document.fullscreenElement) document.exitFullscreen(); else if(mc.requestFullscreen){var r=mc.requestFullscreen(); if(r&&r.catch) r.catch(function(){toast('Vollbild geht hier leider nicht')});} else toast('Vollbild geht hier leider nicht'); }catch(x){toast('Vollbild geht hier leider nicht')}
      break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&M){M=null;renderModal();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('stn')){e.preventDefault();M={t:'st',id:e.target.dataset.st};renderModal();}
});
function openKid(id){M={t:'kid',kid:id};renderModal();}

/* ---------- Eingaben im Bearbeiten ---------- */
document.addEventListener('input',function(e){
  var p=cur(), t=e.target; if(!p||V.v!=='edit') return;
  if(t.dataset.e){p[t.dataset.e]=t.value;}
  else if(t.dataset.tf){var k=p.tasks.find(function(x){return x.id===t.dataset.id}); if(k) k[t.dataset.tf]=t.value;}
  else return;
  save(); clearTimeout(prevT); prevT=setTimeout(function(){var pv=$('#prev'); if(pv) pv.innerHTML=mapSVG(p);},150);
});
document.addEventListener('change',function(e){ if(e.target.id==='e-kids'){var p=cur(); syncKids(p); save(); var pv=$('#prev'); if(pv) pv.innerHTML=mapSVG(p);} });
function syncKids(p){
  var ta=$('#e-kids'); if(!ta||!p) return;
  var seen={}, names=ta.value.split('\n').map(function(s){return s.trim().slice(0,24)}).filter(function(s){if(!s||seen[s])return false;seen[s]=1;return true}).slice(0,40);
  var old=p.kids;
  p.kids=names.map(function(n){return old.find(function(k){return k.name===n})||{id:uid(),name:n,farbe:null}});
  p.kids.forEach(function(k){
    if(!k.farbe){var used=p.kids.map(function(x){return x.farbe}); k.farbe=FARBEN.find(function(f){return used.indexOf(f)<0})||FARBEN[Math.floor(Math.random()*FARBEN.length)];}
  });
  fix(p);
}

/* ---------- Figuren ziehen ---------- */
function svgPoint(svg,x,y){var pt=svg.createSVGPoint();pt.x=x;pt.y=y;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function dropTarget(cx,cy){
  var el=document.elementFromPoint(cx,cy);
  if(el&&el.closest('#dock')) return 'start';
  var svg=$('#map svg'); if(!svg) return null;
  var r=svg.getBoundingClientRect(); if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom) return null;
  var q=svgPoint(svg,cx,cy), L=layout(cur()), best=null, bd=80;
  function test(key,x,y){var d=Math.hypot(q.x-x,q.y-y); if(d<bd){bd=d;best=key;}}
  L.st.forEach(function(s){test(s.t.id,s.x,s.y)});
  test('ziel',L.ziel.x,L.ziel.y-10); test('hilfe',L.hilfe.x,L.hilfe.y); test('start',L.start.x,L.start.y);
  return best;
}
function markTarget(key){
  document.querySelectorAll('.tgt').forEach(function(x){x.classList.remove('tgt')});
  if(!key) return;
  if(key==='start'){var d=$('#dock'); if(d) d.classList.add('tgt'); return;}
  var el=document.querySelector('#map [data-st="'+key+'"]')||document.querySelector('#map [data-spot="'+key+'"]');
  if(el) el.classList.add('tgt');
}
document.addEventListener('pointerdown',function(e){
  if(V.v!=='karte'||e.button>0) return;
  var t=e.target.closest('[data-kid]'); if(!t||t.closest('.modal')||t.closest('.kids')) return;
  D={kid:t.dataset.kid,x:e.clientX,y:e.clientY,mv:false,src:t};
  if(e.pointerType!=='mouse') e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!D) return;
  if(!D.mv){
    if(Math.hypot(e.clientX-D.x,e.clientY-D.y)<7) return;
    var p=cur(), k=kidOf(p,D.kid); if(!k){D=null;return;}
    D.mv=true; var g=document.createElement('div'); g.className='ghost';
    g.innerHTML=figSVG(p.variant,k.farbe,52)+'<span>'+esc(k.name)+'</span>'; document.body.appendChild(g); D.g=g;
    D.src.classList.add('dragging'); document.body.classList.add('dragmode');
  }
  D.g.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
  var key=dropTarget(e.clientX,e.clientY); if(key!==D.key){D.key=key; markTarget(key);}
});
function endDrag(){ if(D&&D.g) D.g.remove(); if(D&&D.src) D.src.classList.remove('dragging'); document.body.classList.remove('dragmode'); markTarget(null); }
document.addEventListener('pointerup',function(e){
  if(!D) return; var d=D; endDrag(); D=null;
  if(!d.mv){openKid(d.kid);return;}
  var p=cur(), key=dropTarget(e.clientX,e.clientY);
  if(!key){refresh();return;}
  if(key==='hilfe'){p.st[d.kid].hilfe=true;} else moveKid(p,d.kid,key);
  save(); refresh(); toast(kidOf(p,d.kid).name+' ist jetzt '+targetName(p,key));
});
document.addEventListener('pointercancel',function(){endDrag();D=null;});
document.addEventListener('touchmove',function(e){if(D) e.preventDefault();},{passive:false});

load(); render();
})();
</script>
