<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}/* kn-back */#knBack,.kn-back{align-items:center;gap:6px;padding:3px 4px 3px 13px!important;min-height:0!important;height:auto!important;border-radius:999px!important;background:#fff!important;color:#1f2421!important;border:0!important;text-decoration:none;font:700 19px/1 system-ui,-apple-system,sans-serif!important;box-shadow:0 4px 14px rgba(63,120,168,.2)!important;flex:none;cursor:pointer}#knBack:not([hidden]),.kn-back{display:inline-flex}#knBack:hover,.kn-back:hover{box-shadow:0 6px 18px rgba(63,120,168,.3)!important;transform:none}#knBack img,.kn-back img{width:34px;height:34px;display:block;border-radius:50%}
</style></head><body>
<title>Vokabelkiste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="vk-css">
/* Layout: wie Tagesfolien und Hausaufgabentafel. Aquarellpapier im Hintergrund, oben die Sprach-Pillen, darunter eine Spalte:
   Ordner -> Portion -> Übungen. Die Kärtchen sind Karteikarten mit rosa Linie und gepunkteten Zeilen, der Karteikasten hat den grünen Agenda-Einband.
   Bewusst nur hell, damit es zum Rest passt und am Beamer gleich aussieht. */
:root{
  color-scheme:light;
  --paper:#fbfaf6; --ink:#1f2421; --muted:#6c766f; --line:#e3e6df; --card:#ffffff; --sheet:#fffefa; --rule:#c4c9c2;
  --rose:#ec9d95; --rose-deep:#d9766c; --rose-ink:#b5524a; --rose-soft:#fcefed;
  --leaf:#7ea56a; --leaf-deep:#4f7f3d; --leaf-soft:#e9f1e3;
  --sky:#8fb0cf; --sky-deep:#5f8fbf; --sky-soft:#eaf1f8; --navy:#3f5f86; --bubble:#a9cdeb;
  --cover:#87ad74; --cover2:#6f9a5f; --nut:#b07a3a; --nut-soft:#f6ecdc; --danger:#c0463c;
  --shadow:0 3px 18px rgba(40,60,45,.12); --shadow-up:0 8px 28px rgba(40,60,45,.17);
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --label:"Amatic SC","Arial Narrow",sans-serif;
  --bub:"Fredoka","Nunito",system-ui,sans-serif;
  --word:"Fredoka","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 38% 45% at 0% 100%,rgba(160,203,150,.55),transparent 70%),
  radial-gradient(ellipse 35% 40% at 100% 0%,rgba(178,214,204,.6),transparent 70%),
  radial-gradient(ellipse 30% 38% at 100% 100%,rgba(176,200,226,.55),transparent 70%),
  radial-gradient(ellipse 25% 22% at 8% 0%,rgba(207,226,216,.5),transparent 70%),
  radial-gradient(ellipse at 40% 30%,#fffefb,#f6f4ec)}
.app{position:relative;z-index:1;min-height:100%;padding-bottom:90px}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Leiste oben */
.top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0 6px 0 0}
.brand svg{flex:none}
.big{font-family:var(--bub);font-weight:700;color:var(--bubble);line-height:1.05;margin:0;overflow-wrap:anywhere;text-wrap:balance;
  font-size:clamp(32px,6vw,52px);
  text-shadow:0 2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 5px 0 rgba(63,95,134,.35)}
.big.brandtxt{font-size:26px;white-space:nowrap;
  text-shadow:0 1.5px 0 var(--navy),1.5px 0 0 var(--navy),-1.5px 0 0 var(--navy),0 -1.5px 0 var(--navy),1.5px 1.5px 0 var(--navy),-1.5px 1.5px 0 var(--navy),1.5px -1.5px 0 var(--navy),-1.5px -1.5px 0 var(--navy),0 3px 0 rgba(63,95,134,.35)}
.big.mid{font-size:clamp(28px,4.6vw,40px)}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.sp{flex:1}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:36px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill:hover:not(:disabled){background:var(--leaf-soft)}
.pill.on,.pill.rose{background:var(--rose);border-color:var(--rose);color:#fff}
.pill.on:hover,.pill.rose:hover{background:#e48a81}
.pill.go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pill.go:hover:not(:disabled){background:#6c9558}
.pill.danger{color:var(--danger)}
.pill.sure{background:var(--danger);border-color:var(--danger);color:#fff}
.pill.sm{min-height:30px;padding:0 11px;font-size:13px}
.pill:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky-soft);color:var(--navy)}
.tbanner{margin-top:6px;background:var(--rose-soft);border:1px dashed var(--rose);border-radius:16px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tbanner .warn{color:var(--danger);font-weight:700}

/* Seitenkopf */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:14px 0 6px}
.crumb{border:0;background:rgba(255,255,255,.75);border-radius:999px;padding:3px 11px;font-weight:700;font-size:13.5px;color:var(--muted)}
button.crumb:hover{background:var(--leaf-soft);color:var(--ink)}
.crumb.cur{background:none;color:var(--ink)}
.sep{color:var(--rule);font-weight:800}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin:4px 0 6px}
.hact{display:flex;gap:6px;flex-wrap:wrap}
.hand{font-family:var(--hand);font-size:20px;color:var(--muted);margin:0;line-height:1.25}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:30px 0 12px}
.lbl{font-family:var(--label);font-size:34px;font-weight:700;line-height:1;margin:0;letter-spacing:.02em}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:0;border-radius:22px;padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0;transition:transform .15s,box-shadow .15s}
.tile:hover:not(:disabled){transform:translateY(-3px);box-shadow:var(--shadow-up)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile h3{font-weight:800;font-size:18px;margin:0;display:flex;align-items:center;gap:10px;padding-right:22px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .go{margin-top:auto;padding-top:6px;font-weight:800;font-size:14px;color:var(--rose-ink)}
.num{position:absolute;top:10px;right:16px;font-family:var(--hand);font-size:24px;color:var(--rose-deep)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sky-soft);color:var(--sky-deep)}
.ico.leaf{background:var(--leaf-soft);color:var(--leaf-deep)}
.ico.rose{background:var(--rose-soft);color:var(--rose-ink)}
.ico.nut{background:var(--nut-soft);color:var(--nut)}
.rec{font-size:13px;font-weight:700;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.minibox{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:end;height:56px;padding:7px;border-radius:12px;margin-top:4px;
  background:radial-gradient(circle,rgba(255,255,255,.22) 1.4px,transparent 2px) 0 0/12px 12px,linear-gradient(160deg,var(--cover),var(--cover2))}
.minibox span{background:#fff;border-top:2px solid var(--rose);border-radius:2px;min-height:4px}
.minil{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 12px;font-size:14px}
.chip b{font-variant-numeric:tabular-nums;background:var(--sky-soft);color:var(--navy);border-radius:999px;padding:0 8px;font-size:12.5px}
.chip.done{color:var(--muted)}
.chip.done b{background:var(--leaf-soft);color:var(--leaf-deep)}
.chip.cur{border-color:var(--rose)}
.chip .wd{font-family:var(--word);font-weight:700}

/* Ordner und Portionen */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 14px;padding-top:12px}
.fold,.portion{position:relative;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.fold:hover,.portion:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.fold{background:var(--fc,var(--sky-soft));border-radius:4px 18px 18px 18px}
.fold::before{content:"";position:absolute;left:0;top:-13px;width:44%;height:14px;background:var(--fc,var(--sky-soft));border-radius:10px 12px 0 0}
.fold.l1{--fc:#e6f0e0}.fold.l2{--fc:#fbeee9}
.portion{background:var(--sheet);border-radius:14px;overflow:hidden}
.portion::before{content:"";position:absolute;left:0;right:0;top:40px;height:2px;background:var(--rose)}
.fmain{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:none;padding:14px 16px 14px;min-height:112px;min-width:0}
.portion .fmain{padding-top:10px}
.fname{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.portion .fname{min-height:30px}
.fmeta{color:var(--muted);font-size:13.5px;font-weight:600}
.pv{font-family:var(--word);color:var(--navy);font-size:15px;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.portion .pv{background:radial-gradient(circle at 50% calc(100% - 1px),var(--rule) .9px,transparent 1.4px) 0 0/5px 100% repeat-x;padding-bottom:3px}
.cact{display:flex;gap:4px;padding:0 10px 10px}
.ib{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:30px;font-weight:800;color:var(--muted);display:grid;place-items:center}
.ib:hover:not(:disabled){background:var(--leaf-soft);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.addcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;border:2px dashed var(--rule);border-radius:18px;padding:14px 16px;min-height:112px}
.addcard .row{display:flex;gap:6px;flex-wrap:wrap}
.addcard .hand{font-size:17px}
.closedn .fmain{opacity:.55}
.fold.closedn,.portion.closedn{outline:2px dashed var(--rose);outline-offset:3px}
.lock{font-weight:800;color:var(--rose-ink)}
.relb{margin-left:auto;border:1px solid var(--rose);background:#fff;color:var(--rose-ink);border-radius:999px;height:30px;padding:0 11px;font-weight:800;font-size:12.5px;white-space:nowrap}
.relb:hover{background:var(--rose-soft)}
.relb.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-deep)}
.portion.total{grid-column:1/-1;order:99;width:min(460px,calc(100% - 10px));margin-top:4px;background:var(--leaf-soft);box-shadow:5px 5px 0 -1px var(--leaf-soft),5px 5px 0 0 #cfdcc6,10px 10px 0 -1px var(--leaf-soft),10px 10px 0 0 #cfdcc6,var(--shadow);margin-right:10px}
.portion.total::before{background:var(--leaf)}
.portion.total .fname{color:var(--leaf-deep)}
.portion.total .pv{font-family:var(--ui);font-size:13.5px;font-weight:700;color:var(--muted);background:none}
.grp{margin-bottom:6px}
.grph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:22px 0 2px}
.gname{border:0;background:none;padding:0 8px 0 0;font-family:var(--hand);font-size:30px;line-height:1.1;color:var(--navy)}
button.gname:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.closedg>.fgrid,.closedg>.grph .gname{opacity:.55}
.empty{background:rgba(255,255,255,.75);border:2px dashed var(--rule);border-radius:18px;padding:22px;text-align:center}

/* Wortliste */
.wlist{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 16px;margin-top:26px}
.wlist summary{cursor:pointer;font-weight:800}
.wtab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:2px 14px;margin-top:10px;align-items:center}
.wtab span{font-family:var(--word);font-size:16px;padding:5px 0;border-bottom:1px dotted var(--rule);overflow-wrap:anywhere}
.wtab .wf{color:var(--navy);font-weight:700}
.spk{border:0;background:var(--sky-soft);color:var(--sky-deep);border-radius:999px;width:32px;height:28px;display:grid;place-items:center;flex:none}
.spk:hover{background:var(--bubble);color:var(--navy)}

/* Editor (Lehrperson) */
.editor{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-top:26px}
.editor .sh{margin-top:0}
.etab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:6px 8px;align-items:center}
.etab .th{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.inp:focus{border-color:var(--sky)}
.inp.sin{grid-column:1/3;font-size:13.5px;margin-bottom:10px;background:var(--paper)}
.inp.warn{border-color:var(--rose-deep)}
.etab .inp.sin{grid-column:1/-1}
.kbx{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.kbxs{display:flex;flex-direction:column;gap:3px}
.xtag{font-family:var(--ui);font-size:11px;font-weight:800;color:var(--sky-deep);background:var(--sky-soft);border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.kbx input{accent-color:var(--leaf);width:17px;height:17px}
.del{border:0;background:none;border-radius:999px;width:32px;height:32px;color:var(--muted);font-size:16px}
.del:hover{background:var(--rose-soft);color:var(--danger)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dotted var(--rule)}
.addrow .inp.sin{grid-column:1/3}
.import{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.import summary{cursor:pointer;font-weight:800}
.import p{color:var(--muted);font-size:14px}
textarea.inp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;resize:vertical;margin-bottom:8px}
.ehint{font-size:13px;color:var(--muted);margin:8px 0 0}

/* Übungs-Ansicht */
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 8px}
.stop .t{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;max-width:460px}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .3s}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12.5px;font-weight:800;padding:2px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.steps span.on{background:var(--rose);border-color:var(--rose);color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.keys{color:var(--muted);font-size:13px;margin:0;text-align:center}

/* Karteikarte */
.card{width:min(460px,100%);max-width:100%;aspect-ratio:105/74;perspective:1400px;cursor:pointer;border-radius:16px}
.card.static{cursor:default}
.inner{position:relative;display:block;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;background:var(--sheet);box-shadow:0 6px 24px rgba(40,60,45,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:3rem 1rem 1.3rem;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:2.5rem;height:2px;background:var(--rose)}
.face .word{padding:0 .45em .16em;background:radial-gradient(circle at 50% calc(100% - 1.5px),var(--rule) 1.1px,transparent 1.7px) 0 100%/7px 7px repeat-x}
.face.back{transform:rotateY(180deg)}
.face .word,.face .sub,.face .hint{position:relative;z-index:1}
.lang{position:absolute;z-index:1;top:.55rem;left:1rem;right:.8rem;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.word{font-family:var(--word);font-weight:600;font-size:clamp(30px,7vw,46px);line-height:1.15;overflow-wrap:anywhere;max-width:100%}
.back .word{color:var(--navy)}
.sub{color:var(--muted);font-size:15px}
.hint{position:absolute!important;bottom:.55rem;font-family:var(--hand);font-size:17px;color:var(--muted)}
.badge{background:var(--rose);color:#fff;border-radius:999px;padding:1px 9px;letter-spacing:.04em;font-size:11px}
.timer{width:min(460px,100%);height:8px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:var(--rose);border-radius:999px;transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(460px,100%)}
.judge button{border-radius:999px;padding:13px;font-size:18px;font-weight:800;border:2px solid}
.judge .no{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink)}
.judge .yes{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep)}
.judge .no:hover{background:#f9dcd8}.judge .yes:hover{background:#d9e8cf}
.judge.off{visibility:hidden}

/* Auswahl */
.opts{display:grid;gap:10px;width:min(460px,100%)}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 18px;font-family:var(--word);font-size:20px;font-weight:700}
.opt:hover{border-color:var(--sky)}
.opt kbd{font-family:var(--ui);font-size:12px;border-radius:999px;background:var(--sky-soft);color:var(--navy);padding:1px 8px}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep)}
.opt.wrong{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink)}

/* Schreiben */
.write{display:flex;gap:10px;width:min(460px,100%)}
.write input{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 18px;font-family:var(--word);font-size:21px}
.write input:focus{border-color:var(--sky);outline:none}
.write input.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.write input.no{border-color:var(--rose);background:var(--rose-soft)}
.acc{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(460px,100%)}
.acc button{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:36px;height:34px;font-family:var(--word);font-size:17px;font-weight:700}
.acc button:hover{background:var(--sky-soft)}
.fb{min-height:3.2em;width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fb .ok{color:var(--leaf-deep);font-weight:800;font-size:17px}
.fb .no{color:var(--rose-ink);font-weight:800;font-size:17px}
.fb .sol{font-family:var(--word);font-size:26px;font-weight:700;color:var(--navy)}
.fb .sub{display:inline-flex;align-items:center;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* 3er */
.tracker{width:min(600px,100%);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* Zusammenfassung */
.summary{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px 24px;text-align:center;width:min(500px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.summary p{margin:0;color:var(--muted)}
.stamp{width:62px;height:62px;border-radius:50%;border:3px solid var(--leaf);color:var(--leaf-deep);display:grid;place-items:center;font-size:30px;font-weight:800;transform:rotate(-8deg);background:var(--leaf-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}

/* Karteikasten */
.box{border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;
  background:radial-gradient(circle,rgba(255,255,255,.22) 1.6px,transparent 2.2px) 0 0/14px 14px,linear-gradient(160deg,var(--cover),var(--cover2));
  box-shadow:0 10px 34px rgba(40,60,45,.22),inset 0 0 0 2px rgba(255,255,255,.18)}
.fach{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sheet);border:0;border-radius:10px;padding:12px 4px 10px;min-height:230px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.08);transition:transform .15s}
.fach:hover:not(:disabled){transform:translateY(-3px)}
.fach:disabled{cursor:default}
.fnum{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fcount{font-family:var(--bub);font-size:34px;font-weight:700;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.stack{flex:1;width:76%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding-block:6px}
.stack i{display:block;height:6px;background:#fff;border:1px solid var(--line);border-top:2px solid var(--rose);border-radius:2px}
.fint{font-family:var(--hand);font-size:16px;color:var(--muted);text-align:center;line-height:1.1}
.due{position:absolute;top:-9px;right:6px;background:var(--rose);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px}
.boxfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}

/* Kasten-Auswahl */
.selgrp{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;margin-top:12px}
.selhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.selhead b{flex:1;min-width:0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--leaf);background:var(--leaf-soft);border-radius:999px;padding:4px 12px;font-family:var(--word);font-size:15px;font-weight:700;color:var(--leaf-deep)}
.wchip small{font-family:var(--ui);font-weight:600;color:var(--muted);margin-left:4px}
.wchip.xw{border-color:var(--sky-deep);background:var(--sky-soft);color:var(--navy)}
.wchip.xw small{color:var(--sky-deep)}
.wchip.xw.off{border-color:var(--sky);background:#fff;color:var(--sky-deep)}
.wchip.off{background:#fff;border-color:var(--line);color:var(--muted);text-decoration:line-through}

/* Paare */
.pairs{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:9px;width:min(620px,100%)}
.pair{aspect-ratio:105/74;max-width:100%;perspective:900px;border:0;background:none;padding:0}
.pair.flipped .inner{transform:rotateY(180deg)}
.pair .face{padding:1.3rem .3rem .3rem;border-radius:10px;gap:0}
.pair .face::before{top:1.1rem}
.pair .face.closed{background:radial-gradient(circle,rgba(255,255,255,.25) 1.4px,transparent 2px) 0 0/12px 12px,linear-gradient(160deg,var(--cover),var(--cover2));color:#fff;font-family:var(--bub);font-size:30px;font-weight:700;padding:0}
.pair .face.closed::before,.pair .face.closed::after{display:none}
.pair .face.open{transform:rotateY(180deg)}
.plang{position:absolute;z-index:1;top:.05rem;left:.5rem;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pword{position:relative;z-index:1;font-family:var(--word);font-weight:700;font-size:clamp(12px,3.1vw,18px);line-height:1.1;overflow-wrap:anywhere}
.pair.fx .pword{color:var(--navy)}
.pair.matched .face.open{background:var(--leaf-soft);box-shadow:0 0 0 2px var(--leaf)}

/* Buchstabensalat */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(620px,100%)}
.slot{width:2.5rem;height:3rem;border:0;border-bottom:3px solid var(--rule);background:none;font-family:var(--word);font-size:28px;font-weight:700;padding:0;color:var(--ink)}
.slot.filled{border-color:var(--sky)}
.slot.fixed{display:inline-grid;place-items:center;width:1.1rem;border-color:transparent;color:var(--muted)}
.gapsp{width:1.2rem}
.slots.ok .slot{color:var(--leaf-deep);border-color:var(--leaf)}
.slots.shown .slot{color:var(--navy);border-color:var(--navy)}
.slots.no{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ltiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(620px,100%)}
.ltile{width:2.8rem;height:3rem;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 0 var(--rule);font-family:var(--word);font-size:24px;font-weight:700;padding:0}
.ltile:hover{background:var(--sky-soft)}
.ltile.used{visibility:hidden}

/* Lückensatz */
.sheet{position:relative;width:min(580px,100%);border-radius:16px;background:var(--sheet);box-shadow:0 6px 24px rgba(40,60,45,.14);padding:3rem 1.3rem 1.2rem;text-align:center;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:2.5rem;height:2px;background:var(--rose)}
.sentence{position:relative;font-family:var(--word);font-size:clamp(20px,4vw,27px);line-height:1.7;margin:0 0 .3rem}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--sky);color:transparent;line-height:1.2}
.blank.show{color:var(--navy);background:var(--sky-soft);border-radius:4px;padding:0 4px}
.blank.ok{color:var(--leaf-deep);border-color:var(--leaf)}
.blank.no{color:var(--rose-ink);border-color:var(--rose)}

/* Hören */
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;padding-block:6px}
.play{width:110px;height:110px;border-radius:50%;border:0;background:var(--sky-deep);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--navy),var(--shadow)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}

/* Wortregen */
.rain{position:relative;width:min(660px,100%);height:min(56vh,440px);min-height:280px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
  background:radial-gradient(circle at 50% calc(100% - 1px),var(--rule) .9px,transparent 1.4px) 0 0/5px 34px repeat,var(--sheet)}
.rain::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rose)}
.rhud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:800;font-variant-numeric:tabular-nums}
.life{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--rose);margin-left:5px}
.life.off{background:var(--line)}
.drop{position:absolute;top:0;background:#fff;border:1px solid var(--line);border-top:3px solid var(--rose);border-radius:8px;padding:3px 11px;font-family:var(--word);font-size:19px;font-weight:700;white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 8px rgba(40,60,45,.12);will-change:transform}
.drop.hit{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep);transition:opacity .35s;opacity:0}
.drop.miss{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink);max-width:92%}
.rstart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;z-index:3;background:rgba(255,254,250,.94)}
.rstart p{max-width:34ch;margin:0}

/* Dialog, Leiste unten, Toast */
.scrim{position:fixed;inset:0;background:rgba(31,36,33,.28);z-index:80}
.dlg{position:fixed;z-index:81;left:50%;top:22%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));background:#fff;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:18px;display:flex;flex-direction:column;gap:12px}
.dact{display:flex;justify-content:flex-end;gap:8px}
.pub{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 10px 30px rgba(0,0,0,.16);max-width:calc(100% - 32px);font-weight:700;font-size:14px}
.pub .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rose);margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.voice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.voice select{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:36px;padding:0 14px;max-width:100%;font-weight:700;font-size:14px}
.note{color:var(--muted);font-size:13.5px;margin-top:14px}

@media (max-width:620px){
  .box{gap:5px;padding:8px}
  .fach{min-height:180px}
  .fint{display:none}
  .fcount{font-size:26px}
  .slot{width:2.05rem;height:2.6rem;font-size:23px}
  .ltile{width:2.4rem;height:2.6rem;font-size:20px}
  .etab{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .etab .kbxs{grid-column:1/3;flex-direction:row;gap:14px}
  .etab .th.k{display:none}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow .pill{grid-column:1/-1}
  .big.brandtxt{font-size:22px}
}
/* Knobelnest: Tagesstern, Serie, Abzeichen */
.kntoday{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:6px;margin-bottom:14px}
.kt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 18px;min-width:0}
.kt small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.ktx{flex:1;min-width:0}
.kts{font-size:38px;filter:grayscale(1);opacity:.35}
.kt-day.on .kts{filter:none;opacity:1}
.kt-day.on{background:#fff8e1}
.kt .bar{max-width:none;margin-top:6px}
.kt-day.on .bar i{background:#e0a92a}
.ktn{font-family:var(--bub);font-size:44px;line-height:1;color:var(--muted);min-width:1.1em;text-align:center}
.kt-fire.on .ktn{color:#e0662a}
.ktf{font-size:22px;letter-spacing:-2px;word-break:break-all}
.kt-fire:not(.on) .ktf{font-size:15px;letter-spacing:0;color:var(--muted);font-weight:700}
.kt-badges{flex-direction:column;align-items:stretch;gap:8px}
.kb{display:flex;align-items:center;gap:10px;opacity:.55}
.kb.on{opacity:1}
.kbi{font-size:26px;filter:grayscale(1)}
.kb.on .kbi{filter:none}
/* Knobelnest: Klassen-Übersicht der Lehrperson */
.ctab{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:auto;margin-top:8px}
.ctab table{border-collapse:collapse;width:100%;font-size:14px}
.ctab th,.ctab td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;vertical-align:middle}
.ctab thead th{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--paper);position:sticky;top:0}
.ctab .l{text-align:left}
.ctab .sm{font-size:13px;white-space:normal;min-width:180px}
.ctab td.ok{background:var(--leaf-soft);color:var(--leaf-deep);font-weight:800}
.ctab td.part{background:#fff6dc}
.ctab td.fr,.ctab td.no{color:var(--rule)}
.ctab td.bad{color:var(--rose-ink);font-weight:800}
.ctab td small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.ctab .mut{color:var(--muted);font-size:12px}
.kidb{border:0;background:none;padding:0;font-weight:800;color:var(--navy);text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.kidb:hover{color:var(--rose-ink)}
.cpick{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cpg>b{font-family:var(--hand);font-size:22px;font-weight:400;color:var(--navy)}
.cpr{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill.offp{opacity:.6}
/* Knobelnest: Kärtchen-Rückseite auf iPad sauber (verdeckte Seite ausblenden) */
.inner>.face{transform:rotateY(0deg) translateZ(1px);transition:visibility 0s linear .27s}
.inner>.face.back,.inner>.face.open{transform:rotateY(180deg) translateZ(1px);visibility:hidden}
.flipped>.inner>.face{visibility:hidden}
.flipped>.inner>.face.back,.flipped>.inner>.face.open{visibility:visible}
/* ---------- Knobelnest: Bilder, «Bild & Wort», «Sprechen» ---------- */
.pic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none}
.pic.emo{font-size:40px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pic.none{color:var(--muted);font-size:30px}
.pic.big{width:120px;height:120px}
.pic.emo.big{font-size:76px}
.picb{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:#fff;padding:0;display:grid;place-items:center;overflow:hidden}
.picb .pic{width:42px;height:42px}
.picb .pic.emo{font-size:26px}
.picb.auto{border-style:dashed;border-color:var(--gold-l)}
.picb .plus{color:var(--muted);font-size:22px}
.picb:hover{box-shadow:0 0 0 4px var(--sky-soft)}
.etab{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto auto}
.picdlg{top:8%;width:min(520px,calc(100% - 32px));max-height:84vh;overflow:auto}
.pdnow{display:flex;align-items:center;gap:14px}
.pdnow .pic{border:3px solid var(--gold);background:#fff}
.pdnow p{margin:0;color:var(--muted);font-size:15px}
.pdgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;padding:2px}
.pdo{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:28px;padding:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pdo:hover{background:var(--sky-soft)}
.pdact{flex-wrap:wrap;align-items:center}
.pdact label.pill{cursor:pointer}
.face.back .cpic{position:absolute;right:.7rem;bottom:.6rem;z-index:1}
.face.back .cpic .pic{width:54px;height:54px}
.face.back .cpic .pic.emo{font-size:36px}
.bq{display:flex;flex-direction:column;align-items:center;gap:6px}
.bbig .pic{width:150px;height:150px;border:4px solid var(--gold);background:#fff;box-shadow:var(--shadow)}
.bbig .pic.emo{font-size:96px}
.bword{display:flex;align-items:center;gap:10px;font-family:var(--word);font-size:clamp(30px,6vw,42px);color:var(--navy);background:var(--sheet);border-radius:18px;padding:10px 22px;box-shadow:var(--shadow)}
.bopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(360px,100%)}
.bopt{position:relative;aspect-ratio:1/1;border-radius:22px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;padding:8px;box-shadow:var(--shadow)}
.bopt:hover{border-color:var(--sky)}
.bopt kbd{position:absolute;top:8px;left:10px;font-size:12px;border-radius:999px;background:var(--sky-soft);color:var(--navy);padding:1px 8px}
.bopt .pic{width:72%;height:72%}
.bopt .pic.emo{font-size:clamp(48px,13vw,84px)}
.bopt.right{border-color:var(--ok);background:var(--leaf-soft)}
.bopt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.talkq{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(460px,100%)}
.talkq .word{font-family:var(--word);font-size:clamp(28px,6vw,42px);line-height:1.15}
.talkq .tpic .pic{width:84px;height:84px}
.talkq .tpic .pic.emo{font-size:56px}
.play.mic{background:var(--gold);box-shadow:0 6px 0 var(--gold-d),var(--shadow)}
.play.mic.on{background:#d9625a;box-shadow:0 6px 0 #b04a43,0 0 0 0 rgba(217,98,90,.5);animation:micp 1.2s infinite}
.play.mic.okm{background:var(--ok);box-shadow:0 6px 0 #4a7e38}
.play.mic:disabled{opacity:.5}
@keyframes micp{0%{box-shadow:0 6px 0 #b04a43,0 0 0 0 rgba(217,98,90,.45)}100%{box-shadow:0 6px 0 #b04a43,0 0 0 22px rgba(217,98,90,0)}}
#tact .judge{width:min(460px,100%)}

/* ---------- Knobelnest: Stil der Eulenkiste ----------
   Schrift Patrick Hand (lokal), heller Himmel-Hintergrund, Gold-Akzente, Blau statt Rosa, ✦ beim Titel. */
@font-face{font-family:"Patrick Hand";src:url(../schriften/patrick-hand.woff2) format("woff2");font-display:swap}
:root{
  --paper:#f4f9fd; --ink:#1f2421; --muted:#5f6963; --line:#dbe7f1; --rule:#c5d8e8; --sheet:#fffefa;
  --gold:#d6ad45; --gold-d:#c4952f; --gold-l:#ecd9a4; --ok:#5f9a4a;
  --rose:#e9a49c; --rose-deep:#d9766c; --rose-ink:#b5524a; --rose-soft:#fcefed;
  --leaf:#7fae68; --leaf-deep:#4f7f3d; --leaf-soft:#e9f1e3;
  --sky:#9cc8ea; --sky-deep:#3f78a8; --sky-soft:#dcf0fd; --navy:#2f5f8f; --bubble:#3f78a8;
  --cover:#8dbde4; --cover2:#5f97c6; --nut:#b07a3a; --nut-soft:#fbf3dc;
  --shadow:0 10px 26px rgba(63,120,168,.16),0 2px 6px rgba(63,120,168,.08); --shadow-up:0 16px 34px rgba(63,120,168,.24),0 3px 8px rgba(63,120,168,.12);
  --ui:"Patrick Hand","Segoe Print","Comic Sans MS",cursive; --hand:var(--ui); --label:var(--ui); --bub:var(--ui); --word:var(--ui);
}
body{font-size:18px;line-height:1.35}
body *{font-weight:400!important;letter-spacing:normal}
.bg{background:radial-gradient(1200px 600px at 0% -10%,#e3f1fc 0%,transparent 60%),radial-gradient(900px 600px at 110% 100%,#fbf3dc 0%,transparent 60%),radial-gradient(700px 500px at 100% 0%,#e9f1e3 0%,transparent 60%),#f4f9fd}
/* Titel: dunkle Schrift mit goldenem Stern statt Bubble-Schrift */
.big{color:var(--ink);text-shadow:none!important;font-size:clamp(34px,6vw,50px);line-height:1.25;padding-bottom:.12em}
.big.mid{font-size:clamp(28px,4.6vw,38px)}
h1.big::after{content:" ✦";color:var(--gold);font-size:.5em;vertical-align:super}
.big.brandtxt{font-size:28px;color:var(--ink)}
.brand img{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--gold);background:#fff;object-fit:cover;box-shadow:0 3px 10px rgba(63,120,168,.18)}
.lbl{font-size:32px;color:var(--ink)}
.lbl::after{content:" ✧";color:var(--gold);font-size:.55em}
.sh .hand,.hand{color:var(--muted);font-size:19px}
.gname,.cpg>b{color:var(--sky-deep)}
/* Knöpfe */
.pill{border:1.5px solid var(--rule);font-size:17px;min-height:38px;box-shadow:0 2px 0 var(--line)}
.pill:hover:not(:disabled){background:var(--sky-soft)}
.pill.on,.pill.rose{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;box-shadow:0 3px 0 var(--navy)}
.pill.on:hover,.pill.rose:hover{background:var(--navy)}
.pill.go{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 3px 0 var(--gold-d)}
.pill.go:hover:not(:disabled){background:var(--gold-d)}
.pill.sm{font-size:15px}
.seg{border:1.5px solid var(--rule)}
.seg button{font-size:16px}
.seg button[aria-pressed="true"]{background:var(--sky-deep);color:#fff}
.crumb{font-size:16px;background:#fff;border:1px solid var(--line)}
.tbanner{background:var(--nut-soft);border-color:var(--gold);font-size:16px}
/* Kacheln */
.tile{border-radius:24px;border:1.5px solid #fff}
.tile h3{font-size:22px}
.tile p{font-size:16px}
.tile .go{color:var(--sky-deep);font-size:17px}
.num{color:var(--gold-d);font-size:22px;width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:#fff;top:12px;right:12px}
.ico{width:42px;height:42px;border:2px solid var(--gold);background:var(--sky-soft);color:var(--sky-deep)}
.ico.rose{background:var(--rose-soft);color:var(--rose-ink)}
.ico.nut{background:var(--nut-soft);color:var(--nut)}
.ico.leaf{background:var(--leaf-soft);color:var(--leaf-deep)}
.fold{--fc:#e9f1e3}.fold.l1{--fc:#dcf0fd}.fold.l2{--fc:#fbf3dc}
.fname{font-size:21px}
.fmeta{font-size:15px}
.portion::before,.face::before,.sheet::before{background:var(--gold-l)}
.minibox span,.stack i{border-top-color:var(--gold)}
.chip.cur{border-color:var(--gold)}
.steps span.on{background:var(--sky-deep);border-color:var(--sky-deep)}
.badge{background:var(--gold)}
.due{background:var(--gold-d)}
.timer span,.bar i{background:var(--gold)}
.closedn .fmain{opacity:.55}
.fold.closedn,.portion.closedn{outline-color:var(--rose)}
/* Übungen */
.eyebrow{font-size:15px;color:var(--sky-deep)}
.prog{font-size:17px}
.face,.sheet{box-shadow:var(--shadow)}
.word{font-size:clamp(32px,7vw,48px)}
.lang{font-size:14px}
.opt{border-radius:18px;font-size:23px;box-shadow:0 3px 0 var(--line)}
.opt.right{border-color:var(--ok)}
.write input{font-size:23px}
.judge button{font-size:20px}
.judge .yes{border-color:var(--ok)}
.fb .ok{color:var(--ok);font-size:20px}
.fb .no{font-size:20px}
.fb .sol{font-size:28px}
.stamp{border-color:var(--gold);color:var(--gold-d)}
.summary{border:1.5px solid #fff}
.play{background:var(--sky-deep);box-shadow:0 6px 0 var(--navy),var(--shadow)}
.keys{font-size:15px}
.toast{font-size:17px}
.pub{border:1.5px solid var(--gold)}
.ltile,.slot{font-size:28px}
.drop{border-top-color:var(--gold);font-size:21px}
.rain::after{background:var(--gold)}
.etab .th{font-size:15px;text-transform:none;letter-spacing:0}
.kbx{font-size:15px}
.ehint,.import p,.note{font-size:15px}
.inp{font-size:17px}
textarea.inp{font-family:var(--ui);font-size:16px}
.voice select{font-size:16px}
@media (max-width:620px){
  .etab{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto}
  .etab .kbxs{grid-column:2/4}
  .big.brandtxt{font-size:22px}
}
/* Knobelnest: Anzeige «geschafft» */
.vkfort{flex-basis:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 2px 0 var(--line);width:fit-content;max-width:100%}
.vkfort.ganz{background:var(--nut-soft);box-shadow:0 0 0 2px var(--gold)}
.vkf-t{font-size:18px;color:var(--sky-deep)}
.vkfort.ganz .vkf-t{color:var(--gold-d)}
.vkf-dots{display:flex;gap:5px}
.vkf-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:#fff}
.vkf-dots i.on{background:var(--gold)}
.vkok{position:absolute;left:18px;top:-11px;background:var(--ok);color:#fff;border-radius:999px;padding:0 10px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tile:has(.vkok){box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.vkcm{font-size:14px;color:var(--sky-deep)}
.vkcm.ganz{color:var(--ok)}
/* Knobelnest: Bilder aus der Datenbank (ganze Zeichnung sichtbar), Schutz vor Herausziehen */
img.pic{border-radius:18px;object-fit:contain;background:#fff;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.picb{border-radius:14px}.picb img.pic{border-radius:10px}
.bbig img.pic{border-radius:26px}
.pdnow img.pic{border-radius:22px}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.bulk label.pill{cursor:pointer}
.bulk .note{margin:0}
ul.miss{margin:0;padding-left:20px;max-height:200px;overflow:auto;color:var(--muted)}
/* Klassen-Ziel */
.ziel{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.ziel .zk{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:20px}
.ziel .zn{color:var(--gold-d);font-variant-numeric:tabular-nums}
.ziel .zbar{height:18px;border-radius:999px;background:var(--nut-soft);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--gold-l)}
.ziel .zbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.ziel small{color:var(--muted);font-size:14px}
.ziel.fertig{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
/* Heft: blauer Leinen-Umschlag mit Namensschild, Register-Laschen, Papierseiten */
.heft{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.hvor{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--nut-soft);border:1.5px dashed var(--gold);border-radius:16px;padding:8px 14px;font-size:16px}
.hcover{position:relative;display:flex;align-items:center;justify-content:center;min-height:170px;border-radius:12px 26px 26px 12px;overflow:hidden;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),linear-gradient(135deg,#4a86b8,#2c5a86);
  box-shadow:inset 18px 0 0 rgba(0,0,0,.12),inset 20px 0 0 rgba(255,255,255,.08),0 14px 30px rgba(44,90,134,.28),0 3px 0 #23496d}
.hcover::before,.hcover::after{content:"";position:absolute;width:56px;height:56px;background:linear-gradient(135deg,#f3dc9a,#c4952f);clip-path:polygon(100% 0,100% 100%,0 0)}
.hcover::before{right:0;top:0}
.hcover::after{right:0;bottom:0;transform:scaleY(-1)}
.hband{position:absolute;right:74px;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#1d3f5f,#2a5378 50%,#1d3f5f);box-shadow:0 0 6px rgba(0,0,0,.25)}
.hlabel{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fffdf5;border-radius:12px;padding:12px 34px 14px;min-width:min(420px,80%);
  box-shadow:0 0 0 3px #fffdf5,0 0 0 5px var(--gold),0 8px 18px rgba(0,0,0,.2);text-align:center}
.hk{color:var(--sky-deep);font-size:15px;letter-spacing:.08em}
.hn{font-size:clamp(28px,5vw,42px);line-height:1.1;color:var(--ink);border-bottom:2px dotted var(--gold);padding:0 .3em}
.heule{position:absolute;left:30px;top:50%;transform:translateY(-50%) rotate(-6deg);width:78px;height:78px;border-radius:50%;border:3px solid var(--gold);background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.hbook{display:flex;flex-direction:column}
.htabs{display:flex;gap:6px;flex-wrap:wrap;padding-left:22px}
.htab{position:relative;border:0;border-radius:14px 14px 0 0;padding:9px 20px 12px;font-size:19px;color:var(--ink);opacity:.75;transform:translateY(6px);transition:transform .15s,opacity .15s}
.htab.h-stk{background:#dcf0fd}.htab.h-bdg{background:#fbf3dc}.htab.h-urk{background:#f6e6ee}
.htab:hover{transform:translateY(2px);opacity:1}
.htab.on{opacity:1;transform:none;background:#fffdf7;box-shadow:0 -3px 0 var(--gold) inset}
.hpage{position:relative;background:#fffdf7;border-radius:6px 22px 22px 22px;padding:22px 24px 18px 40px;
  background-image:linear-gradient(90deg,transparent 22px,rgba(214,173,69,.45) 22px 24px,transparent 24px),radial-gradient(circle,rgba(63,120,168,.11) 1px,transparent 1.4px);background-size:100% 100%,22px 22px;
  box-shadow:0 1px 0 #efe6cf,0 4px 0 -1px #fffdf7,0 5px 0 -1px #e8dcc0,0 8px 0 -2px #fffdf7,0 9px 0 -2px #e2d4b4,var(--shadow)}
.hprog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;font-size:18px}
.hprog .hpb{flex:1;min-width:120px;height:12px;border-radius:999px;background:#f1ead6;overflow:hidden}
.hprog .hpb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.hprog b{font-weight:400;color:var(--gold-d);font-variant-numeric:tabular-nums}
.hprog .gd{color:var(--gold-d)}
.hfuss{margin:18px 0 0;color:var(--muted);font-size:16px;text-align:center}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px}
.stslot{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.stk{width:88%;aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:#fff;border-radius:24px;padding:7%;transform:rotate(var(--r,0deg));
  box-shadow:0 0 0 4px #fff,0 0 0 5px rgba(0,0,0,.05),0 7px 14px rgba(31,36,33,.18);-webkit-touch-callout:none;user-select:none;transition:transform .2s}
.stslot:hover .stk{transform:rotate(0deg) scale(1.06)}
.stk .pic{width:100%;height:100%;border-radius:14px;background:transparent}
.stk .pic.emo{font-size:clamp(40px,8vw,58px);width:auto;height:auto}
.stk.gold{box-shadow:0 0 0 4px var(--gold),0 0 0 7px #fff3c9,0 8px 20px rgba(196,149,47,.5)}
.stk.gold::after{content:"✦";position:absolute;right:-6px;top:-10px;color:var(--gold-d);font-size:22px;text-shadow:0 0 6px #fff}
.geheim{position:relative;width:88%;aspect-ratio:1;max-width:100%;border-radius:24px;overflow:hidden;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),transparent 45%),linear-gradient(135deg,#e7f3fd,#efe7f7 55%,#fbf3dc);
  box-shadow:inset 0 0 0 2px rgba(214,173,69,.45),0 4px 10px rgba(63,120,168,.12)}
.geheim::before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);animation:schimmer 3.2s ease-in-out infinite;animation-delay:var(--sd,0s)}
.stslot:nth-child(3n+1) .geheim::before{--sd:.8s}.stslot:nth-child(3n+2) .geheim::before{--sd:1.7s}
.geheim i{position:absolute;left:var(--x);top:var(--y);width:12px;height:12px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:funkel 2.4s ease-in-out infinite;animation-delay:var(--d);opacity:0}
.geheim .fz{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:rgba(63,120,168,.35)}
@keyframes schimmer{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@keyframes funkel{0%,100%{opacity:0;transform:scale(.3) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}}
.anz{position:absolute;right:0;top:-6px;background:var(--sky-deep);color:#fff;border-radius:999px;padding:0 9px;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 12px;align-items:end}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bdg .bi{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--rule);transition:all .3s}
.bdg .bi .emo{font-size:32px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bdg.t0 .bi{filter:grayscale(1);opacity:.4}
.bdg.t1 .bi{border-color:var(--sky)}
.bdg.t2 .bi{width:76px;height:76px;border-color:#b9c3cc;box-shadow:0 0 0 4px #eef2f5}
.bdg.t2 .bi .emo{font-size:38px}
.bdg.t3 .bi{width:92px;height:92px;border-color:var(--gold);box-shadow:0 0 0 5px #fff3c9,0 6px 16px rgba(196,149,47,.35)}
.bdg.t3 .bi .emo{font-size:46px}
.bdg.t4 .bi{width:108px;height:108px;border-color:var(--gold-d);background:radial-gradient(circle,#fffbe9,#f6e3a6);box-shadow:0 0 0 6px #ffe7a0,0 0 24px rgba(214,173,69,.7)}
.bdg.t4 .bi .emo{font-size:56px}
.bz{position:absolute;top:-6px;right:-8px;min-width:28px;height:28px;border-radius:999px;background:var(--sky-deep);color:#fff;display:grid;place-items:center;font-size:16px;padding:0 6px;font-weight:400}
.bdg.t3 .bz,.bdg.t4 .bz{background:var(--gold-d)}
.bdg .bn{font-size:19px}
.bdg small{color:var(--muted);font-size:14px;line-height:1.15}
.bdg.t0 .bn{color:var(--muted)}
.urks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.urk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border:0;background:none;font-size:19px;color:var(--ink)}
.urk .mini{position:relative;width:100%;aspect-ratio:1.414/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:4px;
  background:radial-gradient(ellipse,#fffdf6,#fbf1d6);box-shadow:inset 0 0 0 5px #fffdf6,inset 0 0 0 6px #c4952f,inset 0 0 0 8px #fffdf6,inset 0 0 0 9px #d6ad45,0 8px 18px rgba(0,0,0,.15);transform:rotate(-1.5deg);transition:transform .2s}
.urk:not(.leer):hover .mini{transform:rotate(0) scale(1.04)}
.urk .mt{font-size:22px;color:#2f5f8f}
.urk .ml{width:55%;height:2px;background:#d6ad45}.urk .ml.k{width:35%;opacity:.6}
.urk .ms{position:absolute;right:12%;bottom:12%;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;background:radial-gradient(circle,#e3bf5a,#b98a26)}
.urk small{color:var(--muted);font-size:14px}
.urk.leer{cursor:default}
.urk.leer .mini{filter:grayscale(1);opacity:.4;transform:none}
.urk.leer .ms{background:#aab}
/* Feier */
.feier{text-align:center;align-items:center;top:12%}
.feier .kick{color:var(--sky-deep);font-size:18px;margin:0}
.stk.big{width:180px;animation:stkpop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes stkpop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
/* Urkunde */
.urkwrap{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.cert{position:relative;aspect-ratio:1.414/1;max-width:100%;background:radial-gradient(ellipse at center,#fffdf6 0%,#fbf3dc 100%);border-radius:6px;padding:5% 7%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.25em;color:#2b2a26;
  box-shadow:inset 0 0 0 10px #fffdf6,inset 0 0 0 12px #c4952f,inset 0 0 0 16px #fffdf6,inset 0 0 0 17px #d6ad45,0 20px 50px rgba(0,0,0,.3);font-size:clamp(11px,2.2vw,17px)}
.cert .cr i{position:absolute;width:44px;height:44px;border:3px solid #c4952f;border-radius:50%}
.cert .cr i:nth-child(1){left:-10px;top:-10px;clip-path:inset(50% 0 0 50%)}
.cert .cr i:nth-child(2){right:-10px;top:-10px;clip-path:inset(50% 50% 0 0)}
.cert .cr i:nth-child(3){left:-10px;bottom:-10px;clip-path:inset(0 0 50% 50%)}
.cert .cr i:nth-child(4){right:-10px;bottom:-10px;clip-path:inset(0 50% 50% 0)}
.ceule{width:4.2em;height:4.2em;border-radius:50%;border:3px solid #d6ad45;background:#fff}
.cert .ck{color:#c4952f;letter-spacing:.12em;margin:0}
.cert .ct{font-size:3.6em;line-height:1;margin:0;color:#2f5f8f;letter-spacing:.04em}
.cert .cv,.cert .cf{margin:0;color:#6c6a5f}
.cert .cn{font-size:2.6em;line-height:1.1;margin:0;color:#1f2421;border-bottom:2px solid #d6ad45;padding:0 1em}
.cert .cu{font-size:1.9em;margin:0;color:#2f5f8f}
.cert .cs{margin:0;color:#6c6a5f;font-size:.9em}
.cfoot{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:.8em;color:#6c6a5f}
.cfoot span:first-child,.cfoot span:last-child{border-top:1.5px solid #c4952f;padding-top:2px;min-width:8em}
.siegel{width:3.4em;height:3.4em;border-radius:50%;display:grid;place-items:center;font-size:1.6em;color:#fff;background:radial-gradient(circle,#e3bf5a,#b98a26);box-shadow:0 0 0 4px #f3dc9a}
@media print{
  body.drucke .app,body.drucke .scrim,body.drucke .urkwrap .dact,body.drucke #pubbar,body.drucke .toast{display:none!important}
  body.drucke .urkwrap{position:static;transform:none;width:100%;max-height:none}
  body.drucke .cert{box-shadow:inset 0 0 0 10px #fffdf6,inset 0 0 0 12px #c4952f,inset 0 0 0 16px #fffdf6,inset 0 0 0 17px #d6ad45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* Lehrperson: Belohnungen */
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.rw{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rw h3{margin:0;font-size:22px}
.rwf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.rwf label{display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--muted)}
.rwm{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.stkadm{display:flex;flex-wrap:wrap;gap:10px}
.stka{position:relative;width:76px}
.stka .stk{width:76px;transform:none}
.stka .del{position:absolute;top:-8px;right:-8px;background:#fff;box-shadow:var(--shadow)}
/* Abzeichen mit den gezeichneten Bildern (vokabelkiste/abzeichen/) */
.bdg .bi{border:0!important;background:none!important;padding:0}
.bdg .bi img{width:100%;height:100%;border-radius:50%;display:block;-webkit-touch-callout:none;user-select:none}
.bdg.t1 .bi{box-shadow:0 4px 10px rgba(63,120,168,.18)}
.bdg.t2 .bi{box-shadow:0 0 0 4px #eef2f5,0 6px 12px rgba(63,120,168,.2)}
.bdg.t0 .bi img{filter:grayscale(1)}
/* Bild & Wort: Bild links, Auswahl rechts (schmal untereinander) */
.bwrap{display:flex;align-items:center;justify-content:center;gap:28px 40px;flex-wrap:wrap;width:min(900px,100%)}
.bside{flex:1 1 300px;max-width:440px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bside .hand{margin:0}
.bside .opts{width:100%}
.bwrap .bbig .pic{width:min(300px,70vw);height:min(300px,70vw)}
.bwrap .bbig .pic.emo{font-size:min(170px,40vw)}
.bwrap .bopts{flex:1 1 320px;max-width:420px}
/* Kärtchen: Bild gross über dem Wort */
.face .cpic{position:relative;z-index:1;display:grid;place-items:center;margin-bottom:2px}
.face .cpic .pic{width:clamp(64px,22vw,120px);height:clamp(64px,22vw,120px);background:transparent}
.face .cpic .pic.emo{font-size:clamp(44px,14vw,78px);width:auto;height:auto}
.face:has(.cpic) .word{font-size:clamp(26px,6vw,40px)}
.face:has(.cpic){padding-top:2.8rem;gap:2px}
/* «geschafft»: goldene Sterne, Kachel mit Haken im Kreis, kein grüner Rahmen */
.vkfort{gap:10px 14px;padding:6px 18px}
.vkf-dots{gap:3px}
.vkf-dots i{width:auto;height:auto;border:0;background:none;font-style:normal;font-size:20px;line-height:1;color:var(--gold-l)}
.vkf-dots i.on{color:var(--gold);background:none;text-shadow:0 1px 4px rgba(214,173,69,.5)}
.vkok{position:static;align-self:flex-start;order:5;background:none;box-shadow:none;color:var(--gold-d);padding:0;font-size:15px}
.vkok::before{content:"★ "}
.tile:has(.vkok){box-shadow:0 0 0 2px var(--gold-l),var(--shadow);background:linear-gradient(180deg,#fffdf6,#fff)}
.tile:has(.vkok) .num{background:var(--gold);border-color:var(--gold);color:transparent}

<script id="vk-app">
window.__vkMain=function(KNI){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hashStr=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+'.'+s.length};
const lsGet=k=>{try{if(window.parent!==window)return null;const t=localStorage.getItem(k);return t?JSON.parse(t):null}catch(e){return null}};

const ssGet=k=>{try{if(window.parent!==window)return null;const t=sessionStorage.getItem(k);return t?JSON.parse(t):null}catch(e){return null}};
const ssSet=(k,v)=>{try{if(window.parent!==window)return;sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};

/* ---------- Inhalt (von der Lehrperson, in der Seite gespeichert) ---------- */
const EMPTY={v:1,subjects:[{id:'en',name:'Englisch',lang:'en',excl:[],tree:[]},{id:'fr',name:'Französisch',lang:'fr',excl:[],tree:[]}]};
let EMBED=null;try{EMBED=JSON.parse($('#vk-content').textContent)}catch(e){}
const KN=!!KNI;

let C=JSON.parse(EMBED_JSON);
const fixC=()=>C.subjects.forEach(s=>{s.excl=s.excl||[];s.tree=s.tree||[]});fixC();

const DKEY='vokabelkiste-entwurf';
let dirty=false,staleDraft=null;
{const d=lsGet(DKEY);if(d&&d.content){
  if(hashStr(JSON.stringify(d.content))===EMBED_HASH)lsDel(DKEY);
  else if(d.base===EMBED_HASH){C=d.content;fixC();dirty=true}
  else staleDraft=d}}

/* ---------- Fortschritt des Kindes (nur auf diesem Gerät) ---------- */
const PKEY='vokabelkiste-fortschritt';
const P=(KN?(KNI.store&&KNI.store.p):lsGet(PKEY))||{};
P.sub=P.sub||'en';P.dir=P.dir||'de-f';P.voice=P.voice||{};P.boxes=P.boxes||{};P.stats=P.stats||{};P.rain=P.rain||{};P.recent=P.recent||{};
const knSend=m=>{if(!KN)return;try{m.knobelnest=1;parent.postMessage(m,'*')}catch(e){}};
const saveP=()=>{if(!KN)return lsSet(PKEY,P);knSend({type:'store',data:{p:P}})};
/* Knobelnest: Übungstage zählen (für Sterne und Abzeichen) und Antworten für die Fortschritts-Übersicht melden */
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let knLv;
function knRec(ok){
  P.days=P.days||{};const t=dayKey();P.days[t]=(P.days[t]||0)+1;
  const ks=Object.keys(P.days).sort();while(ks.length>120)delete P.days[ks.shift()];
  const lv=(C.subjects.find(x=>x.id===P.sub)||C.subjects[0]||{}).name||null;
  if(lv!==knLv){knLv=lv;knSend({type:'level',level:lv})}
  knSend({type:'answer',ok:!!ok});
}
/* Knobelnest: Wortlisten der Lehrperson für die Klasse speichern */
let knSeq=0;const knWait={};
addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.vkAck==null)return;const f=knWait[e.data.vkAck];if(f){delete knWait[e.data.vkAck];f(e.data)}});
function knSave(c){return new Promise((res,rej)=>{const id=++knSeq,t=setTimeout(()=>{delete knWait[id];rej(new Error('timeout'))},15000);
  knWait[id]=d=>{clearTimeout(t);d.ok?res():rej(new Error(d.err||'fehler'))};knSend({type:'vkContent',id,content:JSON.parse(JSON.stringify(c))})})}

/* ---------- Index ---------- */
const IDX=new Map(),NODES=new Map();
function reindex(){IDX.clear();NODES.clear();
  C.subjects.forEach(sub=>{const walk=(arr,parent,path)=>arr.forEach(n=>{const p=[...path,n];NODES.set(n.id,{node:n,sub,parent,path:p});
    if(n.kids)walk(n.kids,n,p);if(n.words)n.words.forEach(w=>IDX.set(w.id,{w,sub,portion:n,path:p}))});walk(sub.tree,null,[])})}
reindex();
const valid=w=>w&&w.de&&w.de.trim()&&w.f&&w.f.trim();
const isOpen=n=>n.open!==false;
const vis=n=>T||isOpen(n);
const pathOpen=id=>{const i=NODES.get(id);return !!i&&i.path.every(isOpen)};
const noSent=()=>fl()==='fr';
const wordsOf=n=>!vis(n)?[]:n.words?n.words.filter(valid):(n.kids||[]).flatMap(wordsOf);
const subWords=s=>s.tree.flatMap(wordsOf);
const portionsIn=n=>!vis(n)?0:n.words?1:(n.kids||[]).reduce((a,k)=>a+portionsIn(k),0);
const WD=id=>(IDX.get(id)||{}).w;
const SUB=()=>C.subjects.find(s=>s.id===P.sub)||C.subjects[0];
const CODE=s=>({en:'EN',fr:'FR',it:'IT',es:'ES'})[s.lang]||String(s.lang).toUpperCase();
const fl=()=>SUB().lang;
let forceFD=false;/* Zusatzwörter («nur verstehen»): beim Schreiben immer Fremdsprache -> Deutsch */
const effDir=()=>forceFD?'f-de':P.dir;
const Q=w=>effDir()==='de-f'?w.de:w.f;
const A=w=>effDir()==='de-f'?w.f:w.de;
const qLang=()=>effDir()==='de-f'?'Deutsch':SUB().name;
const aLang=()=>effDir()==='de-f'?SUB().name:'Deutsch';
const ansF=()=>effDir()==='de-f';

/* ---------- Grundbausteine ---------- */
let session=null,lastBack=null,SET={key:null,label:'',words:[]};
let nav=ssGet('vk-nav')||{view:'node',node:null};let wantT=!!nav.T;ssDel('vk-nav');if(nav.sub&&C.subjects.some(s=>s.id===nav.sub))P.sub=nav.sub;
let T=false,CAN_EDIT=false,ART=null;
function stopSession(){if(session){(session.timers||[]).forEach(clearTimeout);if(session.cleanup)session.cleanup();session=null}try{speechSynthesis.cancel()}catch(e){}}
function later(fn,ms){const t=setTimeout(fn,ms);if(session)session.timers.push(t);return t}
document.addEventListener('keydown',e=>{
  if(!session||!session.key||$('#layer').innerHTML)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  session.key(e);
});
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function confirmBtn(btn,armedLabel,fn){let tm;btn.addEventListener('click',()=>{
  if(btn.classList.contains('sure')){clearTimeout(tm);fn();return}
  const old=btn.textContent;btn.classList.add('sure');btn.textContent=armedLabel;tm=setTimeout(()=>{btn.classList.remove('sure');btn.textContent=old},4000)})}
function openDialog({title,value='',ok='Speichern',onOk}){
  const L=$('#layer');
  L.innerHTML=`<div class="scrim"></div><form class="dlg" id="dlg"><h2 class="lbl">${esc(title)}</h2><input class="inp" id="dlgIn" value="${esc(value)}" aria-label="${esc(title)}" autocomplete="off"><div class="dact"><button type="button" class="pill" id="dlgX">Abbrechen</button><button class="pill go">${esc(ok)}</button></div></form>`;
  const close=()=>{L.innerHTML=''};const i=$('#dlgIn');
  $('#dlgX').onclick=close;$('.scrim',L).onclick=close;i.onkeydown=e=>{if(e.key==='Escape')close()};
  setTimeout(()=>{i.focus();i.select()},30);
  $('#dlg').onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(!v){i.focus();return}close();onOk(v)};
}

/* ---------- Vorlesen ---------- */
const canSpeak='speechSynthesis' in window;
const FEMALE=/\b(female|femme|samantha|karen|moira|tessa|serena|kate|stephanie|martha|fiona|victoria|allison|ava|susan|zira|hazel|libby|sonia|aria|jenny|emma|amy|joanna|salli|kimberly|olivia|natasha|clara|amélie|amelie|audrey|aurélie|aurelie|marie|julie|céline|celine|virginie|denise|hortense|léa|lea|chantal|eloise|elsa|vivienne|charlotte|coralie|brigitte|ariane|sylvie)\b/i;
const MALE=/\b(male|daniel|alex|fred|oliver|george|ryan|guy|david|mark|james|thomas|arthur|rishi|aaron|gordon|reed|rocko|eddy|grandpa|nicolas|henri|paul|claude|jacques|rémi|remi|antoine|jean|mathieu|fabrice|alain|gérard|gerard|louis|yves|guillaume|benjamin)\b/i;
const PREF={en:/en[-_]gb/i,fr:/fr[-_]fr/i};
const SAMPLE_SAY={en:"Hello! Let's learn some words.",fr:'Bonjour ! On apprend des mots ensemble.'};
function voicesFor(lang){try{return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang))}catch(e){return[]}}
function bestVoice(lang){const vs=voicesFor(lang);if(!vs.length)return null;
  const want=P.voice[lang];if(want){const v=vs.find(x=>x.name===want);if(v)return v}
  const sc=v=>{const n=v.name.replace(/female|femme/ig,'');return (FEMALE.test(v.name)?10:0)-(MALE.test(n)?10:0)+(PREF[lang]&&PREF[lang].test(v.lang)?3:0)+(/natural|neural|premium|enhanced|online/i.test(v.name)?4:0)};
  return vs.slice().sort((a,b)=>sc(b)-sc(a))[0]}
/* Vorlesetext säubern: Grammatik-Notizen wie (m), (f.pl.), (Singular) weg, Klammern weg, ’ als normales Apostroph, / und … als kurze Pause */
const NOTE_RE=/\s*\(\s*(?:[mfn]\.?(?:\s*\/?\s*[mfn]\.?)?(?:\s*pl\.?)?|pl\.?|sg\.?|Sing\.?|Singular|Plural|Pl\.?)\s*\)/gi;
function sayClean(t){return String(t||'').replace(/[’‘ʼ`´]/g,"'").replace(/[\[\]]/g,'').replace(NOTE_RE,'').replace(/[()]/g,'')
  .replace(/\s*\/\s*/g,', ').replace(/\s*(?:…|\.\.\.)\s*/g,', ').replace(/\s*,(\s*,)+/g,',').replace(/^[\s,]+|[\s,]+$/g,'').replace(/\s+/g,' ')}
let curU=null;/* Referenz halten: sonst bricht Safari manchmal mitten im Wort ab */
function speak(t,lang,rate){if(!canSpeak||!t)return;lang=lang||fl();t=sayClean(t);if(!t)return;
  try{const ss=speechSynthesis;if(ss.speaking||ss.pending)ss.cancel();if(ss.paused)ss.resume();
    const u=new SpeechSynthesisUtterance(t);const v=bestVoice(lang);
    if(v){u.voice=v;u.lang=String(v.lang).replace('_','-')}else u.lang=lang==='fr'?'fr-FR':'en-GB';
    u.rate=rate||.9;u.pitch=1;curU=u;ss.speak(u)}catch(e){}}
const SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const spkBtn=(text,label='Vorlesen')=>canSpeak&&text?`<button type="button" class="spk" data-say="${esc(text)}" aria-label="${label}">${SPK}</button>`:'';
function bindSpeak(r){$$('[data-say]',r).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();speak(b.dataset.say)}))}
function voiceOptions(lang){const vs=voicesFor(lang);const cur=bestVoice(lang);
  return vs.length?vs.map(v=>`<option value="${esc(v.name)}" ${cur&&cur.name===v.name?'selected':''}>${esc(v.name.replace(/^(Microsoft|Google)\s+/,''))} (${esc(v.lang)})</option>`).join(''):'<option>Stimmen werden geladen …</option>'}
try{speechSynthesis.addEventListener('voiceschanged',()=>{const s=$('#voiceSel');if(s)s.innerHTML=voiceOptions(fl())})}catch(e){}

/* ---------- Statistik und Knacknüsse ---------- */
const NUT_AT=5,CRACK=3;
/* ---------- Knobelnest: Übungszeit, Tagesstern, Serie und Abzeichen ---------- */
const STAR_SEC=420,PROFI=100,FREI=new Set(KN&&KNI.settings&&Array.isArray(KNI.settings.frei)?KNI.settings.frei:[]);
let knAct=0;['pointerdown','keydown','input'].forEach(t=>addEventListener(t,()=>{knAct=Date.now()},true));
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const noon=d=>{d=new Date(d);d.setHours(12,0,0,0);return d};
const schoolDay=d=>{const w=d.getDay();return w>0&&w<6&&!FREI.has(isoOf(d))};
const starOf=(p,k)=>(((p&&p.sec)||{})[k]||0)>=STAR_SEC,starOn=k=>starOf(P,k);
function knStreak(p=P){let n=0;const d=noon(new Date());
  for(let i=0;i<500;i++){if(schoolDay(d)){if(starOf(p,isoOf(d)))n++;else if(i>0)break}d.setDate(d.getDate()-1)}return n}
function knWeeks(p=P){const ks=Object.keys((p&&p.sec)||{}).sort();if(!ks.length)return 0;const d=noon(ks[0]+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));
  const end=new Date();let n=0;
  while(d<=end){let sd=0,ok=true;for(let i=0;i<5;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(schoolDay(x)){sd++;if(!starOf(p,isoOf(x)))ok=false}}
    if(sd&&ok)n++;d.setDate(d.getDate()+7)}return n}
function knFach5(p=P){const ids=new Set();Object.values((p&&p.boxes)||{}).forEach(o=>Object.values(o||{}).forEach(b=>Object.entries((b&&b.map)||{}).forEach(([id,f])=>{if(f>=5)ids.add(id)})));return ids.size}
const knStars=(p=P)=>Object.keys((p&&p.sec)||{}).filter(k=>starOf(p,k)).length;
function knAward(){if(!KN)return;const sec={},d=noon(new Date());for(let i=0;i<35;i++){const k=isoOf(d);if((P.sec||{})[k])sec[k]=P.sec[k];d.setDate(d.getDate()-1)}
  knSend({type:'award',award:{stars:knStars(),vk:{streak:knStreak(),weeks:knWeeks(),fach5:knFach5(),sec}}})}

/* ---------- Prüfen ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFC').replace(/[’`´ʼ]/g,"'").replace(/ß/g,'ss').replace(/ /g,' ').replace(/[.,!?¿¡"«»…]/g,'').replace(/\s*'\s*/g,"'").replace(/\s+/g,' ').trim()}
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* Strenge Prüfung: Richtig ist nur die ganze Antwort, genau wie eingetragen (mit / , Satzzeichen, Gross-/Kleinschreibung).
   Gleich behandelt werden nur Dinge, die man auf der Tastatur nicht sieht: ’ = ', … = ..., ß = ss, Leerzeichen.
   Klammern gehören dazu und müssen mitgeschrieben werden. Vorgelesen werden sie nicht. */
function nrm(s){return String(s).normalize('NFC').replace(/[’‘`´ʼ]/g,"'").replace(/[„“”«»]/g,'"').replace(/\.\.\./g,'…').replace(/ß/g,'ss').replace(/\s+/g,' ')
  .replace(/\s*\/\s*/g,'/').replace(/\s+([?!:;.,…])/g,'$1').replace(/\s*'\s*/g,"'").trim()}
function variants(t){const a=nrm(t);return new Set(a?[a]:[])}
/* Varianten ohne Klammern zählen NICHT als richtig, geben aber den Hinweis «Klammer fehlt» */
function noParen(t){const a=nrm(t);return a.includes('(')?[nrm(a.replace(/[()]/g,'')),nrm(a.replace(/\s*\([^)]*\)\s*/g,' '))]:[]}
const ARTRE=/^(?:l'|(?:le|la|les|un|une|des|du|the|a|an|der|die|das|den|dem|ein|eine|einen)\s+)/i;
function check(input,target){
  const v=nrm(input);if(!v)return{ok:false};
  const vars=[...new Set([].concat(target).flatMap(t=>[...variants(t)]))];
  if(vars.includes(v))return{ok:true};
  const lo=s=>s.toLowerCase(),da=s=>lo(deacc(s)),pu=s=>lo(s).replace(/[.,!?;:\/…"'\-]/g,' ').replace(/\s+/g,' ').trim();
  let hint=null;
  if([].concat(target).flatMap(noParen).includes(v))hint='paren';
  else if(vars.some(o=>lo(o)===lo(v)))hint='case';
  else if(vars.some(o=>da(o)===da(v)))hint='accent';
  else if(vars.some(o=>ARTRE.test(o)&&!ARTRE.test(v)&&lo(o.replace(ARTRE,''))===lo(v)))hint='artmiss';
  else if(vars.some(o=>ARTRE.test(o)&&ARTRE.test(v)&&lo(o.replace(ARTRE,''))===lo(v.replace(ARTRE,''))))hint='artwrong';
  else if(vars.some(o=>pu(o)===pu(v)))hint='punct';
  else if(vars.some(o=>o.length>3&&lev(lo(v),lo(o))<=1))hint='almost';
  else if(vars.some(o=>/[\/,]/.test(o)&&o.split(/[\/,]/).some(p=>pu(p)&&pu(p)===pu(v))))hint='part';

function gapOf(w){
  if(!w||!w.s||!w.s.trim()||!w.f)return null;

  if(mk)return{before:cleanS(w.s.slice(0,mk.index)),after:cleanS(w.s.slice(mk.index+mk[0].length)),word:mk[1].trim(),manual:true};
  const strip=v=>v.replace(/^to\s+/i,'').replace(/^(le|la|les|un|une|des|du|the|a|an)\s+/i,'').replace(/^l['’]\s*/i,'');

function emoKeys(t){t=String(t||'').toLowerCase().normalize('NFC').replace(/[’‘ʼ`´]/g,"'").replace(/\([^)]*\)/g,' ').replace(/\*(?:in|e|r)\b|\*/g,'');
  return t.split(/\s*[\/,;]\s*|\s+oder\s+|\s+or\s+|\s+ou\s+/).map(x=>x.replace(/[.!?…]+/g,' ').replace(/\s+/g,' ').trim().replace(EMO_PRE,'').replace(/^l'/,'').trim()).filter(Boolean)}
function autoEmo(w){for(const k of emoKeys(w.de)){const e=EMO.get('de:'+k)||EMO.get(k);if(e)return e}
  for(const k of emoKeys(w.f)){const e=EMO.get('fl:'+k)||EMO.get(k);if(e)return e}return null}

/* Bilder in der Datenbank (Version 30): w.img = 'vk:<id>'. Sie kommen nur über das Portal (mit Anmeldung) und werden hier
   zwischengespeichert (VKIMG). picHTML setzt zuerst ein leeres Bild ein und holt fehlende gesammelt nach (vkFetch). */
const VKIMG={},vkWant=new Set();let vkWantT=null;
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const isDbImg=v=>/^vk:[a-z0-9]{8,40}$/.test(v||'');
function vkQueue(id){if(VKIMG[id]||vkWant.has(id)||!KN)return;vkWant.add(id);clearTimeout(vkWantT);vkWantT=setTimeout(vkFetch,40)}
async function vkFetch(){const ids=[...vkWant].filter(i=>!VKIMG[i]).slice(0,300);vkWant.clear();if(!ids.length)return;
  try{Object.assign(VKIMG,(await knAsk('vkBilder',{ids}))||{})}catch(e){}
  $$('img[data-vkimg]').forEach(im=>{const d=VKIMG[im.dataset.vkimg];if(d&&im.getAttribute('src')!==d)im.src=d})}
const picHTML=(v,cls='')=>{if(!v)return'';
  if(isDbImg(v)){const id=v.slice(3);if(!VKIMG[id])vkQueue(id);return `<img class="pic ${cls}" data-vkimg="${id}" src="${VKIMG[id]||BLANK}" alt="" draggable="false">`}
  return isImgUrl(v)?`<img class="pic ${cls}" src="${esc(v)}" alt="" draggable="false">`:`<span class="pic emo ${cls}" aria-hidden="true">${esc(v)}</span>`};
/* Bilder nicht herausziehen oder über das Menü speichern (ganz verhindern lässt sich das Kopieren nie) */
