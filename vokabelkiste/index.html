<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vokabelkiste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Amatic+SC:wght@700&family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap">
<style id="vk-css">
/* Layout: wie Tagesfolien und Hausaufgabentafel. Aquarellpapier im Hintergrund, oben die Sprach-Pillen, darunter eine Spalte:
   Ordner -> Portion -> Übungen. Die Kärtchen sind Karteikarten mit rosa Linie und gepunkteten Zeilen, der Karteikasten hat den grünen Agenda-Einband.
   Bewusst nur hell, damit es zum Rest passt und am Beamer gleich aussieht. */
:root{
  color-scheme:light;
  --paper:#fbfaf6; --ink:#1f2421; --muted:#6c766f; --line:#e3e6df; --card:#ffffff; --sheet:#fffefa; --rule:#c4c9c2;
  --rose:#ec9d95; --rose-deep:#d9766c; --rose-ink:#b5524a; --rose-soft:#fcefed;
  --leaf:#7ea56a; --leaf-deep:#4f7f3d; --leaf-soft:#e9f1e3;
  --sky:#8fb0cf; --sky-deep:#5f8fbf; --sky-soft:#eaf1f8; --navy:#3f5f86; --bubble:#a9cdeb;
  --cover:#87ad74; --cover2:#6f9a5f; --nut:#b07a3a; --nut-soft:#f6ecdc; --danger:#c0463c;
  --shadow:0 3px 18px rgba(40,60,45,.12); --shadow-up:0 8px 28px rgba(40,60,45,.17);
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --label:"Amatic SC","Arial Narrow",sans-serif;
  --bub:"Fredoka","Nunito",system-ui,sans-serif;
  --word:"Fredoka","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 38% 45% at 0% 100%,rgba(160,203,150,.55),transparent 70%),
  radial-gradient(ellipse 35% 40% at 100% 0%,rgba(178,214,204,.6),transparent 70%),
  radial-gradient(ellipse 30% 38% at 100% 100%,rgba(176,200,226,.55),transparent 70%),
  radial-gradient(ellipse 25% 22% at 8% 0%,rgba(207,226,216,.5),transparent 70%),
  radial-gradient(ellipse at 40% 30%,#fffefb,#f6f4ec)}
.app{position:relative;z-index:1;min-height:100%;padding-bottom:90px}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Leiste oben */
.top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0 6px 0 0}
.brand svg{flex:none}
.big{font-family:var(--bub);font-weight:700;color:var(--bubble);line-height:1.05;margin:0;overflow-wrap:anywhere;text-wrap:balance;
  font-size:clamp(32px,6vw,52px);
  text-shadow:0 2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 5px 0 rgba(63,95,134,.35)}
.big.brandtxt{font-size:26px;white-space:nowrap;
  text-shadow:0 1.5px 0 var(--navy),1.5px 0 0 var(--navy),-1.5px 0 0 var(--navy),0 -1.5px 0 var(--navy),1.5px 1.5px 0 var(--navy),-1.5px 1.5px 0 var(--navy),1.5px -1.5px 0 var(--navy),-1.5px -1.5px 0 var(--navy),0 3px 0 rgba(63,95,134,.35)}
.big.mid{font-size:clamp(28px,4.6vw,40px)}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.sp{flex:1}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:36px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill:hover:not(:disabled){background:var(--leaf-soft)}
.pill.on,.pill.rose{background:var(--rose);border-color:var(--rose);color:#fff}
.pill.on:hover,.pill.rose:hover{background:#e48a81}
.pill.go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pill.go:hover:not(:disabled){background:#6c9558}
.pill.danger{color:var(--danger)}
.pill.sure{background:var(--danger);border-color:var(--danger);color:#fff}
.pill.sm{min-height:30px;padding:0 11px;font-size:13px}
.pill:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky-soft);color:var(--navy)}
.tbanner{margin-top:6px;background:var(--rose-soft);border:1px dashed var(--rose);border-radius:16px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tbanner .warn{color:var(--danger);font-weight:700}

/* Seitenkopf */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:14px 0 6px}
.crumb{border:0;background:rgba(255,255,255,.75);border-radius:999px;padding:3px 11px;font-weight:700;font-size:13.5px;color:var(--muted)}
button.crumb:hover{background:var(--leaf-soft);color:var(--ink)}
.crumb.cur{background:none;color:var(--ink)}
.sep{color:var(--rule);font-weight:800}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin:4px 0 6px}
.hact{display:flex;gap:6px;flex-wrap:wrap}
.hand{font-family:var(--hand);font-size:20px;color:var(--muted);margin:0;line-height:1.25}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:30px 0 12px}
.lbl{font-family:var(--label);font-size:34px;font-weight:700;line-height:1;margin:0;letter-spacing:.02em}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:0;border-radius:22px;padding:16px 18px 14px;box-shadow:var(--shadow);min-width:0;transition:transform .15s,box-shadow .15s}
.tile:hover:not(:disabled){transform:translateY(-3px);box-shadow:var(--shadow-up)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile h3{font-weight:800;font-size:18px;margin:0;display:flex;align-items:center;gap:10px;padding-right:22px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .go{margin-top:auto;padding-top:6px;font-weight:800;font-size:14px;color:var(--rose-ink)}
.num{position:absolute;top:10px;right:16px;font-family:var(--hand);font-size:24px;color:var(--rose-deep)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sky-soft);color:var(--sky-deep)}
.ico.leaf{background:var(--leaf-soft);color:var(--leaf-deep)}
.ico.rose{background:var(--rose-soft);color:var(--rose-ink)}
.ico.nut{background:var(--nut-soft);color:var(--nut)}
.rec{font-size:13px;font-weight:700;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.minibox{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:end;height:56px;padding:7px;border-radius:12px;margin-top:4px;
  background:radial-gradient(circle,rgba(255,255,255,.22) 1.4px,transparent 2px) 0 0/12px 12px,linear-gradient(160deg,var(--cover),var(--cover2))}
.minibox span{background:#fff;border-top:2px solid var(--rose);border-radius:2px;min-height:4px}
.minil{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 12px;font-size:14px}
.chip b{font-variant-numeric:tabular-nums;background:var(--sky-soft);color:var(--navy);border-radius:999px;padding:0 8px;font-size:12.5px}
.chip.done{color:var(--muted)}
.chip.done b{background:var(--leaf-soft);color:var(--leaf-deep)}
.chip.cur{border-color:var(--rose)}
.chip .wd{font-family:var(--word);font-weight:700}

/* Ordner und Portionen */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 14px;padding-top:12px}
.fold,.portion{position:relative;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.fold:hover,.portion:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.fold{background:var(--fc,var(--sky-soft));border-radius:4px 18px 18px 18px}
.fold::before{content:"";position:absolute;left:0;top:-13px;width:44%;height:14px;background:var(--fc,var(--sky-soft));border-radius:10px 12px 0 0}
.fold.l1{--fc:#e6f0e0}.fold.l2{--fc:#fbeee9}
.portion{background:var(--sheet);border-radius:14px;overflow:hidden}
.portion::before{content:"";position:absolute;left:0;right:0;top:40px;height:2px;background:var(--rose)}
.fmain{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:none;padding:14px 16px 14px;min-height:112px;min-width:0}
.portion .fmain{padding-top:10px}
.fname{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.portion .fname{min-height:30px}
.fmeta{color:var(--muted);font-size:13.5px;font-weight:600}
.pv{font-family:var(--word);color:var(--navy);font-size:15px;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.portion .pv{background:radial-gradient(circle at 50% calc(100% - 1px),var(--rule) .9px,transparent 1.4px) 0 0/5px 100% repeat-x;padding-bottom:3px}
.cact{display:flex;gap:4px;padding:0 10px 10px}
.ib{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:30px;font-weight:800;color:var(--muted);display:grid;place-items:center}
.ib:hover:not(:disabled){background:var(--leaf-soft);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.addcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;border:2px dashed var(--rule);border-radius:18px;padding:14px 16px;min-height:112px}
.addcard .row{display:flex;gap:6px;flex-wrap:wrap}
.addcard .hand{font-size:17px}
.closedn .fmain{opacity:.55}
.fold.closedn,.portion.closedn{outline:2px dashed var(--rose);outline-offset:3px}
.lock{font-weight:800;color:var(--rose-ink)}
.relb{margin-left:auto;border:1px solid var(--rose);background:#fff;color:var(--rose-ink);border-radius:999px;height:30px;padding:0 11px;font-weight:800;font-size:12.5px;white-space:nowrap}
.relb:hover{background:var(--rose-soft)}
.relb.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-deep)}
.portion.total{grid-column:1/-1;order:99;width:min(460px,calc(100% - 10px));margin-top:4px;background:var(--leaf-soft);box-shadow:5px 5px 0 -1px var(--leaf-soft),5px 5px 0 0 #cfdcc6,10px 10px 0 -1px var(--leaf-soft),10px 10px 0 0 #cfdcc6,var(--shadow);margin-right:10px}
.portion.total::before{background:var(--leaf)}
.portion.total .fname{color:var(--leaf-deep)}
.portion.total .pv{font-family:var(--ui);font-size:13.5px;font-weight:700;color:var(--muted);background:none}
.grp{margin-bottom:6px}
.grph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:22px 0 2px}
.gname{border:0;background:none;padding:0 8px 0 0;font-family:var(--hand);font-size:30px;line-height:1.1;color:var(--navy)}
button.gname:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.closedg>.fgrid,.closedg>.grph .gname{opacity:.55}
.empty{background:rgba(255,255,255,.75);border:2px dashed var(--rule);border-radius:18px;padding:22px;text-align:center}

/* Wortliste */
.wlist{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 16px;margin-top:26px}
.wlist summary{cursor:pointer;font-weight:800}
.wtab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:2px 14px;margin-top:10px;align-items:center}
.wtab span{font-family:var(--word);font-size:16px;padding:5px 0;border-bottom:1px dotted var(--rule);overflow-wrap:anywhere}
.wtab .wf{color:var(--navy);font-weight:700}
.spk{border:0;background:var(--sky-soft);color:var(--sky-deep);border-radius:999px;width:32px;height:28px;display:grid;place-items:center;flex:none}
.spk:hover{background:var(--bubble);color:var(--navy)}

/* Editor (Lehrperson) */
.editor{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-top:26px}
.editor .sh{margin-top:0}
.etab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:6px 8px;align-items:center}
.etab .th{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.inp:focus{border-color:var(--sky)}
.inp.sin{grid-column:1/3;font-size:13.5px;margin-bottom:10px;background:var(--paper)}
.inp.warn{border-color:var(--rose-deep)}
.etab .inp.sin{grid-column:1/-1}
.kbx{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.kbxs{display:flex;flex-direction:column;gap:3px}
.xtag{font-family:var(--ui);font-size:11px;font-weight:800;color:var(--sky-deep);background:var(--sky-soft);border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.kbx input{accent-color:var(--leaf);width:17px;height:17px}
.del{border:0;background:none;border-radius:999px;width:32px;height:32px;color:var(--muted);font-size:16px}
.del:hover{background:var(--rose-soft);color:var(--danger)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dotted var(--rule)}
.addrow .inp.sin{grid-column:1/3}
.import{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.import summary{cursor:pointer;font-weight:800}
.import p{color:var(--muted);font-size:14px}
textarea.inp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;resize:vertical;margin-bottom:8px}
.ehint{font-size:13px;color:var(--muted);margin:8px 0 0}

/* Übungs-Ansicht */
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 8px}
.stop .t{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;max-width:460px}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .3s}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12.5px;font-weight:800;padding:2px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.steps span.on{background:var(--rose);border-color:var(--rose);color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.keys{color:var(--muted);font-size:13px;margin:0;text-align:center}

/* Karteikarte */
.card{width:min(460px,100%);max-width:100%;aspect-ratio:105/74;perspective:1400px;cursor:pointer;border-radius:16px}
.card.static{cursor:default}
.inner{position:relative;display:block;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;background:var(--sheet);box-shadow:0 6px 24px rgba(40,60,45,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:3rem 1rem 1.3rem;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:2.5rem;height:2px;background:var(--rose)}
.face .word{padding:0 .45em .16em;background:radial-gradient(circle at 50% calc(100% - 1.5px),var(--rule) 1.1px,transparent 1.7px) 0 100%/7px 7px repeat-x}
.face.back{transform:rotateY(180deg)}
.face .word,.face .sub,.face .hint{position:relative;z-index:1}
.lang{position:absolute;z-index:1;top:.55rem;left:1rem;right:.8rem;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.word{font-family:var(--word);font-weight:600;font-size:clamp(30px,7vw,46px);line-height:1.15;overflow-wrap:anywhere;max-width:100%}
.back .word{color:var(--navy)}
.sub{color:var(--muted);font-size:15px}
.hint{position:absolute!important;bottom:.55rem;font-family:var(--hand);font-size:17px;color:var(--muted)}
.badge{background:var(--rose);color:#fff;border-radius:999px;padding:1px 9px;letter-spacing:.04em;font-size:11px}
.timer{width:min(460px,100%);height:8px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:var(--rose);border-radius:999px;transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(460px,100%)}
.judge button{border-radius:999px;padding:13px;font-size:18px;font-weight:800;border:2px solid}
.judge .no{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink)}
.judge .yes{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep)}
.judge .no:hover{background:#f9dcd8}.judge .yes:hover{background:#d9e8cf}
.judge.off{visibility:hidden}

/* Auswahl */
.opts{display:grid;gap:10px;width:min(460px,100%)}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 18px;font-family:var(--word);font-size:20px;font-weight:700}
.opt:hover{border-color:var(--sky)}
.opt kbd{font-family:var(--ui);font-size:12px;border-radius:999px;background:var(--sky-soft);color:var(--navy);padding:1px 8px}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep)}
.opt.wrong{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink)}

/* Schreiben */
.write{display:flex;gap:10px;width:min(460px,100%)}
.write input{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 18px;font-family:var(--word);font-size:21px}
.write input:focus{border-color:var(--sky);outline:none}
.write input.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.write input.no{border-color:var(--rose);background:var(--rose-soft)}
.acc{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(460px,100%)}
.acc button{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:36px;height:34px;font-family:var(--word);font-size:17px;font-weight:700}
.acc button:hover{background:var(--sky-soft)}
.fb{min-height:3.2em;width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fb .ok{color:var(--leaf-deep);font-weight:800;font-size:17px}
.fb .no{color:var(--rose-ink);font-weight:800;font-size:17px}
.fb .sol{font-family:var(--word);font-size:26px;font-weight:700;color:var(--navy)}
.fb .sub{display:inline-flex;align-items:center;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* 3er */
.tracker{width:min(600px,100%);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* Zusammenfassung */
.summary{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px 24px;text-align:center;width:min(500px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.summary p{margin:0;color:var(--muted)}
.stamp{width:62px;height:62px;border-radius:50%;border:3px solid var(--leaf);color:var(--leaf-deep);display:grid;place-items:center;font-size:30px;font-weight:800;transform:rotate(-8deg);background:var(--leaf-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}

/* Karteikasten */
.box{border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;
  background:radial-gradient(circle,rgba(255,255,255,.22) 1.6px,transparent 2.2px) 0 0/14px 14px,linear-gradient(160deg,var(--cover),var(--cover2));
  box-shadow:0 10px 34px rgba(40,60,45,.22),inset 0 0 0 2px rgba(255,255,255,.18)}
.fach{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sheet);border:0;border-radius:10px;padding:12px 4px 10px;min-height:230px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.08);transition:transform .15s}
.fach:hover:not(:disabled){transform:translateY(-3px)}
.fach:disabled{cursor:default}
.fnum{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fcount{font-family:var(--bub);font-size:34px;font-weight:700;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.stack{flex:1;width:76%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding-block:6px}
.stack i{display:block;height:6px;background:#fff;border:1px solid var(--line);border-top:2px solid var(--rose);border-radius:2px}
.fint{font-family:var(--hand);font-size:16px;color:var(--muted);text-align:center;line-height:1.1}
.due{position:absolute;top:-9px;right:6px;background:var(--rose);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px}
.boxfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}

/* Kasten-Auswahl */
.selgrp{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;margin-top:12px}
.selhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.selhead b{flex:1;min-width:0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--leaf);background:var(--leaf-soft);border-radius:999px;padding:4px 12px;font-family:var(--word);font-size:15px;font-weight:700;color:var(--leaf-deep)}
.wchip small{font-family:var(--ui);font-weight:600;color:var(--muted);margin-left:4px}
.wchip.xw{border-color:var(--sky-deep);background:var(--sky-soft);color:var(--navy)}
.wchip.xw small{color:var(--sky-deep)}
.wchip.xw.off{border-color:var(--sky);background:#fff;color:var(--sky-deep)}
.wchip.off{background:#fff;border-color:var(--line);color:var(--muted);text-decoration:line-through}

/* Paare */
.pairs{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:9px;width:min(620px,100%)}
.pair{aspect-ratio:105/74;max-width:100%;perspective:900px;border:0;background:none;padding:0}
.pair.flipped .inner{transform:rotateY(180deg)}
.pair .face{padding:1.3rem .3rem .3rem;border-radius:10px;gap:0}
.pair .face::before{top:1.1rem}
.pair .face.closed{background:radial-gradient(circle,rgba(255,255,255,.25) 1.4px,transparent 2px) 0 0/12px 12px,linear-gradient(160deg,var(--cover),var(--cover2));color:#fff;font-family:var(--bub);font-size:30px;font-weight:700;padding:0}
.pair .face.closed::before,.pair .face.closed::after{display:none}
.pair .face.open{transform:rotateY(180deg)}
.plang{position:absolute;z-index:1;top:.05rem;left:.5rem;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pword{position:relative;z-index:1;font-family:var(--word);font-weight:700;font-size:clamp(12px,3.1vw,18px);line-height:1.1;overflow-wrap:anywhere}
.pair.fx .pword{color:var(--navy)}
.pair.matched .face.open{background:var(--leaf-soft);box-shadow:0 0 0 2px var(--leaf)}

/* Buchstabensalat */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(620px,100%)}
.slot{width:2.5rem;height:3rem;border:0;border-bottom:3px solid var(--rule);background:none;font-family:var(--word);font-size:28px;font-weight:700;padding:0;color:var(--ink)}
.slot.filled{border-color:var(--sky)}
.slot.fixed{display:inline-grid;place-items:center;width:1.1rem;border-color:transparent;color:var(--muted)}
.gapsp{width:1.2rem}
.slots.ok .slot{color:var(--leaf-deep);border-color:var(--leaf)}
.slots.shown .slot{color:var(--navy);border-color:var(--navy)}
.slots.no{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ltiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(620px,100%)}
.ltile{width:2.8rem;height:3rem;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 0 var(--rule);font-family:var(--word);font-size:24px;font-weight:700;padding:0}
.ltile:hover{background:var(--sky-soft)}
.ltile.used{visibility:hidden}

/* Lückensatz */
.sheet{position:relative;width:min(580px,100%);border-radius:16px;background:var(--sheet);box-shadow:0 6px 24px rgba(40,60,45,.14);padding:3rem 1.3rem 1.2rem;text-align:center;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:2.5rem;height:2px;background:var(--rose)}
.sentence{position:relative;font-family:var(--word);font-size:clamp(20px,4vw,27px);line-height:1.7;margin:0 0 .3rem}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--sky);color:transparent;line-height:1.2}
.blank.show{color:var(--navy);background:var(--sky-soft);border-radius:4px;padding:0 4px}
.blank.ok{color:var(--leaf-deep);border-color:var(--leaf)}
.blank.no{color:var(--rose-ink);border-color:var(--rose)}

/* Hören */
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;padding-block:6px}
.play{width:110px;height:110px;border-radius:50%;border:0;background:var(--sky-deep);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--navy),var(--shadow)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}

/* Wortregen */
.rain{position:relative;width:min(660px,100%);height:min(56vh,440px);min-height:280px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
  background:radial-gradient(circle at 50% calc(100% - 1px),var(--rule) .9px,transparent 1.4px) 0 0/5px 34px repeat,var(--sheet)}
.rain::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rose)}
.rhud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:800;font-variant-numeric:tabular-nums}
.life{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--rose);margin-left:5px}
.life.off{background:var(--line)}
.drop{position:absolute;top:0;background:#fff;border:1px solid var(--line);border-top:3px solid var(--rose);border-radius:8px;padding:3px 11px;font-family:var(--word);font-size:19px;font-weight:700;white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 8px rgba(40,60,45,.12);will-change:transform}
.drop.hit{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-deep);transition:opacity .35s;opacity:0}
.drop.miss{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink);max-width:92%}
.rstart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;z-index:3;background:rgba(255,254,250,.94)}
.rstart p{max-width:34ch;margin:0}

/* Dialog, Leiste unten, Toast */
.scrim{position:fixed;inset:0;background:rgba(31,36,33,.28);z-index:80}
.dlg{position:fixed;z-index:81;left:50%;top:22%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));background:#fff;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:18px;display:flex;flex-direction:column;gap:12px}
.dact{display:flex;justify-content:flex-end;gap:8px}
.pub{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 10px 30px rgba(0,0,0,.16);max-width:calc(100% - 32px);font-weight:700;font-size:14px}
.pub .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rose);margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.voice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.voice select{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:36px;padding:0 14px;max-width:100%;font-weight:700;font-size:14px}
.note{color:var(--muted);font-size:13.5px;margin-top:14px}

@media (max-width:620px){
  .box{gap:5px;padding:8px}
  .fach{min-height:180px}
  .fint{display:none}
  .fcount{font-size:26px}
  .slot{width:2.05rem;height:2.6rem;font-size:23px}
  .ltile{width:2.4rem;height:2.6rem;font-size:20px}
  .etab{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .etab .kbxs{grid-column:1/3;flex-direction:row;gap:14px}
  .etab .th.k{display:none}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow .pill{grid-column:1/-1}
  .big.brandtxt{font-size:22px}
}
/* Knobelnest: Tagesstern, Serie, Abzeichen */
.kntoday{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:6px;margin-bottom:14px}
.kt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 18px;min-width:0}
.kt small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.ktx{flex:1;min-width:0}
.kts{font-size:38px;filter:grayscale(1);opacity:.35}
.kt-day.on .kts{filter:none;opacity:1}
.kt-day.on{background:#fff8e1}
.kt .bar{max-width:none;margin-top:6px}
.kt-day.on .bar i{background:#e0a92a}
.ktn{font-family:var(--bub);font-size:44px;line-height:1;color:var(--muted);min-width:1.1em;text-align:center}
.kt-fire.on .ktn{color:#e0662a}
.ktf{font-size:22px;letter-spacing:-2px;word-break:break-all}
.kt-fire:not(.on) .ktf{font-size:15px;letter-spacing:0;color:var(--muted);font-weight:700}
.kt-badges{flex-direction:column;align-items:stretch;gap:8px}
.kb{display:flex;align-items:center;gap:10px;opacity:.55}
.kb.on{opacity:1}
.kbi{font-size:26px;filter:grayscale(1)}
.kb.on .kbi{filter:none}
@media (prefers-reduced-motion:reduce){.inner,.tile,.fach,.fold,.portion,.bar i,.toast{transition:none}}

function norm(s){return String(s).toLowerCase().normalize('NFC').replace(/[’`´ʼ]/g,"'").replace(/ß/g,'ss').replace(/ /g,' ').replace(/[.,!?¿¡"«»…]/g,'').replace(/\s*'\s*/g,"'").replace(/\s+/g,' ').trim()}

/* Strenge Prüfung: Richtig ist nur die ganze Antwort, genau wie eingetragen (mit / , Satzzeichen, Gross-/Kleinschreibung).
   Gleich behandelt werden nur Dinge, die man auf der Tastatur nicht sieht: ’ = ', … = ..., ß = ss, Leerzeichen.
   Klammern gehören dazu und müssen mitgeschrieben werden. Vorgelesen werden sie nicht. */
function nrm(s){return String(s).normalize('NFC').replace(/[’‘`´ʼ]/g,"'").replace(/[„“”«»]/g,'"').replace(/\.\.\./g,'…').replace(/ß/g,'ss').replace(/\s+/g,' ')

  const v=nrm(input);if(!v)return{ok:false};
  const vars=[...new Set([].concat(target).flatMap(t=>[...variants(t)]))];
  if(vars.includes(v))return{ok:true};
  const lo=s=>s.toLowerCase(),da=s=>lo(deacc(s)),pu=s=>lo(s).replace(/[.,!?;:\/…"'\-]/g,' ').replace(/\s+/g,' ').trim();
  let hint=null;
  if([].concat(target).flatMap(noParen).includes(v))hint='paren';
  else if(vars.some(o=>lo(o)===lo(v)))hint='case';
  else if(vars.some(o=>da(o)===da(v)))hint='accent';
  else if(vars.some(o=>ARTRE.test(o)&&!ARTRE.test(v)&&lo(o.replace(ARTRE,''))===lo(v)))hint='artmiss';
  else if(vars.some(o=>ARTRE.test(o)&&ARTRE.test(v)&&lo(o.replace(ARTRE,''))===lo(v.replace(ARTRE,''))))hint='artwrong';
  else if(vars.some(o=>pu(o)===pu(v)))hint='punct';
  else if(vars.some(o=>o.length>3&&lev(lo(v),lo(o))<=1))hint='almost';
  else if(vars.some(o=>/[\/,]/.test(o)&&o.split(/[\/,]/).some(p=>pu(p)&&pu(p)===pu(v))))hint='part';
  return{ok:false,hint};
}

  if(mk)return{before:cleanS(w.s.slice(0,mk.index)),after:cleanS(w.s.slice(mk.index+mk[0].length)),word:mk[1].trim(),manual:true};

    ${staleDraft?`<span>Es gibt noch einen älteren Entwurf.</span><button class="pill sm" id="takeDraft">Entwurf übernehmen</button><button class="pill sm" id="dropDraft">Verwerfen</button>`:''}

function touch(){dirty=true;lsSet(DKEY,{base:EMBED_HASH,content:C});reindex();renderPub()}
function renderPub(){

  confirmBtn($('#undo'),'Wirklich verwerfen?',()=>{C=JSON.parse(EMBED_JSON);fixC();dirty=false;lsDel(DKEY);reindex();renderPub();rerender();toast('Änderungen verworfen')});

const RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';

function buildHTML(content){
  const SC='scr'+'ipt';
  const json=JSON.stringify(content).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +'<title>Vokabelkiste</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="'+FONTS+'">\n'
    +'<style id="vk-css">'+$('#vk-css').textContent+'</style>\n<div id="vk-root"></div>\n'
    +'<'+SC+' type="application/json" id="vk-content">'+json+'</'+SC+'>\n'
    +'<'+SC+' id="vk-app">'+$('#vk-app').textContent+'</'+SC+'>\n</body></html>';
}
async function publishContent(btn){
  if(!ART){toast('Speichern geht nur, wenn du die Vokabelkiste in claude.ai geöffnet hast.');return}
  if(btn){btn.disabled=true;btn.textContent='Wird veröffentlicht …'}
  ssSet('vk-nav',{view:nav.view==='session'?'node':nav.view,node:nav.node||null,kind:nav.kind,sub:P.sub,T:true});
  if(KN){const fin=()=>{if(btn){btn.disabled=false;btn.textContent='Für die Klasse veröffentlichen'}};
    try{await knSave(C);EMBED_JSON=JSON.stringify(C);dirty=false;renderPub();fin();toast('Gespeichert. Die Kinder sehen es beim nächsten Öffnen.')}
    catch(e){fin();toast('Speichern hat nicht geklappt. Bitte nochmals versuchen.')}
    return}
  try{await ART.publish(buildHTML(C));lsDel(DKEY);dirty=false;toast('Veröffentlicht! Die Seite lädt neu.')}
  catch(e){const c=e&&e.code;if(btn){btn.disabled=false;btn.textContent='Für die Klasse veröffentlichen'}ssDel('vk-nav');
    toast(c==='conflict'?'Inzwischen wurde eine neuere Version gespeichert. Die Seite lädt neu, dein Entwurf bleibt erhalten.'
      :c==='not_writer'||c==='not_granted'?'Du hast keine Berechtigung, diese Vokabelkiste zu ändern.'
      :c==='too_large'?'Die Vokabelkiste ist zu gross zum Speichern.'
      :c==='rate_limited'?'Zu viele Speicherungen hintereinander. Warte kurz und versuch es nochmals.'
      :'Veröffentlichen hat nicht geklappt. Dein Entwurf ist gespeichert.')}
}
function toggleRelease(id){const info=NODES.get(id);if(!info)return;const val=!isOpen(info.node);
  const setAll=n=>{n.open=val;(n.kids||[]).forEach(setAll)};setAll(info.node);if(val)info.path.forEach(n=>{n.open=true});
  touch();rerender();
  if(ART){toast(val?'Freigegeben! Wird für die Kinder gespeichert …':'Ausgeblendet. Wird gespeichert …');publishContent(null)}
  else toast(val?'Freigegeben. Jetzt noch veröffentlichen.':'Für die Kinder ausgeblendet.')}
function rerender(){if(nav.view==='all')goAll(nav.node);else if(nav.view==='box')goBox(nav.kind);else if(nav.view==='boxsel')goBoxSelect();else if(nav.view==='nuts')goNuts();else goNode(nav.node)}
const makeBack=n=>()=>n.view==='all'?goAll(n.node):n.view==='box'?goBox(n.kind):n.view==='nuts'?goNuts():goNode(n.node||null);

/* ---------- Ordner-Ansicht ---------- */
function crumbs(id,extra){const s=SUB();const path=id&&NODES.get(id)?NODES.get(id).path:[];
  const items=[`<button class="crumb" data-node="">${esc(s.name)}</button>`,...path.map((n,i)=>i===path.length-1&&!extra?`<span class="crumb cur">${esc(n.name)}</span>`:`<button class="crumb" data-node="${n.id}">${esc(n.name)}</button>`)];
  if(extra)items.push(`<span class="crumb cur">${esc(extra)}</span>`);
  return `<nav class="crumbs" aria-label="Pfad">${items.join('<span class="sep">›</span>')}</nav>`}
function bindNodes(r){$$('[data-node]',r).forEach(b=>b.addEventListener('click',()=>goNode(b.dataset.node||null)))}
const kidsOf=pid=>pid?(NODES.get(pid)?.node.kids||[]):SUB().tree;

function goNode(id){
  stopSession();
  const s=SUB();let info=id?NODES.get(id):null;if(info&&(info.sub!==s||(!T&&!pathOpen(id))))info=null;if(!info)id=null;
  nav={view:'node',node:id};
  const node=info&&info.node,kids=node?node.kids:s.tree,isPortion=!!(node&&node.words),ws=node?wordsOf(node):[];
  SET={key:id,label:node?node.name:s.name,words:ws};
  let h=crumbs(id);
  h+=`<div class="phead"><h1 class="big">${esc(node?node.name:s.name)}</h1>${T&&node?`<div class="hact"><button class="pill ${isOpen(node)?'go':'rose'}" id="relNode">${isOpen(node)?'✓ Für Kinder freigegeben':'Für Kinder freigeben'}</button><button class="pill" id="ren">Umbenennen</button><button class="pill danger" id="delNode">${isPortion?'Portion':'Ordner'} löschen</button></div>`:''}</div>`;
  if(!node)h+=rootFeatures(s);
  if(kids&&node)h+=`<div class="sh"><h2 class="lbl">Inhalt</h2></div>`+folderGrid(kids,id,info.path.length);
  if(!node)h+=rootGroups(s);
  if(isPortion&&ws.length)h+=practiceHTML();
  if(isPortion)h+=T?editorHTML(node):wordListHTML(ws);
  if(node&&!ws.length&&!T)h+=`<div class="empty" style="margin-top:20px"><p class="hand">Hier sind noch keine Wörter eingetragen.</p></div>`;
  if(!node&&canSpeak)h+=`<div class="sh"><h2 class="lbl">Vorlesestimme</h2><p class="hand">Es wird automatisch eine Frauenstimme gewählt.</p></div>
    <div class="voice"><select id="voiceSel" aria-label="Stimme für ${esc(s.name)}">${voiceOptions(s.lang)}</select><button class="pill" id="voiceTest">${SPK} Probehören</button></div>`;
  if(!node)h+=`<p class="note">Dein Fortschritt (Karteikasten, Knacknüsse, Rekorde) wird ${KN?'im Knobelnest gespeichert – auf jedem Gerät gleich':'auf diesem Gerät gespeichert'}.</p>`;
  stage.innerHTML=h;
  bindNodes(stage);bindSpeak(stage);bindPractice(stage);
  if(!node)bindRoot(s);
  bindFolderGrid(id);
  if(T&&node){
    $('#relNode').onclick=()=>toggleRelease(id);
    $('#ren').onclick=()=>openDialog({title:isPortion?'Portion umbenennen':'Ordner umbenennen',value:node.name,onOk:v=>{node.name=v;touch();goNode(id)}});
    confirmBtn($('#delNode'),'Wirklich löschen?',()=>{const arr=kidsOf(info.parent?info.parent.id:null);arr.splice(arr.indexOf(node),1);touch();toast('Gelöscht');goNode(info.parent?info.parent.id:null)});
  }
  if(isPortion&&T)bindEditor(node);
  window.scrollTo(0,0);
}
function rootFeatures(s){
  const n=subWords(s).length,nuts=nutsOf(s).length;
  const boxTile=kind=>{const b=boxOf(s,kind),c=counts(b),max=Math.max(1,...c),due=c.filter((x,i)=>isDue(b,i+1,x)).length;
    return `<button class="tile" data-box="${kind}" ${n?'':'disabled'}><h3><span class="ico leaf">${kind==='karte'?ICONS.karte:ICONS.schreiben}</span>Karteikasten: ${kind==='karte'?'Kärtchen':'Schreiben'}</h3>
      <div class="minibox">${c.map(x=>`<span style="height:${Math.max(6,Math.round(x/max*100))}%"></span>`).join('')}</div>
      <div class="minil">${c.map(x=>`<span>${x}</span>`).join('')}</div>
      <span class="go">${due?`${due} ${due===1?'Fach':'Fächer'} fällig →`:'Kasten öffnen →'}</span></button>`};
  const rid=k=>String(k).split(':')[0];
  const rec=(P.recent[s.id]||[]).filter(k=>NODES.has(rid(k))&&NODES.get(rid(k)).sub===s&&(T||pathOpen(rid(k)))).slice(0,4);
  return `${KN?knTodayHTML():''}<div class="feat">${boxTile('karte')}${boxTile('schreiben')}
    <button class="tile" id="nutsBtn" ${n?'':'disabled'}><h3><span class="ico nut">${ICONS.nut}</span>Knacknüsse</h3>
      <p>${nuts?`${nuts} ${nuts===1?'knifflige Nuss wartet':'knifflige Nüsse warten'} darauf, geknackt zu werden.`:'Wörter, die oft knifflig sind, landen hier. Zurzeit keine!'}</p><span class="go">${nuts?'Jetzt knacken →':'Anschauen →'}</span></button></div>
    ${rec.length?`<div class="recent"><span class="hand">Zuletzt geübt:</span>${rec.map(k=>k.endsWith(':all')?`<button class="pill sm" data-all="${rid(k)}">${esc(NODES.get(rid(k)).node.name)} · Gesamt</button>`:`<button class="pill sm" data-node="${k}">${esc(NODES.get(k).node.name)}</button>`).join('')}</div>`:''}
    ${!n?`<div class="empty" style="margin-top:16px"><p class="hand">${T?'Leg unten mit «+ Ordner» z. B. «5. Klasse» an, darin «Unit 1» und darin eine Portion «Teil 1».':'Deine Lehrperson hat hier noch keine Wörter eingetragen.'}</p></div>`:''}`;
}
function bindRoot(s){
  $$('[data-box]').forEach(b=>b.onclick=()=>goBox(b.dataset.box));
  const nb=$('#nutsBtn');if(nb)nb.onclick=goNuts;
  const vs=$('#voiceSel');if(vs&&!voicesFor(s.lang).length)setTimeout(()=>{if(vs.isConnected&&!voicesFor(s.lang).length)vs.innerHTML='<option>Standardstimme des Geräts</option>'},3000);
  if(vs){vs.onchange=()=>{P.voice[s.lang]=vs.value;saveP();speak(SAMPLE_SAY[s.lang],s.lang)};$('#voiceTest').onclick=()=>speak(SAMPLE_SAY[s.lang]||'',s.lang)}
}
function rootGroups(s){
  const tops=s.tree.filter(n=>n.kids&&vis(n)),loose=s.tree.filter(n=>!n.kids);
  let h=`<div class="sh"><h2 class="lbl">Was möchtest du lernen?</h2><p class="hand">Such dir eine Portion aus.</p></div>`;
  tops.forEach(n=>{const op=isOpen(n),idx=s.tree.indexOf(n);
    h+=`<section class="grp ${op?'':'closedg'}"><div class="grph"><button class="gname" data-node="${n.id}">${esc(n.name)}</button>${T?`${!op?'<span class="lock">nicht freigegeben</span>':''}<button class="ib" data-mv="-1" data-id="${n.id}" ${idx?'':'disabled'} aria-label="Nach oben">‹</button><button class="ib" data-mv="1" data-id="${n.id}" ${idx<s.tree.length-1?'':'disabled'} aria-label="Nach unten">›</button><button class="ib" data-ren="${n.id}" aria-label="Umbenennen">✎</button><button class="relb ${op?'on':''}" data-rel="${n.id}" style="margin-left:4px">${op?'✓ Freigegeben':'Freigeben'}</button>`:''}</div>${folderGrid(n.kids,n.id,1)}</section>`});
  if(loose.some(vis)||T)h+=(tops.length?`<div class="grph"><span class="gname">${T?'Neue Stufe anlegen':'Weitere'}</span></div>`:'')+folderGrid(loose,null,0);
  return h;
}
function folderGrid(kids,pid,depth){
  let h='<div class="fgrid">';
  kids.forEach((n,i)=>{if(!vis(n))return;const isP=!!n.words,ws=wordsOf(n),op=isOpen(n);
    const meta=isP?`${ws.length} ${ws.length===1?'Wort':'Wörter'}`:`${portionsIn(n)} ${portionsIn(n)===1?'Portion':'Portionen'} · ${ws.length} Wörter`;
    h+=`<div class="${isP?'portion':'fold l'+(depth%3)} ${op?'':'closedn'}"><button class="fmain" data-node="${n.id}"><span class="fname">${esc(n.name)}</span><span class="fmeta">${meta}${T&&!op?' · <span class="lock">nicht freigegeben</span>':''}</span>${isP&&ws.length?`<span class="pv">${ws.slice(0,4).map(w=>esc(w.f)).join(' · ')}${ws.length>4?' …':''}</span>`:''}</button>
      ${T?`<div class="cact"><button class="ib" data-mv="-1" data-id="${n.id}" ${i?'':'disabled'} aria-label="Nach vorne">‹</button><button class="ib" data-mv="1" data-id="${n.id}" ${i<kids.length-1?'':'disabled'} aria-label="Nach hinten">›</button><button class="ib" data-ren="${n.id}" aria-label="Umbenennen">✎</button><button class="relb ${op?'on':''}" data-rel="${n.id}">${op?'✓ Freigegeben':'Freigeben'}</button></div>`:''}</div>`});
  const parent=pid?NODES.get(pid).node:null,direct=kids.filter(n=>n.words&&vis(n)&&wordsOf(n).length);
  if(parent&&direct.length){const all=wordsOf(parent);h+=`<div class="portion total"><button class="fmain" data-all="${pid}"><span class="fname">${esc(parent.name)} · Gesamt</span><span class="fmeta">Alle Teile zusammen · ${all.length} Wörter</span><span class="pv">${direct.map(n=>esc(n.name)).join(' + ')}</span></button></div>`}
  if(T)h+=`<div class="addcard"><div class="row"><button class="pill" data-add="folder" data-pid="${pid||''}">+ Ordner</button><button class="pill" data-add="portion" data-pid="${pid||''}">+ Portion</button></div><span class="hand">Neues ist zuerst nur für dich sichtbar. Mit «Freigeben» schaltest du es für die Kinder frei.</span></div>`;
  else if(!kids.filter(vis).length)h+=`<p class="hand">Hier ist noch nichts.</p>`;
  return h+'</div>';
}
function bindFolderGrid(pid){
  $$('[data-mv]').forEach(b=>b.onclick=()=>{const inf=NODES.get(b.dataset.id);if(!inf)return;const arr=kidsOf(inf.parent?inf.parent.id:null);const i=arr.indexOf(inf.node),j=i+(+b.dataset.mv);if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];touch();rerender()});
  $$('[data-rel]').forEach(b=>b.onclick=()=>toggleRelease(b.dataset.rel));
  $$('[data-all]').forEach(b=>b.onclick=()=>goAll(b.dataset.all));
  $$('[data-ren]').forEach(b=>b.onclick=()=>{const n=NODES.get(b.dataset.ren).node;openDialog({title:'Umbenennen',value:n.name,onOk:v=>{n.name=v;touch();rerender()}})});
  $$('[data-add]').forEach(b=>b.onclick=()=>{const f=b.dataset.add==='folder',pp=b.dataset.pid||null;
    openDialog({title:f?'Neuer Ordner':'Neue Portion',value:'',ok:'Anlegen',onOk:v=>{const n=f?{id:uid(),name:v,kids:[],open:false}:{id:uid(),name:v,words:[],open:false};kidsOf(pp).push(n);touch();if(f)rerender();else goNode(n.id);if(!f)setTimeout(()=>{const i=$('#nde');if(i)i.focus()},50)}})});
}
function wordListHTML(ws){
  if(!ws.length)return '';
  return `<details class="wlist"><summary>Alle Wörter anschauen (${ws.length})</summary><div class="wtab">${ws.map(w=>`<span>${esc(w.de)}</span><span class="wf">${esc(w.f)}${w.x?' <small class="xtag">nur verstehen</small>':''}</span>${spkBtn(w.f)||'<span></span>'}`).join('')}</div></details>`;
}

function goAll(id){
  stopSession();const s=SUB(),info=NODES.get(id);
  if(!info||info.sub!==s||info.node.words||(!T&&!pathOpen(id)))return goNode(null);
  nav={view:'all',node:id};const node=info.node,ws=wordsOf(node);
  const parts=(node.kids||[]).filter(n=>n.words&&vis(n)&&wordsOf(n).length);
  SET={key:id+':all',label:node.name+' · Gesamt',words:ws};
  stage.innerHTML=crumbs(id,'Gesamt')+`<div class="phead"><h1 class="big">${esc(node.name)} · Gesamt</h1></div>
    <p class="hand">Alle ${ws.length} Wörter aus ${parts.map(n=>'«'+esc(n.name)+'»').join(', ')} zusammen. Kommt ein neuer Teil dazu, ist er hier automatisch dabei.</p>`
    +(ws.length?practiceHTML()+wordListHTML(ws):'');
  bindNodes(stage);bindSpeak(stage);bindPractice(stage);window.scrollTo(0,0);
}

function practiceHTML(){

const MODE_FN=()=>({karte:modeCards,drei:modeThree,merken:modeMerken,salat:modeScramble,schreiben:modeWrite,hoeren:modeListen,luecke:modeGap,pairs:modePairs,regen:modeRain});
function reviewGaps(){
  const ws=SET.words.slice();if(!ws.length)return;const body=shell('Lückensätze prüfen');let i=0;
  const show=()=>{const w=ws[i],g=gapOf(w),has=!!(w.s&&w.s.trim());
    setProg(`Satz ${i+1} von ${ws.length}`,(i+1)/ws.length);
    body.innerHTML=`<div class="sheet"><div class="lang"><span>${esc(w.de)} = ${esc(w.f)}</span><span class="badge" style="background:${g?'var(--leaf)':'var(--rose-deep)'}">${g?(g.manual?'Lücke selbst gewählt':'passt'):has?'keine Lücke gefunden':'kein Satz'}</span></div>
      <p class="sentence">${g?`${esc(g.before)}<span class="blank show">${esc(g.word)}</span>${esc(g.after)}`:has?esc(cleanS(w.s)):'–'}</p>
      <p class="sub">${g?'Blau markiert ist die Lücke, die die Kinder ausfüllen.':has?'Markier unten im Satz die Stelle, die zur Lücke werden soll.':'Zu diesem Wort gibt es keinen Satz. Schreib unten einen.'}</p></div>
      <input class="inp" id="gs" value="${esc(w.s||'')}" placeholder="Beispielsatz hier schreiben oder ändern" aria-label="Beispielsatz" style="width:min(580px,100%);font-size:16px">
      <div class="actions"><button class="pill go sm" id="gmark">Markierte Stelle als Lücke</button>${g&&g.manual?'<button class="pill sm" id="gauto">Lücke wieder automatisch</button>':''}</div>
      <p class="keys" style="max-width:520px">So legst du die Lücke selbst fest: Im Feld die Wörter mit der Maus markieren, dann auf «Markierte Stelle als Lücke» klicken. Im Feld erscheinen sie in [eckigen Klammern].</p>
      <div class="actions"><button class="pill" id="gp" ${i?'':'disabled'}>‹ Zurück</button>${spkBtn(cleanS(w.s),'Satz vorlesen')}<button class="pill rose" id="gn">${i<ws.length-1?'Weiter ›':'Fertig'}</button></div>
      <p class="keys">← → zum Blättern · Änderungen werden in deinen Entwurf übernommen</p>`;
    bindSpeak(body);
    const gs=$('#gs',body);
    gs.onchange=e=>{w.s=e.target.value.trim();touch();show()};
    gs.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gs.blur()}};
    const mb=$('#gmark',body);mb.onmousedown=e=>e.preventDefault();
    mb.onclick=()=>{const v=gs.value,a=gs.selectionStart,b=gs.selectionEnd;
      if(a==null||a===b){toast('Markier zuerst im Feld die Wörter für die Lücke.');gs.focus();return}
      const cnt=t=>(t.match(/[\[\]]/g)||[]).length,ca=a-cnt(v.slice(0,a)),cb=b-cnt(v.slice(0,b)),c=cleanS(v);
      let x=ca,y=cb;while(x<y&&c[x]===' ')x++;while(y>x&&c[y-1]===' ')y--;
      if(x===y){toast('Markier zuerst im Feld die Wörter für die Lücke.');return}
      w.s=c.slice(0,x)+'['+c.slice(x,y)+']'+c.slice(y);touch();show()};
    const ga=$('#gauto',body);if(ga)ga.onclick=()=>{w.s=cleanS(w.s);touch();show()};
    $('#gp',body).onclick=()=>{if(i>0){i--;show()}};
    $('#gn',body).onclick=()=>{if(i<ws.length-1){i++;show()}else lastBack()};
  };
  session.key=e=>{if(e.key==='ArrowRight'){e.preventDefault();$('#gn').click()}else if(e.key==='ArrowLeft'){e.preventDefault();$('#gp').click()}};
  show();
}

      `<input class="inp" data-id="${w.id}" data-f="de" value="${esc(w.de)}" aria-label="Deutsch"><input class="inp" data-id="${w.id}" data-f="f" value="${esc(w.f)}" aria-label="${esc(s.name)}">
       <span class="kbxs"><label class="kbx"><input type="checkbox" data-kx="${w.id}" ${ex.has(w.id)?'':'checked'}> Kasten</label><label class="kbx" title="Muss man nicht schreiben können. Beim Schreiben wird von ${esc(s.name)} auf Deutsch gefragt."><input type="checkbox" data-xx="${w.id}" ${w.x?'checked':''}> nur verstehen</label></span><button class="del" data-del="${w.id}" aria-label="Wort löschen">✕</button>
       ${noSent()?'':`<input class="inp sin ${warnOf(w)?'warn':''}" data-id="${w.id}" data-f="s" value="${esc(w.s||'')}" placeholder="Beispielsatz (freiwillig)" aria-label="Beispielsatz">`}`).join('');
    $$('#etab [data-f]').forEach(inp=>inp.addEventListener('input',()=>{const w=node.words.find(x=>x.id===inp.dataset.id);if(!w)return;w[inp.dataset.f]=inp.value;touch();
      const si=$(`#etab [data-f="s"][data-id="${w.id}"]`);if(si)si.classList.toggle('warn',warnOf(w))}));
    $$('#etab [data-xx]').forEach(cb=>cb.onchange=()=>{const w=node.words.find(x=>x.id===cb.dataset.xx);if(!w)return;if(cb.checked)w.x=true;else delete w.x;touch()});
    $$('#etab [data-kx]').forEach(cb=>cb.onchange=()=>{const id=cb.dataset.kx;s.excl=s.excl.filter(x=>x!==id);if(!cb.checked)s.excl.push(id);touch()});
    $$('#etab [data-del]').forEach(b=>b.onclick=()=>{node.words=node.words.filter(x=>x.id!==b.dataset.del);touch();table()});
  };table();
  $('#addf').onsubmit=e=>{e.preventDefault();const de=$('#nde').value.trim(),f=$('#nfx').value.trim();
    if(!de||!f){toast(`Bitte Deutsch und ${s.name} ausfüllen`);return}

    $('#imp').value.split(/\r?\n/).forEach(line=>{if(!line.trim())return;let p=line.split(/\t|\s*=\s*|\s*;\s*/);if(p.length<2)p=line.split(/\s+-\s+/);
      if(p.length>=2&&p[0].trim()&&p[1].trim()){node.words.push({id:uid(),de:p[0].trim(),f:p[1].trim(),s:noSent()?'':p.slice(2).join('; ').trim()});n++}else skip++});
    if(n)touch();$('#imp').value='';table();toast(n?`${n} Wörter importiert${skip?`, ${skip} Zeilen übersprungen`:''}`:'Keine Zeile erkannt. Trenn Deutsch und Fremdwort mit =')};

}
function setProg(html,frac){const p=$('#prog');if(p)p.innerHTML=html;const b=$('#barI');if(b)b.style.width=Math.round(Math.min(1,Math.max(0,frac||0))*100)+'%'}
function cardHTML(w,{flip=true,badge=''}={}){

function summary(body,{title,lines,actions}){

const backAct=()=>({label:'Zurück zur Auswahl',fn:()=>lastBack()});
const endActions=(hard,fn)=>[...(hard.size?[{label:'Schwierige nochmal',primary:true,fn:()=>fn(shuffle([...hard]))}]:[]),{label:'Nochmal alle',primary:!hard.size,fn:()=>fn()},backAct()];
function freshOrder(list,key){P.lastOrder=P.lastOrder||{};const prev=P.lastOrder[key];let o=shuffle(list);
  if(prev&&list.length>3)for(let t=0;t<12&&o.slice(0,3).join()===prev;t++)o=shuffle(list);
  if(prev&&list.length>1&&o[0]===prev.split(',')[0]){const k=1+(Math.random()*(o.length-1)|0);[o[0],o[k]]=[o[k],o[0]]}
  P.lastOrder[key]=o.slice(0,3).join();saveP();return o}
const reins=(q,id)=>{const lo=Math.min(2,q.length);q.splice(lo+(Math.random()*(q.length-lo+1)|0),0,id)};
const ids=(subset,mode)=>subset?shuffle(subset):freshOrder(SET.words.map(w=>w.id),(SET.key||'')+':'+mode);

function flashUI(body,w,{onAnswer,auto=0,badge='',extra='',sayOnFlip=false}){
  body.innerHTML=cardHTML(w,{badge})+(auto?`<div class="timer"><span style="animation-duration:${auto}ms"></span></div>`:'')+
    `<div class="judge off" id="judge"><button class="no" data-a="0">✗ Falsch</button><button class="yes" data-a="1">✓ Gewusst</button></div><p class="keys">Leertaste: umdrehen · ← falsch · → gewusst</p>${extra}`;
  bindSpeak(body);
  const card=$('#card',body),judge=$('#judge',body);let flipped=false,done=false,timer;
  const flip=byTimer=>{clearTimeout(timer);
    if(!flipped){flipped=true;judge.classList.remove('off');const tm=$('.timer span',body);if(tm)tm.style.animationPlayState='paused';if(sayOnFlip)speak(w.f);
      if(byTimer){const h=$('.face.back .sub',body);if(h)h.textContent='Zeit um! Wusstest du es?'}}
    card.classList.toggle('flipped',byTimer?true:!card.classList.contains('flipped'))};
  const answer=ok=>{if(done||!flipped)return;done=true;onAnswer(ok)};
  card.onclick=()=>flip(false);
  $$('[data-a]',body).forEach(b=>b.onclick=()=>answer(b.dataset.a==='1'));
  if(auto)timer=later(()=>flip(true),auto);
  session.key=e=>{if(e.code==='Space'||(e.key==='Enter'&&!flipped)){e.preventDefault();flip(false)}
    else if(e.key==='ArrowRight'){e.preventDefault();answer(true)}else if(e.key==='ArrowLeft'){e.preventDefault();answer(false)}};
}
function writeUI(body,w,{onAnswer,badge='',prompt,target,solution,placeholder,sayText,onChecked,foreign,rev=true}){
  forceFD=!!(rev&&w.x);if(forceFD&&!badge)badge='nur verstehen';
  target=target||A(w);solution=solution||esc(A(w));if(foreign===undefined)foreign=ansF();
  if(sayText===undefined)sayText=ansF()?w.f:null;

  forceFD=false;bindSpeak(body);

    else{inp.classList.add('no');fb.innerHTML=`<span class="no">${HINTS[r.hint]||'✗ Leider falsch.'} Richtig ist:</span><span class="sol">${solution}</span>${sb}<button type="button" class="linkbtn" id="override">Ich hatte doch recht</button>`;
      $('#override',fb).onclick=()=>{result=true;onAnswer(true)}}
    bindSpeak(fb);if(onChecked)onChecked(r.ok);btn.focus();
  };
}
function mcUI(body,w,pool,onAnswer){
  /* Falsche Antworten nur aus derselben Portion. Nur wenn die Portion zu klein ist (unter 3 Wörter), wird aufgefüllt. */
  const inf=IDX.get(w.id),own=inf&&inf.portion&&inf.portion.words?inf.portion.words.filter(valid):[];
  const seen=new Set([norm(A(w))]),sameQ=norm(Q(w)),dis=[];
  for(const src of [own,pool]){for(const o of shuffle(src.filter(o=>o.id!==w.id))){if(dis.length>=2)break;const k=norm(A(o));if(!seen.has(k)&&norm(Q(o))!==sameQ){seen.add(k);dis.push(o)}}if(dis.length>=2)break}
  const opts=shuffle([w,...dis]);
  body.innerHTML=cardHTML(w,{flip:false})+`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(A(o))}</span></button>`).join('')}</div><p class="keys">Tasten 1 – ${opts.length}</p>`;
  bindSpeak(body);let done=false;
  const pick=i=>{if(done||!opts[i])return;done=true;const ok=opts[i].id===w.id;
    $$('.opt',body).forEach((b,j)=>{if(opts[j].id===w.id)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
    if(ok&&ansF())speak(w.f);later(()=>onAnswer(ok),ok?700:1500)};
  $$('.opt',body).forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  session.key=e=>{const n=parseInt(e.key,10);if(n>=1&&n<=opts.length){e.preventDefault();pick(n-1)}};
}

/* 1 Kärtchen */
function modeCards(subset){
  const list=ids(subset,'karte'),total=list.length;const body=shell('Kärtchen');let queue=list.slice(),done=0,tries=0;const hard=new Set();
  const next=()=>{setProg(`${done} von ${total} gewusst${hard.size?` · ${hard.size} knifflig`:''}`,done/total);
    if(!queue.length)return summary(body,{title:'Alle gewusst!',lines:[`${total} Wörter, ${tries} Versuche.`,hard.size?`${hard.size} ${hard.size===1?'Wort war':'Wörter waren'} beim ersten Mal falsch.`:'Alles beim ersten Mal richtig.'],actions:endActions(hard,modeCards)});
    const id=queue.shift();flashUI(body,WD(id),{sayOnFlip:ansF(),onAnswer:ok=>{tries++;rec(id,ok);if(ok)done++;else{hard.add(id);reins(queue,id)}next()}})};next();
}
/* 2 3er-Modus */
const AUTO_MS=4000,NEED=3,WINDOW=2;/* kürzer: bei jedem neuen Wort kommen nur die 2 zuletzt gelernten nochmals dran */
function modeThree(){
  const order=shuffle(SET.words.map(w=>w.id)),total=order.length;const body=shell('3er-Modus');
  let ptr=0,last=null,right=0,wrong=0,again=null,round=[],prevRound='';const intro=[],need={},seen=new Set();
  while(intro.length<Math.min(3,total)){const id=order[ptr++];intro.push(id);need[id]=NEED}
  const advance=()=>{if(ptr>=total)return false;const id=order[ptr++];const quota=1;
    intro.slice(-WINDOW).forEach(o=>need[o]=(need[o]||0)+quota);intro.push(id);need[id]=NEED;toast(`Ein neues Wort kommt dazu (${intro.length} von ${total})`);return true};
  const pick=()=>{if(again){const a=again;again=null;return a}
    round=round.filter(i=>need[i]>0&&i!==last);
    if(!round.length){let c=intro.filter(i=>need[i]>0);if(!c.length){if(!advance())return null;c=intro.filter(i=>need[i]>0)}
      let r=shuffle(c);for(let t=0;t<20&&c.length>1&&(r[0]===last||(c.length>2&&r.join()===prevRound));t++)r=shuffle(c);prevRound=r.join();round=r}
    return round.shift()};
  const tracker=cur=>`<div class="tracker">${intro.map(i=>`<span class="chip ${need[i]?'':'done'} ${i===cur?'cur':''}"><span class="wd">${esc(Q(WD(i)))}</span><b>${need[i]?'noch '+need[i]+'×':'✓'}</b></span>`).join('')}</div>`;
  const step=()=>{const id=pick();
    setProg(`${intro.length} von ${total} Wörtern im Spiel · ${right} ✓ · ${wrong} ✗`,intro.filter(i=>!need[i]).length/total);
    if(!id)return summary(body,{title:'Alle geschafft!',lines:[`${total} Wörter im 3er-Modus gelernt.`,`${right}× gewusst, ${wrong}× falsch.`],actions:[{label:'Nochmal',primary:true,fn:modeThree},backAct()]});
    last=id;const isNew=!seen.has(id);seen.add(id);

      /* Das Fach gilt erst als geübt, wenn jedes Kärtchen darin seit dem letzten Mal einmal dran war */
      const rest=inFach(b,f).filter(id=>(b.t[id]||0)<=(b.last[f]||0));if(!rest.length)b.last[f]=Date.now();saveP();
      return summary(body,{title:`Fach ${f} geübt`,lines:[up?`${up} ${up===1?'Kärtchen rutscht':'Kärtchen rutschen'} ${f<5?'in Fach '+(f+1):'zurück in Fach 5'}.`:'Kein Kärtchen ist weitergerutscht.',down?`${down} ${down===1?'Kärtchen muss':'Kärtchen müssen'} zurück in Fach 1.`:'Keines musste zurück.',
        rest.length?`In Fach ${f} warten noch ${rest.length} Kärtchen. Das Fach bleibt fällig, bis alle einmal dran waren.`:''],
        actions:[{label:'Zum Kasten',primary:true,fn:()=>goBox(kind)}]})}
    const id=queue.shift(),h=b.hits[id]||0;
    const after=ok=>{rec(id,ok);
      if(ok){const n=(b.hits[id]||0)+1;if(n>=2){b.map[id]=Math.min(5,f+1);b.hits[id]=0;b.t[id]=Date.now();up++;doneN++;if(f<5)toast('2× gewusst: weiter in Fach '+(f+1))}else{b.hits[id]=n;queue.push(id)}}
      else{b.map[id]=1;b.hits[id]=0;b.t[id]=Date.now();down++;doneN++}saveP();next()};
    const badge=h?'1× richtig':'';
    if(kind==='karte')flashUI(body,WD(id),{sayOnFlip:ansF(),onAnswer:after,badge});else writeUI(body,WD(id),{onAnswer:after,badge})};
  lastBack=()=>goBox(kind);next();
}
function goBoxSelect(){
  stopSession();nav={view:'boxsel'};const s=SUB();
  const groups=[];const walk=(arr,path)=>arr.forEach(n=>{const p=[...path,n.name];if(n.words){const ws=n.words.filter(valid);if(ws.length)groups.push({path:p,ws})}if(n.kids)walk(n.kids,p)});walk(s.tree,[]);
  const ex=()=>new Set(s.excl);
  const counter=()=>{const all=subWords(s).length,inBox=boxWords(s).length;return `${inBox} von ${all} Wörtern sind im Kasten.`};
  stage.innerHTML=crumbs(null,'Kasten-Auswahl')+`<div class="phead"><h1 class="big">Was kommt in den Kasten?</h1><div class="hact"><button class="pill" id="toBox">← Zum Karteikasten</button></div></div>
    <p class="hand">Grün = im Karteikasten. Tipp ein Wort an, wenn es weniger wichtig ist und nicht immer repetiert werden muss. So bleibt der Kasten ein Fundus der wichtigsten Wörter. <span style="color:var(--sky-deep)">Blau = Zusatzwort («nur verstehen»).</span> <b id="cnt">${counter()}</b></p>
    ${groups.map((g,gi)=>`<div class="selgrp"><div class="selhead"><b>${g.path.map(esc).join(' › ')}</b><button class="pill sm" data-all="${gi}">alle</button><button class="pill sm" data-none="${gi}">keine</button></div>
      <div class="wchips">${g.ws.map(w=>`<button class="wchip ${ex().has(w.id)?'off':''} ${w.x?'xw':''}" data-w="${w.id}" aria-pressed="${!ex().has(w.id)}">${esc(w.f)}<small>${esc(w.de)}</small></button>`).join('')}</div></div>`).join('')||'<div class="empty"><p class="hand">Noch keine Wörter eingetragen.</p></div>'}`;
  bindNodes(stage);$('#toBox').onclick=()=>goBox('karte');
  const set=(id,on)=>{s.excl=s.excl.filter(x=>x!==id);if(!on)s.excl.push(id);const b=$(`[data-w="${id}"]`);if(b){b.classList.toggle('off',!on);b.setAttribute('aria-pressed',String(on))}};
  const done=()=>{touch();$('#cnt').textContent=counter()};
  $$('[data-w]').forEach(b=>b.onclick=()=>{set(b.dataset.w,b.classList.contains('off'));done()});
  $$('[data-all]').forEach(b=>b.onclick=()=>{groups[+b.dataset.all].ws.forEach(w=>set(w.id,true));done()});
  $$('[data-none]').forEach(b=>b.onclick=()=>{groups[+b.dataset.none].ws.forEach(w=>set(w.id,false));done()});
  window.scrollTo(0,0);
}
