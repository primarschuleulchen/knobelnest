/* Anfrage ans Portal mit Antwort (vkReply) */
let knRid=0;const knAskW={};
addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.vkReply==null)return;const f=knAskW[e.data.vkReply];if(f){delete knAskW[e.data.vkReply];f(e.data)}});
function knAsk(type,o){return new Promise((res,rej)=>{if(!KN){rej(new Error('Nur in der Klassenkiste'));return}const rid='r'+(++knRid);
  const t=setTimeout(()=>{delete knAskW[rid];rej(new Error('Keine Antwort von der Klassenkiste'))},20000);
  knAskW[rid]=d=>{clearTimeout(t);d.ok?res(d.data):rej(new Error(d.err||'Fehler'))};knSend(Object.assign({type,rid},o||{}))})}
const newImgId=()=>('b'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)).replace(/[^a-z0-9]/g,'').slice(0,30);
/* Ein Bild speichern: in der Klassenkiste in der Datenbank (geschützt), sonst direkt im Wort */
async function vkStore(data){if(!KN)return data;const id=newImgId();await knAsk('vkBildPut',{id,data});VKIMG[id]=data;return 'vk:'+id}
/* Emoji-Suche für die Lehrperson: alle Bilder, deren Stichwort mit dem Suchwort beginnt */
function emoFind(q){q=String(q||'').toLowerCase().trim();const out=[];if(!q)return out;
  for(const [k,e] of EMO){const kk=k.replace(/^(de|fl):/,'');if((kk.startsWith(q)||kk.split(' ').some(x=>x.startsWith(q)))&&!out.includes(e))out.push(e);if(out.length>=40)break}return out}
const EMO_GRUND=['🍎','🐕','🐈','🏫','📕','✏️','🎒','👩','👨','👧','👦','👪','😊','😢','😠','😴','☀️','🌧️','❄️','🍂','🌷','🏠','🚲','⚽','🎵','🎨','🍕','🧀','🍞','🥛','👕','👖','👟','🧢','🎁','⭐','❤️','✅','❌','🗣️'];

/* Eigenes Bild: ganz ins Quadrat einpassen (nichts abschneiden, durchsichtiger Hintergrund bleibt), 800 px (scharf auch gross und auf dem iPad), als webp.
   Kann das Gerät kein webp, dann png (oder jpeg mit weissem Grund, wenn es zu gross wird). */
function picFromFile(file,S=800){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type)){rej(new Error('Das ist kein Bild.'));return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
      const w0=img.naturalWidth,h0=img.naturalHeight,f=Math.min((S-8)/w0,(S-8)/h0),w=Math.round(w0*f),h=Math.round(h0*f);
      g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(img,0,0,w0,h0,Math.round((S-w)/2),Math.round((S-h)/2),w,h);URL.revokeObjectURL(url);
      /* webp (durchsichtig); kann das Gerät kein webp: png, wenn zu gross jpeg mit weissem Grund. Höchstens 290'000 Zeichen. */
      const webp=/^data:image\/webp/.test(c.toDataURL('image/webp',.5));
      const jpg=q=>{const c2=document.createElement('canvas');c2.width=S;c2.height=S;const g2=c2.getContext('2d');g2.fillStyle='#fff';g2.fillRect(0,0,S,S);g2.drawImage(c,0,0);return c2.toDataURL('image/jpeg',q)};
      let d=webp?c.toDataURL('image/webp',.84):c.toDataURL('image/png');
      for(const q of [.84,.75,.65,.55,.45]){if(d.length<=290000)break;d=webp?c.toDataURL('image/webp',q):jpg(q)}
      res(d)}catch(e){rej(e)}};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Das Bild lässt sich nicht öffnen.'))};img.src=url})}

/* Bild-Auswahl für ein Wort (Lehrperson) */
function picDialog(w,onDone){
  const L=$('#layer');let cur=w.img;
  const now=()=>cur==='-'?null:(cur||autoEmo(w));
  const draw=()=>{const v=now(),auto=!cur&&!!v;
    L.innerHTML=`<div class="scrim"></div><div class="dlg picdlg" role="dialog" aria-label="Bild wählen">
      <h2 class="lbl">Bild für «${esc(w.de)} = ${esc(w.f)}»</h2>
      <div class="pdnow">${v?picHTML(v,'big'):'<span class="pic none big">–</span>'}<p>${auto?'Automatisch gewählt. Passt es nicht? Such unten ein anderes oder lade ein eigenes Bild hoch.':cur==='-'?'Dieses Wort hat kein Bild. Es kommt bei «Bild &amp; Wort» nicht vor.':v?'Dieses Bild hast du gewählt.':'Noch kein Bild gefunden. Such unten eines oder lade ein eigenes hoch.'}</p></div>
      <input class="inp" id="pdq" placeholder="Bild suchen (z. B. Hund, apple) oder Emoji einfügen" aria-label="Bild suchen" autocomplete="off">
      <div class="pdgrid" id="pdgrid"></div>
      <div class="dact pdact"><label class="pill"><input type="file" accept="image/*" id="pdfile" hidden>📷 Eigenes Bild</label>
        ${cur?'<button class="pill" id="pdauto">Automatisch</button>':''}${cur!=='-'?'<button class="pill" id="pdnone">Kein Bild</button>':''}<span class="sp"></span><button class="pill go" id="pdok">Fertig</button></div></div>`;
    const grid=$('#pdgrid',L),q=$('#pdq',L);
    const fill=()=>{const t=q.value.trim();let list=t?emoFind(t):[...new Set([...emoKeys(w.de).flatMap(emoFind),...EMO_GRUND])].slice(0,40);
      const own=t&&/\p{Extended_Pictographic}/u.test(t)?[t.replace(/[\p{L}\p{N}\s]/gu,'')].filter(Boolean):[];
      list=[...own,...list.filter(e=>!own.includes(e))];
      grid.innerHTML=list.length?list.map(e=>`<button class="pdo" data-e="${esc(e)}">${esc(e)}</button>`).join(''):'<p class="note">Nichts gefunden. Versuch ein anderes Wort oder lade ein eigenes Bild hoch.</p>';
      $$('[data-e]',grid).forEach(b=>b.onclick=()=>{cur=b.dataset.e;draw()})};
    q.oninput=fill;fill();
    const close=()=>{L.innerHTML='';onDone()};
    $('.scrim',L).onclick=close;$('#pdok',L).onclick=()=>{if(cur)w.img=cur;else delete w.img;close()};
    const pa=$('#pdauto',L);if(pa)pa.onclick=()=>{cur=undefined;draw()};
    const pn=$('#pdnone',L);if(pn)pn.onclick=()=>{cur='-';draw()};
    $('#pdfile',L).onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
      try{toast('Bild wird gespeichert …');cur=await vkStore(await picFromFile(f));draw()}catch(x){toast(x.message||'Das Bild ging nicht.')}};
  };draw();
}

  const before=w.img;picDialog(w,()=>{if(w.img!==before){touch();redraw()}})})}
const picCell=w=>{const v=picOf(w);return `<button type="button" class="picb ${v&&!w.img?'auto':''}" data-pic="${w.id}" title="Bild wählen" aria-label="Bild für ${esc(w.de)} wählen">${v?picHTML(v):'<span class="plus">+</span>'}</button>`};

/* ---------- Knobelnest: neue Übungen «Bild & Wort» und «Sprechen» ---------- */
ICONS.bild=I('<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>');
ICONS.sprechen=I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
const sprechOK=w=>!w.x;
function knMoreModes(MODES,ws){
  const bilN=ws.filter(bildOK).length,spN=ws.filter(sprechOK).length;
  const bild=['bild','Bild & Wort',bilN>=2?`Zu jedem Bild das richtige Wort finden und umgekehrt. ${bilN} ${bilN===1?'Wort':'Wörter'} mit Bild.`:'Hier gibt es noch zu wenige Wörter mit Bild.',bilN>=2];
  const spr=['sprechen','Sprechen',`Deutsch wird angezeigt, du sagst es auf ${esc(SUB().name)}. ${SR?'Die Kiste hört zu.':'Du nimmst dich auf und vergleichst.'}`,spN];
  const ia=MODES.findIndex(m=>m[0]==='karte');if(bilN>=2||T)MODES.splice(ia+1,0,bild);
  const ib=MODES.findIndex(m=>m[0]==='hoeren');MODES.splice(ib+1,0,spr);
}

/* Bild & Wort: abwechselnd Bild -> Wort wählen und Wort (vorgelesen) -> Bild wählen */
function modeBild(subset){
  const all=SET.words.filter(bildOK);
  const list=subset?shuffle(subset):freshOrder(all.map(w=>w.id),(SET.key||'')+':bild'),total=list.length;
  const body=shell('Bild &amp; Wort');let queue=list.slice(),done=0,tries=0,turn=Math.random()<.5?0:1;const hard=new Set();
  const others=w=>{const inf=IDX.get(w.id),own=inf&&inf.portion&&inf.portion.words?inf.portion.words.filter(x=>valid(x)&&bildOK(x)):[];
    const out=[],sp=new Set([picOf(w)]),sw=new Set([norm(w.f)]);
    for(const src of [own,all,subWords(SUB()).filter(bildOK)]){for(const o of shuffle(src)){if(out.length>=3)break;if(o.id===w.id)continue;
      const p=picOf(o),k=norm(o.f);if(sp.has(p)||sw.has(k))continue;sp.add(p);sw.add(k);out.push(o)}if(out.length>=3)break}
    return out};
  const next=()=>{setProg(`${done} von ${total} richtig`,done/total);
    if(!queue.length)return summary(body,{title:'Alle Bilder erkannt!',lines:[`${total} Wörter, ${tries} Versuche.`,hard.size?`${hard.size} ${hard.size===1?'Wort war':'Wörter waren'} zuerst falsch.`:'Fehlerfrei!'],actions:endActions(hard,modeBild)});
    const id=queue.shift(),w=WD(id),opts=shuffle([w,...others(w)]),kind=turn++%2;
    body.innerHTML=(kind===0
      ?`<div class="bwrap"><div class="bq"><div class="bbig">${picHTML(picOf(w))}</div></div>
        <div class="bside"><p class="hand">Welches Wort passt zum Bild?</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o.f)}</span></button>`).join('')}</div></div></div>`
      :`<div class="bwrap"><div class="bq"><div class="bword">${esc(w.f)}${spkBtn(w.f)}</div><p class="hand">Welches Bild passt?</p></div>
        <div class="bopts">${opts.map((o,i)=>`<button class="bopt" data-i="${i}" aria-label="Bild ${i+1}"><kbd>${i+1}</kbd>${picHTML(picOf(o))}</button>`).join('')}</div></div>`)
      +`<div class="fb" id="fb"></div><p class="keys">Tasten 1 – ${opts.length}</p>`;
    bindSpeak(body);if(kind===1)speak(w.f);
    let fin=false;
    const pick=i=>{if(fin||!opts[i])return;fin=true;const ok=opts[i].id===w.id;tries++;
      $$('[data-i]',body).forEach((b,j)=>{if(opts[j].id===w.id)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
      $('#fb',body).innerHTML=ok?`<span class="ok">✓ Richtig!</span><span class="sub">${esc(w.f)} = ${esc(w.de)}</span>`:`<span class="no">✗ Leider falsch. Richtig ist:</span><span class="sub">${esc(w.f)} = ${esc(w.de)}</span>`;
      speak(w.f);rec(id,ok);if(ok)done++;else{hard.add(id);reins(queue,id)}
      later(next,ok?1300:2400)};
    $$('[data-i]',body).forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    session.key=e=>{const n=parseInt(e.key,10);if(n>=1&&n<=opts.length){e.preventDefault();pick(n-1)}};
  };next();
}

/* Sprechen: Das Kind sieht das deutsche Wort und sagt es in der Fremdsprache.
   Mit Spracherkennung (Chrome, Edge, Safari) prüft die Kiste selbst (der Ton geht dafür an Google bzw. Apple).
   Sonst: aufnehmen, anhören, mit der Vorlese-Stimme vergleichen und selbst entscheiden. */
const SR_LANG={en:'en-GB',fr:'fr-FR',it:'it-IT',es:'es-ES',de:'de-CH'};
const CONTR=[[/\bit's\b/g,'it is'],[/\bthat's\b/g,'that is'],[/\bwhat's\b/g,'what is'],[/\bhe's\b/g,'he is'],[/\bshe's\b/g,'she is'],[/\bthere's\b/g,'there is'],
  [/\bi'm\b/g,'i am'],[/\byou're\b/g,'you are'],[/\bwe're\b/g,'we are'],[/\bthey're\b/g,'they are'],[/\bcan't\b/g,'cannot'],[/\bcan not\b/g,'cannot'],[/\bdon't\b/g,'do not'],
  [/\bdoesn't\b/g,'does not'],[/\bisn't\b/g,'is not'],[/\baren't\b/g,'are not'],[/\bi've\b/g,'i have'],[/\bwe've\b/g,'we have'],[/\blet's\b/g,'let us'],[/\bo'clock\b/g,'oclock'],[/\bo clock\b/g,'oclock']];
function spN(s){s=String(s||'').toLowerCase().normalize('NFC').replace(/[’‘ʼ`´]/g,"'");s=deacc(s);
  CONTR.forEach(([a,b])=>{s=s.replace(a,b)});
  return s.replace(/[-–]/g,' ').replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim()}
const SP_ART=/^(?:(?:the|a|an|to|le|la|les|un|une|des|du|il|lo|el|los|las|der|die|das)\s+|l')/;
function sayTargets(f){
  let t=String(f||'').replace(/[’‘ʼ`´]/g,"'").replace(NOTE_RE,'');
  const alts=t.split(/\s*[\/;]\s*|\s+or\s+|\s+ou\s+|\s*,\s*/).map(x=>x.trim()).filter(Boolean);if(!alts.length)alts.push(t);
  const out=new Set();
  alts.concat([t]).forEach(a=>{
    const forms=[a.replace(/[()]/g,''),a.replace(/\([^)]*\)/g,' ')];
    forms.forEach(x=>{x=x.replace(/…|\.\.\./g,' ');const n=spN(x);if(n){out.add(n);out.add(n.replace(SP_ART,''))}})});
  return [...out].filter(Boolean)}
/* «…» im Wort (z. B. «at … o'clock») = hier darf etwas Beliebiges stehen */
function sayRx(f){return String(f||'').replace(/[’‘ʼ`´]/g,"'").replace(NOTE_RE,'').split(/\s*[\/;]\s*/).filter(a=>/…|\.\.\./.test(a)).map(a=>{
  const parts=a.split(/…|\.\.\./).map(x=>spN(x.replace(/\([^)]*\)/g,' '))).filter(Boolean);
  return parts.length?new RegExp('^(?:.* )?'+parts.map(escRe).join(' (?:.* )?')+'(?: .*)?$'):null}).filter(Boolean)}
function sayMatch(heard,f){const T2=sayTargets(f),RX=sayRx(f);
  return heard.some(h=>{const a=spN(h),b=a.replace(SP_ART,'');if(!a)return false;if(RX.some(r=>r.test(a)))return true;
    return T2.some(t=>{if(t===a||t===b||t.replace(SP_ART,'')===b)return true;
      const tol=t.length>=10?2:t.length>=5?1:0;return tol&&(lev(a,t)<=tol||lev(b,t.replace(SP_ART,''))<=tol)})})}
const MIC_SVG='<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>';
let talkWay=null;/* 'sr' = Spracherkennung, 'rec' = aufnehmen, 'self' = laut sagen und selbst prüfen */
function modeTalk(subset){
  if(!talkWay)talkWay=SR?'sr':canRecord?'rec':'self';
  const list=subset?shuffle(subset):freshOrder(SET.words.filter(sprechOK).map(w=>w.id),(SET.key||'')+':sprechen'),total=list.length;
  const body=shell('Sprechen');let queue=list.slice(),done=0,tries=0;const hard=new Set();
  let rcg=null,mrec=null,stream=null,audio=null;
  const stopAll=()=>{try{if(rcg){rcg.onend=null;rcg.onresult=null;rcg.onerror=null;rcg.abort()}}catch(e){}rcg=null;
    try{if(mrec&&mrec.state!=='inactive')mrec.stop()}catch(e){}mrec=null;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    if(audio){try{audio.pause()}catch(e){}if(audio.src)URL.revokeObjectURL(audio.src);audio=null}};
  session.cleanup=stopAll;
  const lang=SUB().name;
  const next=()=>{stopAll();setProg(`${done} von ${total} richtig gesagt`,done/total);
    if(!queue.length)return summary(body,{title:'Super gesprochen!',lines:[`${total} Wörter, ${tries} Versuche.`,hard.size?`${hard.size} ${hard.size===1?'Wort brauchte':'Wörter brauchten'} mehrere Anläufe.`:'Alles beim ersten Mal!'],actions:endActions(hard,modeTalk)});
    const id=queue.shift(),w=WD(id),p=picOf(w);let fails=0,helped=false,fin=false,counted=false;
    body.innerHTML=`<div class="sheet talkq"><div class="lang"><span>Deutsch</span></div>${p?`<div class="tpic">${picHTML(p)}</div>`:''}<div class="word">${esc(w.de)}</div><div class="sub">Sag es auf ${esc(lang)}.</div></div>
      <div class="listen"><button type="button" class="play mic" id="mic" aria-label="${talkWay==='sr'?'Sprechen':talkWay==='rec'?'Aufnehmen':'Lösung zeigen'}">${talkWay==='self'?'👁':MIC_SVG}</button></div>
      <p class="hand" id="mict">${talkWay==='sr'?'Tippe aufs Mikrofon und sag das Wort.':talkWay==='rec'?'Tippe aufs Mikrofon, sag das Wort und tippe nochmals.':'Sag das Wort laut. Dann tippe auf das Auge.'}</p>
      <div class="fb" id="fb"></div>
      <div class="actions" id="tact"><button class="pill sm" id="hear">👂 Vorsagen</button><button class="pill sm" id="skip">Überspringen</button></div>
      <p class="keys">Leertaste: ${talkWay==='self'?'Lösung zeigen':'sprechen'}</p>`;
    const mic=$('#mic',body),mt=$('#mict',body),fb=$('#fb',body);
    const sol=()=>`<span class="sol">${esc(w.f)}</span>${spkBtn(w.f)}`;
    const finish=ok=>{if(fin)return;fin=true;stopAll();tries++;if(!counted){rec(id,ok);counted=true}
      if(ok)done++;else{hard.add(id);reins(queue,id)}};
    const right=heard=>{finish(!helped&&!fails);mic.classList.remove('on');mic.classList.add('okm');
      fb.innerHTML=`<span class="ok">✓ Richtig!${heard?` Ich habe gehört: «${esc(heard)}»`:''}</span><span class="sub">${sol()}</span>`;bindSpeak(fb);
      later(()=>speak(w.f),350);later(next,2000)};
    const wrong=heard=>{fails++;if(!counted){rec(id,false);counted=true}hard.add(id);mic.classList.remove('on');
      fb.innerHTML=heard?`<span class="no">Ich habe «${esc(heard)}» gehört.</span>`:`<span class="no">Ich habe nichts verstanden.</span>`;
      if(fails>=2)fb.innerHTML+=`<span class="sub">So heisst es: ${sol()}</span>`;
      fb.innerHTML+=`<span class="sub">Versuch es nochmal!</span>`;bindSpeak(fb);mt.textContent='Tippe aufs Mikrofon und versuch es nochmal.'};
    /* Spracherkennung */
    const listen=()=>{if(fin)return;if(rcg){try{rcg.stop()}catch(e){}return}
      let r;try{r=new SR()}catch(e){talkWay=canRecord?'rec':'self';return next0()}
      rcg=r;r.lang=SR_LANG[fl()]||fl();r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
      let heard=[],shown='',errd=false;
      mic.classList.add('on');mt.textContent='Ich höre zu …';fb.innerHTML='';
      const tm=later(()=>{try{r.stop()}catch(e){}},8000);
      r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];shown=res[0].transcript;
          if(res.isFinal)for(let k=0;k<res.length;k++)heard.push(res[k].transcript)}
        mt.textContent='«'+shown.trim()+'»';
        if(heard.length&&sayMatch(heard,w.f)){try{r.stop()}catch(x){}}};
      r.onerror=e=>{errd=true;clearTimeout(tm);
        if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='network'||e.error==='audio-capture'){rcg=null;mic.classList.remove('on');
          talkWay=canRecord&&e.error!=='audio-capture'&&e.error!=='not-allowed'?'rec':'self';
          toast(e.error==='network'?'Die Spracherkennung ist nicht erreichbar. Du kannst dich stattdessen aufnehmen.':'Das Mikrofon ist gesperrt. Sag die Wörter laut und prüfe selbst.');
          later(next0,400)}};
      r.onend=()=>{clearTimeout(tm);if(rcg!==r)return;rcg=null;if(fin)return;
        if(!heard.length&&shown)heard.push(shown);
        if(heard.length&&sayMatch(heard,w.f))right(heard.find(h=>sayMatch([h],w.f))||heard[0]);
        else if(heard.length)wrong(heard[0]);
        else{mic.classList.remove('on');mt.textContent='Tippe aufs Mikrofon und sag das Wort.';if(!errd||!talkWay||talkWay==='sr')fb.innerHTML='<span class="no">Ich habe nichts gehört. Sprich etwas lauter und versuch es nochmal.</span>'}};
      try{r.start()}catch(e){rcg=null;mic.classList.remove('on')}
    };
    /* Aufnehmen und selbst vergleichen */
    const judge=()=>{$('#tact',body).innerHTML=`<div class="judge"><button class="no" id="tno">✗ Nochmal üben</button><button class="yes" id="tyes">✓ Klang gleich</button></div>`;
      $('#tno',body).onclick=()=>{if(fin)return;finish(false);next()};$('#tyes',body).onclick=()=>{if(fin)return;finish(!helped);next()}};
    const recStart=async()=>{if(fin)return;
      if(mrec&&mrec.state==='recording'){mrec.stop();return}
      try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){talkWay='self';toast('Das Mikrofon ist gesperrt. Sag die Wörter laut und prüfe selbst.');return next0()}
      const chunks=[];mrec=new MediaRecorder(stream);mrec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      mrec.onstop=()=>{mic.classList.remove('on');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
        if(audio&&audio.src)URL.revokeObjectURL(audio.src);
        audio=new Audio(URL.createObjectURL(new Blob(chunks,{type:chunks[0]&&chunks[0].type||'audio/webm'})));
        mt.textContent='Hör dich an und vergleiche mit der richtigen Aussprache.';
        fb.innerHTML=`<div class="actions"><button class="pill" id="me">▶ Ich</button><button class="pill" id="model">🔊 So klingt es richtig</button></div><span class="sub">${sol()}</span>`;bindSpeak(fb);
        $('#me',fb).onclick=()=>{try{audio.currentTime=0;audio.play()}catch(e){}};$('#model',fb).onclick=()=>speak(w.f);
        try{audio.play()}catch(e){}later(()=>speak(w.f),1600);judge()};
      mrec.start();mic.classList.add('on');mt.textContent='Ich nehme auf … Tippe nochmals, wenn du fertig bist.';fb.innerHTML='';
      later(()=>{if(mrec&&mrec.state==='recording')mrec.stop()},6000)};
    /* Ohne Mikrofon: Lösung zeigen und selbst entscheiden */
    const selfShow=()=>{if(fin)return;fb.innerHTML=`<span class="sub">${sol()}</span>`;bindSpeak(fb);speak(w.f);mic.disabled=true;mt.textContent='Hast du es richtig gesagt?';judge()};
    const go=()=>talkWay==='sr'?listen():talkWay==='rec'?recStart():selfShow();
    const next0=()=>{queue.unshift(id);next()};
    mic.onclick=go;
    $('#hear',body).onclick=()=>{helped=true;speak(w.f)};
    $('#skip',body).onclick=()=>{if(fin)return;fin=true;stopAll();if(!counted){rec(id,false);counted=true}hard.add(id);reins(queue,id);next()};
    session.key=e=>{if(e.code==='Space'){e.preventDefault();go()}};
  };next();
}

/* ---------- Knobelnest: Was habe ich in dieser Portion schon geschafft? ----------
   Eine Übung gilt als geschafft, wenn das Kind sie bis zur Schluss-Seite durchgemacht hat (summary).
   P.done[Portion] = {Übung: Zeit}. Die Portion ist geschafft, wenn alle Übungen geschafft sind, die es in ihr gibt
   (vkReq: ohne Lückensatz, wenn es keine Sätze gibt, ohne «Bild & Wort» bei weniger als 2 Bildern usw.); dann P.ganz[Portion] = Zeit.
   Die Spiele (Paare, Wortregen), der Karteikasten und die Knacknüsse zählen nicht. */
const ALL_MODES=['karte','bild','drei','merken','salat','schreiben','hoeren','sprechen','luecke'];
const stkModes=()=>{const m=(C.belohnung||{}).modes;return Array.isArray(m)&&m.length?m:ALL_MODES};
function vkReq(ws){ws=ws||[];if(!ws.length)return[];const nW=ws.filter(w=>!w.x).length,cnt=stkModes();
  return [['karte',1],['bild',ws.filter(bildOK).length>=2],['drei',1],['merken',1],['salat',ws.some(salatOK)],['schreiben',1],
    ['hoeren',canSpeak&&nW],['sprechen',ws.some(sprechOK)],['luecke',!noSent()&&ws.some(gapOK)]].filter(x=>x[1]&&cnt.includes(x[0])).map(x=>x[0])}
const vkDoneOf=key=>((P.done||{})[key])||{};
const PERFEKT=/Fehlerfrei|Alles beim ersten Mal|Keine Fehler|Alles ohne Hilfe/;
function vkMark(lines){
  if(!knMode||!knMode.key||knMode.key==='box'||knMode.key==='nuts'||knMode.key==='?')return;
  const key=knMode.key,mode=knMode.mode;
  if(ALL_MODES.includes(mode)&&(lines||[]).some(l=>PERFEKT.test(String(l||'')))){vkCount('perfekt');if(mode==='hoeren')vkCount('ohr')}
  if(mode==='bild')vkCount('bild');
  if(!vkReq(SET.words).includes(mode)){vkBadgeCheck();saveP();return}
  P.done=P.done||{};const d=P.done[key]=P.done[key]||{};const neu=!d[mode];d[mode]=Date.now();
  const req=vkReq(SET.words),n=req.filter(m=>d[m]).length;
  P.ganz=P.ganz||{};
  if(n>=req.length&&!P.ganz[key]){P.ganz[key]=Date.now();saveP();vkCheckAll(true);return}
  else if(neu)later(()=>toast('✓ '+(MODE_NAMES[mode]||mode)+' geschafft · '+n+' von '+req.length+' Übungen'),400);
  vkBadgeCheck();saveP()}
function vkHead(){if(!SET.key||SET.key==='box'||SET.key==='nuts')return'';const req=vkReq(SET.words),d=vkDoneOf(SET.key),n=req.filter(m=>d[m]).length;
  if(!req.length)return'';const ganz=n>=req.length;
  return `<div class="vkfort ${ganz?'ganz':''}"><span class="vkf-t">${ganz?'🎉 Portion geschafft!':n+' von '+req.length+' Übungen geschafft'}</span><span class="vkf-dots">${req.map(m=>`<i class="${d[m]?'on':''}" title="${esc(MODE_NAMES[m]||m)}${d[m]?' ✓':''}">${d[m]?'★':'☆'}</i>`).join('')}</span></div>`}
const vkTileMark=m=>{const d=vkDoneOf(SET.key);return d[m]&&vkReq(SET.words).includes(m)?'<span class="vkok">geschafft</span>':''};
function vkCardMark(n){if(!n.words)return'';const ws=wordsOf(n),req=vkReq(ws),d=vkDoneOf(n.id),k=req.filter(m=>d[m]).length;
  if(!req.length||!k)return'';return k>=req.length?'<span class="vkcm ganz">✓ geschafft</span>':`<span class="vkcm">${k}/${req.length} Übungen</span>`}

/* ---------- Knobelnest: Mein Heft (Sticker, Abzeichen, Urkunden) und Klassen-Ziel ----------
   Sticker: für jede geschaffte Portion einer (P.stk = {Sticker-ID: {n, g, t}}, P.stkFor = {Portion: Sticker-ID}).
     Welche Übungen zählen, stellt die Lehrperson pro Klasse ein (C.belohnung.modes, siehe vkReq).
     Goldrand (selten): jeder 5. Sticker und jeder Sticker, solange die Serie 5 Schultage oder mehr hat.
     Die Bilder lädt die Admin-Lehrperson hoch (shared_store «vokabelkiste-sticker» = {list:[{id,name}]}, Bilder in vk_bilder).
     Ohne eigene Sticker: Tier-Emojis als Ersatz.
   Abzeichen: zählen mit (P.cnt und vorhandene Zahlen), werden ab 5, 10 und 25 grösser (vkTier).
   Urkunden: für jeden Ordner mit Portionen (z. B. «Unit 1»), wenn alle Portionen darin geschafft sind (P.urk = {Ordner: Zeit}).
   Klassen-Ziel: C.ziel = {anzahl, belohnung, ab}; gezählt werden die Tagessterne aller Kinder seit «ab» (kid_vk_extra). */
const EXTRA=KN&&KNI.settings&&KNI.settings.extra||{};
const KIDNAME=KN&&KNI.name?String(KNI.name):'',KIDNAME_=KIDNAME;
const ERSATZ=['🦊','🐼','🐸','🦁','🐙','🦄','🐢','🐝','🦋','🐬','🐧','🦒','🐨','🦔','🐳','🦜','🐞','🦀','🐿️','🦉'];
let STK=((EXTRA.sticker&&Array.isArray(EXTRA.sticker.list))?EXTRA.sticker.list:[]).filter(x=>x&&x.id);
const stkList=()=>STK.length?STK.map(x=>({id:x.id,img:'vk:'+x.id,name:x.name||''})):ERSATZ.map((e,i)=>({id:'e'+i,img:e,name:''}));
const vkCount=(k,n=1)=>{P.cnt=P.cnt||{};P.cnt[k]=(P.cnt[k]||0)+n};

{const r0=rec;rec=function(id,ok){r0(id,ok);if(!ok||!knMode)return;

function vkGold(){const n=Object.values(P.stk||{}).reduce((a,e)=>a+(e.n||0),0)+1;return n%5===0||knStreak()>=5}
function vkGiveSticker(key){
  const list=stkList();P.stk=P.stk||{};P.stkFor=P.stkFor||{};if(P.stkFor[key])return null;
  const neu=list.filter(s=>!P.stk[s.id]),pool=neu.length?neu:list,s=pool[Math.random()*pool.length|0],gold=vkGold();
  const e=P.stk[s.id]=P.stk[s.id]||{n:0,g:0,t:0};e.n++;if(gold)e.g++;e.t=Date.now();P.stkFor[key]=s.id;
  return {s,gold,first:e.n===1}}
/* Alle Portionen prüfen (auch nach einer neuen Einstellung der Lehrperson) und Sticker und Urkunden vergeben */
function vkCheckAll(show){if(!KN||T)return;
  const got=[];P.done=P.done||{};P.ganz=P.ganz||{};
  NODES.forEach((inf,id)=>{const n=inf.node;if(inf.sub!==SUB()||!n.words||!pathOpen(id))return;const ws=wordsOf(n),req=vkReq(ws),d=P.done[id]||{};
    if(req.length&&req.every(m=>d[m])){if(!P.ganz[id])P.ganz[id]=Date.now();const r=vkGiveSticker(id);if(r)got.push(r)}});
  const urk=[];P.urk=P.urk||{};
  vkUnits().forEach(u=>{if(!P.urk[u.id]&&u.total&&u.done>=u.total){P.urk[u.id]=Date.now();urk.push(u)}});
  vkBadgeCheck();
  if(got.length||urk.length){saveP();if(show)vkCelebrate(got,urk);else toast('Neu in deinem Heft: '+(got.length?got.length+' Sticker':'')+(got.length&&urk.length?' und ':'')+(urk.length?urk.length+' Urkunde':''))}}
/* Ordner mit Portionen = «Unit» */
function vkUnits(){const out=[];
  NODES.forEach((inf,id)=>{const n=inf.node;if(inf.sub!==SUB()||n.words||!(n.kids||[]).some(k=>k.words)||!pathOpen(id))return;
    const ps=[];const walk=x=>(x.kids||[]).forEach(k=>{if(!vis(k))return;if(k.words){if(wordsOf(k).length&&vkReq(wordsOf(k)).length)ps.push(k)}else walk(k)});walk(n);
    out.push({id,name:n.name,path:inf.path.map(x=>x.name),total:ps.length,done:ps.filter(k=>(P.ganz||{})[k.id]).length,words:wordsOf(n).length,sub:SUB().name})});
  return out}

/* ---------- Viele Bilder auf einmal (auch als ZIP) ---------- */
async function unzipImgs(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);let e=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('zip');const cnt=dv.getUint16(e+10,true),td=new TextDecoder();let p=dv.getUint32(e+16,true);const out=[];
  for(let n=0;n<cnt;n++){if(dv.getUint32(p,true)!==0x02014b50)break;
    const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(buf.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const base=name.replace(/^.*\//,''),ext=(base.match(/\.(png|jpe?g|webp|gif)$/i)||[])[1];
    if(!ext||/(^|\/)__MACOSX\//.test(name)||base.startsWith('.'))continue;
    const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=buf.subarray(st,st+csz),type='image/'+(ext.toLowerCase()==='jpg'?'jpeg':ext.toLowerCase());
    let blob;if(meth===0)blob=new Blob([raw],{type});
    else if(meth===8){if(!window.DecompressionStream)throw new Error('zip');blob=new Blob([await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()],{type})}
    else continue;out.push({name:base,blob})}
  return out}
async function vkReadFiles(fs){let out=[];
  for(const f of fs){if(/\.zip$/i.test(f.name)||/zip/.test(f.type)){try{out=out.concat(await unzipImgs(f))}catch(e){toast('Die ZIP-Datei lässt sich auf diesem Gerät nicht öffnen. Wähl die Bilder direkt aus.');return null}}
    else if(/^image\//.test(f.type))out.push({name:f.name,blob:f})}
  if(!out.length){toast('Keine Bilder gefunden.');return null}return out}
const fileKey=t=>String(t||'').toLowerCase().normalize('NFC').replace(/[’‘ʼ`´]/g,"'").replace(/[^\p{L}\p{N}]/gu,'');
function bindBulk(node,redraw){const inp=$('#bulkPic');if(!inp)return;inp.onchange=async()=>{const fs=[...inp.files];inp.value='';if(!fs.length)return;
  toast('Bilder werden gelesen …');const files=await vkReadFiles(fs);if(!files)return;let ok=0;const miss=[];
  for(const x of files){const k=fileKey(x.name.replace(/\.[^.]+$/,''));
    const w=node.words.find(w=>fileKey(w.f)===k||fileKey(w.de)===k||String(w.f).split(/\s*[\/;,]\s*/).some(a=>fileKey(a)===k));
    if(!w){miss.push(x.name);continue}
    try{w.img=await vkStore(await picFromFile(x.blob));ok++;toast('Bild '+ok+' gespeichert …')}catch(e){miss.push(x.name+' (Fehler: '+e.message+')')}}
  if(ok){touch();redraw()}

function wsRng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Ein Blatt (oder das Lösungsblatt) */
function wsPages(L){const W=WS,s=SUB(),all=SET.words.filter(valid),r=wsRng(W.seed+(W.ver==='B'?7919:0));
  const pick=list=>wsMix(list,r).slice(0,W.n);

  if(W.tasks.bild){const l=pick(all.filter(bildOK));if(l.length>=2)task('bild',`<div class="wsbg">${l.map(w=>`<div class="wsbc"><span class="wsbb">${picHTML(picOf(w))}</span>${line(wsF(w))}</div>`).join('')}</div>`,l.length)}
  if(W.tasks.verb){const l=pick(all).slice(0,Math.min(W.n,10)),rr=wsMix(l,r);
    task('verb',`<div class="wsv"><div>${l.map((w,i)=>`<div class="wsvr"><span>${esc(wsF(w))}</span><i class="dot"></i></div>`).join('')}</div>
      <div>${rr.map(w=>`<div class="wsvr r"><i class="dot"></i><span>${esc(w.de)}${L?` <em>(${l.indexOf(w)+1})</em>`:''}</span></div>`).join('')}</div></div>
      ${L?`<p class="wsnote">Lösung: Die Zahl zeigt, zu welchem Wort links (von oben gezählt) es gehört.</p>`:''}`,l.length)}
  if(W.tasks.salat){const l=pick(all.filter(w=>salatOf(wsF(w))));if(l.length)task('salat',`<div class="wsrows">${l.map(w=>{const t=salatOf(wsF(w)),ch=[...t.replace(/\s+/g,'')];let m=wsMix(ch,r);for(let i=0;i<5&&m.join('')===ch.join('');i++)m=wsMix(ch,r);
      return `<div class="wsr">${bild(w)}<span class="wsq salat">${esc(m.join(' ').toLowerCase())}</span>${line(t)}</div>`}).join('')}</div>`,l.length)}
  if(W.tasks.luecke&&!noSent()){const l=pick(all.filter(gapOK));if(l.length){const bank=wsMix(l.map(w=>gapOf(w).word),r);
    task('luecke',`${W.typ==='blatt'?`<div class="wsbank">${bank.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}<div class="wsgaps">${l.map((w,i)=>{const g=gapOf(w);
      return `<p>${i+1}. ${esc(cleanS(g.before))}<span class="wsgap">${L?`<em>${esc(g.word)}</em>`:''}</span>${esc(cleanS(g.after))}</p>`}).join('')}</div>`,l.length)}}
  if(W.tasks.suche&&W.typ==='blatt'){const z=wsSuche(all,r);if(z.words.length)task('suche',`<div class="wss"><table class="wsgrid">${z.grid.map((row,y)=>`<tr>${row.map((c,x)=>`<td class="${L&&z.hit[y][x]?'hit':''}">${c}</td>`).join('')}</tr>`).join('')}</table>
      <div class="wssl"><b>Finde:</b>${z.words.map(w=>`<span>${esc(w.de)}${L?` = <em>${esc(w.f2)}</em>`:''}</span>`).join('')}</div></div>`,0)}
  const kopf=`<header class="wsh"><div><span class="wsp-k">${esc(s.name)} · ${W.typ==='test'?'Test':'Arbeitsblatt'}${W.ver==='B'?' · Version B':''}${L?' · Lösung':''}</span><h2 class="wsp-t">${esc(W.titel)}</h2></div>
    <div class="wsf"><span>Name: <i></i></span><span>Datum: <i></i></span>${W.typ==='test'?`<span>Punkte: <i class="k"></i> / ${tot}</span>`:''}</div></header>`;
  return `<div class="wsp ${L?'loes':''}">${kopf}${blocks.join('')||'<p class="note">Wähl links mindestens eine Aufgabe.</p>'}<footer class="wsfoot">Klassenkiste · Vokabelkiste</footer></div>`}
/* Wörter-Suchrätsel: nur Wörter aus Buchstaben (ohne Leerzeichen), höchstens 12 lang; waagrecht und senkrecht */
function wsSuche(all,r){const N=12,g=[...Array(N)].map(()=>Array(N).fill('')),hit=[...Array(N)].map(()=>Array(N).fill(false)),words=[];
  const cand=wsMix(all,r).map(w=>{const t=String(w.f||'').replace(/\([^)]*\)/g,'').split(/[\/,;]/)[0].trim().replace(ARTRE,'').replace(/^to\s+/i,'').trim();
    return {w,t:t.toUpperCase().normalize('NFC')}}).filter(x=>/^[\p{L}]{3,12}$/u.test(x.t));
  for(const c of cand){if(words.length>=10)break;let ok=false;
    for(let tries=0;tries<80&&!ok;tries++){const d=r()<.5?[1,0]:[0,1],L=c.t.length,x0=Math.floor(r()*((d[0]?N-L:N-1)+1)),y0=Math.floor(r()*((d[1]?N-L:N-1)+1));
      if(x0+(d[0]?L-1:0)>=N||y0+(d[1]?L-1:0)>=N)continue;let fit=true;
      for(let i=0;i<L;i++){const ch=g[y0+d[1]*i][x0+d[0]*i];if(ch&&ch!==c.t[i]){fit=false;break}}
      if(!fit)continue;for(let i=0;i<L;i++){g[y0+d[1]*i][x0+d[0]*i]=c.t[i];hit[y0+d[1]*i][x0+d[0]*i]=true}ok=true}
    if(ok)words.push({de:c.w.de,f2:c.t.toLowerCase()})}
  const AB='ABCDEFGHIJKLMNOPRSTUVWY';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!g[y][x])g[y][x]=AB[Math.floor(r()*AB.length)];
  return {grid:g,hit,words}}

/* ---------- Knobelnest: Portionen/Ordner duplizieren und verschieben (Lehrperson) ---------- */
const vkArr=id=>{const i=NODES.get(id);return !i?null:i.parent?(i.parent.kids=i.parent.kids||[]):i.sub.tree};
/* Kopie gleich hinter dem Original, mit neuen IDs (eigener Fortschritt), für die Kinder zuerst gesperrt */
function vkDup(id){const i=NODES.get(id);if(!i)return;const s=i.sub,ex=new Set(s.excl),arr=vkArr(id);
  const cp=JSON.parse(JSON.stringify(i.node));
  const neu=n=>{n.id=uid();delete n.tpl;(n.words||[]).forEach(w=>{const old=w.id;w.id=uid();delete w.imgT;if(ex.has(old))s.excl.push(w.id)});(n.kids||[]).forEach(neu)};
  neu(cp);cp.name=i.node.name+' (Kopie)';cp.open=false;arr.splice(arr.indexOf(i.node)+1,0,cp);
  touch();toast('Kopie erstellt. Sie ist für die Kinder noch gesperrt.');goNode(cp.id)}
/* In einen anderen Ordner (oder ganz nach oben) verschieben; nie in sich selbst. Unten: neuen Ordner erstellen und gleich hinein.
   back = was danach angezeigt wird (aus der Ordner-Ansicht: dort bleiben), sonst die verschobene Portion. */
function vkMove(id,back){const i=NODES.get(id);if(!i)return;const s=i.sub,L=$('#layer');
  const rows=[];const walk=(arr,d)=>arr.forEach(n=>{if(n.words||n.id===id)return;rows.push({n,d});walk(n.kids||[],d+1)});walk(s.tree,0);
  const cur=i.parent?i.parent.id:'';
  L.innerHTML=`<div class="scrim"></div><div class="dlg mvdlg" role="dialog" aria-label="Verschieben"><h2 class="lbl">«${esc(i.node.name)}» verschieben</h2>
    <p class="note" style="margin:0">Wähl den Ordner, in den ${i.node.words?'die Portion':'der Ordner'} kommen soll.</p>
    <div class="mvlist"><button class="mvo ${cur===''?'cur':''}" data-to="">🏠 ${esc(s.name)} (ganz oben)</button>${rows.map(r=>`<button class="mvo ${r.n.id===cur?'cur':''}" data-to="${r.n.id}" style="padding-left:${14+r.d*22}px">📁 ${esc(r.n.name)}</button>`).join('')}</div>
    <div class="mvnew"><b>Oder neuer Ordner:</b><input class="inp" id="mvName" placeholder="Name, z. B. Unit 3" maxlength="60">
      <label>in <select class="inp" id="mvIn"><option value="">${esc(s.name)} (ganz oben)</option>${rows.map(r=>`<option value="${r.n.id}" ${r.n.id===cur?'selected':''}>${'– '.repeat(r.d+1)}${esc(r.n.name)}</option>`).join('')}</select></label>
      <button class="pill go" id="mvNew">Erstellen und verschieben</button></div>
    <div class="dact"><button class="pill" id="mvX">Abbrechen</button></div></div>`;
  const zu=()=>{L.innerHTML=''};$('#mvX',L).onclick=zu;$('.scrim',L).onclick=zu;
  const done=ziel=>{zu();touch();toast('Verschoben nach «'+(ziel?ziel.name:s.name)+'»');if(back)back();else goNode(id)};
  const take=()=>{const from=vkArr(id);from.splice(from.indexOf(i.node),1)};
  $$('[data-to]',L).forEach(b=>b.onclick=()=>{const to=b.dataset.to;if(to===cur){zu();return}
    const ziel=to?NODES.get(to).node:null;take();(ziel?(ziel.kids=ziel.kids||[]):s.tree).push(i.node);done(ziel)});
  $('#mvName',L).onkeydown=e=>{if(e.key==='Enter')$('#mvNew',L).click()};
  $('#mvNew',L).onclick=()=>{const nm=$('#mvName',L).value.trim();if(!nm){toast('Bitte zuerst einen Namen für den neuen Ordner eingeben.');$('#mvName',L).focus();return}
    const pid=$('#mvIn',L).value,par=pid?NODES.get(pid).node:null,arr=par?(par.kids=par.kids||[]):s.tree;
    const f={id:uid(),name:nm,kids:[],open:isOpen(i.node)};arr.push(f);take();f.kids.push(i.node);done(f)}}

/* ---------- Karteikasten (pro Sprache) ---------- */
const INTERVALS=[1,2,7,14,30],INT_LABEL=['jeden Tag','alle 2 Tage','jede Woche','alle 2 Wochen','jeden Monat'],ROUND=20;
const boxWords=s=>{const ex=new Set(s.excl);return subWords(s).filter(w=>!ex.has(w.id))};
/* Ausgeblendete oder aus dem Kasten genommene Wörter behalten ihr Fach. Sie werden nur nicht gezählt und nicht abgefragt.
   Gelöscht wird nur, was es in der Vokabelkiste gar nicht mehr gibt. */
function boxOf(s,kind){P.boxes[s.id]=P.boxes[s.id]||{};const b=P.boxes[s.id][kind]=P.boxes[s.id][kind]||{map:{},last:{},hits:{}};b.hits=b.hits||{};b.t=b.t||{};
  const live=new Set(boxWords(s).map(w=>w.id));live.forEach(id=>{if(!b.map[id])b.map[id]=1});
  Object.keys(b.map).forEach(id=>{if(!IDX.has(id)){delete b.map[id];delete b.hits[id];delete b.t[id]}});
  Object.defineProperty(b,'live',{value:live,enumerable:false,configurable:true});return b}
const counts=b=>{const c=[0,0,0,0,0];b.live.forEach(id=>c[b.map[id]-1]++);return c};
const inFach=(b,f)=>[...b.live].filter(id=>b.map[id]===f);
const isDue=(b,f,c)=>{if(!c)return false;const t=b.last[f];if(!t)return true;return (Date.now()-t)/864e5>=INTERVALS[f-1]-.1};
function goBox(kind){

    <div class="kinds"><button class="pill ${kind==='karte'?'on':''}" data-kind="karte">Mit Kärtchen</button><button class="pill ${kind==='schreiben'?'on':''}" data-kind="schreiben">Mit Schreiben</button></div>

function practiceBox(kind,f){
  /* Zuerst die Kärtchen, die am längsten nicht mehr dran waren */
  const s=SUB(),b=boxOf(s,kind);const list=shuffle(inFach(b,f)).sort((x,y)=>(b.t[x]||0)-(b.t[y]||0)).slice(0,ROUND),total=list.length;
  SET={key:'box',label:'Karteikasten',words:list.map(WD)};knStart('box','kasten-'+kind);
  const body=shell(`Fach ${f} · ${kind==='karte'?'Kärtchen':'Schreiben'}`);let queue=list.slice(),up=0,down=0,doneN=0;
  const next=()=>{const once=queue.filter(id=>(b.hits[id]||0)===1).length;setProg(`${doneN} von ${total} fertig · ${once} schon 1× gewusst · ${up} weiter, ${down} zurück<br><small>Ein Kärtchen rutscht ins nächste Fach, wenn du es 2× gewusst hast.</small>`,(doneN+once/2)/total);
    if(!queue.length){
      /* Das Fach gilt erst als geübt, wenn jedes Kärtchen darin seit dem letzten Mal einmal dran war */
      const rest=inFach(b,f).filter(id=>(b.t[id]||0)<=(b.last[f]||0));if(!rest.length)b.last[f]=Date.now();saveP();
      return summary(body,{title:`Fach ${f} geübt`,lines:[up?`${up} ${up===1?'Kärtchen rutscht':'Kärtchen rutschen'} ${f<5?'in Fach '+(f+1):'zurück in Fach 5'}.`:'Kein Kärtchen ist weitergerutscht.',down?`${down} ${down===1?'Kärtchen muss':'Kärtchen müssen'} zurück in Fach 1.`:'Keines musste zurück.',
        rest.length?`In Fach ${f} warten noch ${rest.length} Kärtchen. Das Fach bleibt fällig, bis alle einmal dran waren.`:''],
        actions:[{label:'Zum Kasten',primary:true,fn:()=>goBox(kind)}]})}
    const id=queue.shift(),h=b.hits[id]||0;
    const after=ok=>{rec(id,ok);
      if(ok){const n=(b.hits[id]||0)+1;if(n>=2){b.map[id]=Math.min(5,f+1);b.hits[id]=0;b.t[id]=Date.now();up++;doneN++;if(f<5)toast('2× gewusst: weiter in Fach '+(f+1))}else{b.hits[id]=n;queue.push(id)}}
      else{b.map[id]=1;b.hits[id]=0;b.t[id]=Date.now();down++;doneN++}saveP();next()};
    const badge=h?'1× richtig':'';
    if(kind==='karte')flashUI(body,WD(id),{sayOnFlip:ansF(),onAnswer:after,badge});else writeUI(body,WD(id),{onAnswer:after,badge})};
  lastBack=()=>goBox(kind);next();
}
function goBoxSelect(){
  stopSession();nav={view:'boxsel'};const s=SUB();
  const groups=[];const walk=(arr,path)=>arr.forEach(n=>{const p=[...path,n.name];if(n.words){const ws=n.words.filter(valid);if(ws.length)groups.push({path:p,ws})}if(n.kids)walk(n.kids,p)});walk(s.tree,[]);
  const ex=()=>new Set(s.excl);
  const counter=()=>{const all=subWords(s).length,inBox=boxWords(s).length;return `${inBox} von ${all} Wörtern sind im Kasten.`};
  stage.innerHTML=crumbs(null,'Kasten-Auswahl')+`<div class="phead"><h1 class="big">Was kommt in den Kasten?</h1><div class="hact"><button class="pill" id="toBox">← Zum Karteikasten</button></div></div>
    <p class="hand">Grün = im Karteikasten. Tipp ein Wort an, wenn es weniger wichtig ist und nicht immer repetiert werden muss. So bleibt der Kasten ein Fundus der wichtigsten Wörter. <span style="color:var(--sky-deep)">Blau = Zusatzwort («nur verstehen»).</span> <b id="cnt">${counter()}</b></p>
    ${groups.map((g,gi)=>`<div class="selgrp"><div class="selhead"><b>${g.path.map(esc).join(' › ')}</b><button class="pill sm" data-all="${gi}">alle</button><button class="pill sm" data-none="${gi}">keine</button></div>
      <div class="wchips">${g.ws.map(w=>`<button class="wchip ${ex().has(w.id)?'off':''} ${w.x?'xw':''}" data-w="${w.id}" aria-pressed="${!ex().has(w.id)}">${esc(w.f)}<small>${esc(w.de)}</small></button>`).join('')}</div></div>`).join('')||'<div class="empty"><p class="hand">Noch keine Wörter eingetragen.</p></div>'}`;
  bindNodes(stage);$('#toBox').onclick=()=>goBox('karte');
  const set=(id,on)=>{s.excl=s.excl.filter(x=>x!==id);if(!on)s.excl.push(id);const b=$(`[data-w="${id}"]`);if(b){b.classList.toggle('off',!on);b.setAttribute('aria-pressed',String(on))}};
  const done=()=>{touch();$('#cnt').textContent=counter()};
  $$('[data-w]').forEach(b=>b.onclick=()=>{set(b.dataset.w,b.classList.contains('off'));done()});
  $$('[data-all]').forEach(b=>b.onclick=()=>{groups[+b.dataset.all].ws.forEach(w=>set(w.id,true));done()});
  $$('[data-none]').forEach(b=>b.onclick=()=>{groups[+b.dataset.none].ws.forEach(w=>set(w.id,false));done()});
  window.scrollTo(0,0);
}

function goNuts(){
  stopSession();nav={view:'nuts'};const s=SUB(),nuts=nutsOf(s);
  SET={key:'nuts',label:'Knacknüsse',words:nuts};
  stage.innerHTML=crumbs(null,'Knacknüsse')+`<div class="phead"><h1 class="big">Knacknüsse</h1></div>
    <p class="hand">Knacknüsse sind Wörter, die schon ${NUT_AT}-mal knifflig waren, egal in welcher Übung. Weisst du eines ${CRACK}-mal hintereinander, ist die Nuss geknackt und verschwindet.</p>
    ${nuts.length?`<div class="recent" style="margin-top:14px">${nuts.map(w=>`<span class="chip"><span class="wd">${esc(Q(w))}</span><b>${P.stats[w.id].st}/${CRACK}</b></span>`).join('')}</div>${practiceHTML()}`
      :`<div class="empty" style="margin-top:18px"><span class="ico nut" style="margin:0 auto 8px;width:52px;height:52px">${ICONS.nut}</span><p class="hand">Zurzeit hast du keine Knacknüsse. Stark!</p></div>`}`;
  bindNodes(stage);bindPractice(stage);window.scrollTo(0,0);
}
