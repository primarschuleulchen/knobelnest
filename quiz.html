<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<style>
/* Live-Quiz der Klassenkiste im Stil der Eulenkiste: Aquarellpapier, Patrick Hand, Gold-Akzente, ✦ ✧ ✦.
   Drei Teile: Liste + Editor (Lehrperson), Beamer-Ansicht (Lehrperson spielt live), Mitspielen (Kinder am Gerät). */
@font-face{font-family:"Patrick Hand";src:url(schriften/patrick-hand.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  color-scheme:light;
  --paper:#fbfaf6; --ink:#1f2421; --soft:#5f6963; --line:#dbe7f1; --line2:#c5d8e8; --card:#fff;
  --gold:#d6ad45; --gold-d:#a97f1c; --sky-soft:#dcf0fd; --sky-deep:#3f78a8; --rose-soft:#fcefed; --leaf-soft:#e9f1e3; --sun-soft:#fbf3dc;
  --ok:#3f8a4f; --no:#c0574c;
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --schatten:0 10px 26px rgba(63,120,168,.18),0 2px 6px rgba(63,120,168,.10);
  --schatten-hoch:0 16px 34px rgba(63,120,168,.26),0 3px 8px rgba(63,120,168,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:20px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
h1,h2,h3{font-weight:400;margin:0;line-height:1.1}
p{margin:0}
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(ellipse 38% 45% at 0% 100%,rgba(160,203,150,.45),transparent 70%),
  radial-gradient(ellipse 35% 40% at 100% 0%,rgba(178,214,204,.5),transparent 70%),
  radial-gradient(ellipse 30% 38% at 100% 100%,rgba(176,200,226,.5),transparent 70%),
  radial-gradient(ellipse 25% 22% at 8% 0%,rgba(240,214,160,.35),transparent 70%),
  radial-gradient(ellipse at 40% 30%,#fffefb,#f6f4ec)}
.muted{color:var(--soft)}
.small{font-size:17px}
.sterne{color:var(--gold);letter-spacing:.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.hidden{display:none!important}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:2px solid var(--ink);border-radius:14px;background:#fff;
  font-size:19px;box-shadow:var(--schatten);transition:transform .15s,box-shadow .15s;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--schatten-hoch)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sky-soft)}
.btn.gold{background:var(--gold);border-color:var(--gold-d)}
.btn.sun{background:var(--sun-soft)}
.btn.sm{min-height:38px;padding:0 12px;font-size:17px;border-radius:11px;box-shadow:0 4px 12px rgba(63,120,168,.14)}
.btn.quiet{border-color:transparent;box-shadow:none;background:transparent}
.btn.quiet:hover{background:rgba(220,240,253,.7)}
.btn.danger{border-color:#b5524a;color:#9a3b33;box-shadow:none}
.btn.danger.armed{background:#b5524a;color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.input{width:100%;min-height:48px;padding:8px 14px;border:2px solid var(--line2);border-radius:12px;background:#fff;font-size:20px}
.input:focus{outline:3px solid var(--sky-soft);border-color:var(--sky-deep)}
select.input{padding-right:8px}
.lbl{font-size:17px;color:var(--soft)}

/* Kopf */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));
  background:rgba(251,250,246,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(214,173,69,.4)}
.marke{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.marke img{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(63,120,168,.2);transform:rotate(-6deg)}
.marke b{font-size:30px;font-weight:400;line-height:1}
.marke b i{font-style:normal;color:var(--gold);font-size:.55em;vertical-align:super;margin-left:2px}
.top .grow{flex:1 1 auto}
.saved{font-size:16px;color:var(--soft);min-width:110px;text-align:right}

.main{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) 60px}
.card{background:#fff;border-radius:20px;box-shadow:var(--schatten);padding:22px}

/* Liste */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:44px}
.hero p{font-size:20px;color:var(--soft);max-width:640px}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.qcard{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:20px;box-shadow:var(--schatten);padding:18px;position:relative;overflow:hidden}
.qcard{border:2px solid transparent}
.qcard.farbig .qc-n{background:rgba(255,255,255,.75)}
.qcard.farbig .qc-fuss{border-top-color:rgba(31,36,33,.14)}
.qcard.farbig .ib:hover{background:rgba(255,255,255,.7)}
.ib{display:inline-flex;align-items:center;gap:6px}
.ib svg{flex:none;opacity:.85}
.qc-o{background:rgba(255,255,255,.8)!important;color:var(--soft)!important;box-shadow:inset 0 0 0 1.5px rgba(31,36,33,.12)}
.ohead h2 .dot.big{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:10px;vertical-align:-2px;box-shadow:inset 0 0 0 1.5px rgba(31,36,33,.18)}
.chip .dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1.5px rgba(31,36,33,.18)}
.farben{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.farben button{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line2);padding:0}
.farben button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.qcard h3{font-size:26px;word-break:break-word}
.qcard .row{margin-top:auto}
.qcard{gap:8px;padding:20px 18px 12px}
.qc-kopf{display:flex;flex-wrap:wrap;gap:6px}
.qc-n,.qc-o{font-size:15px;border-radius:999px;padding:2px 12px}
.qc-n{background:var(--sun-soft);box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold-d)}
.qc-o{background:var(--sky-soft);color:var(--sky-deep)}
.qcard h3{line-height:1.15}
.qcard>p.muted{margin-top:-4px;min-height:1.2em}
.qc-main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto;padding-top:6px}
.qc-main .btn{min-height:50px;padding:0 10px}
.qc-fuss{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border-top:1.5px dashed rgba(214,173,69,.55);padding-top:8px;margin-top:4px}
.ib{min-height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;font-size:17px;color:var(--soft)}
.ib:hover{background:var(--sky-soft);color:var(--ink)}
select.ib{max-width:150px;cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:10px;text-overflow:ellipsis}
.ib.del:hover,.ib.del.armed{background:#fbe1dd;color:#9a3b33}
.vor-tag{background:var(--sun-soft);box-shadow:inset 0 0 0 1.5px var(--gold);border-radius:999px;padding:4px 14px;font-size:18px}
.vor-body{max-width:1100px;width:100%;margin:0 auto}
.pans.vor button.ans{min-height:96px;position:relative}
.pans.vor button.ans[disabled]{cursor:default}
.ans.v-ok{border-color:var(--ok)!important;box-shadow:0 0 0 3px rgba(63,138,79,.35),var(--schatten)}
.ans.v-no{border-color:var(--no)!important}
.ans.v-dim{opacity:.4}
.v-mark{margin-left:auto;font-size:30px}
.slot.v-ok{border-color:var(--ok);background:#f2f8ef}
.slot.v-no{border-color:var(--no);background:#fcefed}
.v-res{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:18px;padding:12px 18px;color:#fff;text-align:center;font-size:22px}
.v-res b{font-weight:400;font-size:34px}
.v-res.ok{background:linear-gradient(160deg,#5aa56a,#3f8a4f)}
.v-res.no{background:linear-gradient(160deg,#d9675c,#b5524a)}
.vor-nav{margin-top:6px}
.grow{flex:1 1 auto}
.qc-fuss{flex-wrap:nowrap}
.ib{white-space:nowrap;flex:none}
select.ib{max-width:130px;flex:0 1 auto;min-width:0}
@media (max-width:620px){.new{min-height:110px}.qc-main .btn{font-size:17px}}
.new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:170px;border:2.5px dashed var(--gold);border-radius:20px;background:rgba(251,243,220,.5);font-size:24px}
.new:hover{background:var(--sun-soft)}
.new span{font-size:46px;line-height:1;color:var(--gold-d)}

/* Editor */
.ed{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:18px;max-width:1500px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 60px}
.side{display:flex;flex-direction:column;gap:10px}
.thumb{display:flex;gap:8px;align-items:stretch;text-align:left;background:#fff;border:2px solid transparent;border-radius:14px;padding:8px;box-shadow:0 4px 12px rgba(63,120,168,.12);width:100%}
.thumb[aria-current="true"]{border-color:var(--sky-deep);background:var(--sky-soft)}
.thumb .nr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun-soft);box-shadow:0 0 0 1.5px var(--gold);display:grid;place-items:center;font-size:16px}
.thumb .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.thumb .tx b{font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .tx small{font-size:14px;color:var(--soft)}
.thumb.warn .nr{background:#fbe1dd;box-shadow:0 0 0 1.5px var(--no)}
.addq{display:flex;flex-direction:column;gap:8px}
.center{display:flex;flex-direction:column;gap:16px;min-width:0}
.fragein{font-size:28px;text-align:center;min-height:64px;border-radius:16px;border:2px solid var(--line2);box-shadow:var(--schatten)}
.bildfeld{align-self:center;width:min(520px,100%);min-height:200px;border:2.5px dashed var(--line2);border-radius:18px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;position:relative;text-align:center}
.bildfeld img{max-width:100%;max-height:300px;border-radius:12px;display:block}
.bildfeld .x{position:absolute;top:8px;right:8px}
.bildfeld .ico{font-size:40px;line-height:1}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;box-shadow:var(--schatten);border:2.5px solid transparent;min-height:84px}
.ans.ok{border-color:var(--ok);background:#f2f8ef}
.ans input{flex:1;min-width:0;border:0;background:transparent;font-size:22px;padding:6px 4px}
.ans input:focus{outline:none}
.sym{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center}
.sym svg{width:30px;height:30px}
.tick{flex:none;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line2);background:#fff;display:grid;place-items:center;font-size:24px;color:transparent}
.tick[aria-pressed="true"]{border-color:var(--ok);background:var(--ok);color:#fff}
.ansdel{flex:none;width:34px;height:34px;border:0;background:transparent;color:var(--soft);font-size:20px;border-radius:50%}
.ansdel:hover{background:var(--rose-soft)}
.hint{font-size:17px;color:var(--soft);text-align:center}
.props{display:flex;flex-direction:column;gap:16px;background:#fff;border-radius:20px;box-shadow:var(--schatten);padding:18px;align-self:start;position:sticky;top:90px}
.props h3{font-size:22px}
.typen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typ{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:17px;line-height:1.1;text-align:center}
.typ span{font-size:26px}
.typ[aria-pressed="true"]{border-color:var(--sky-deep);background:var(--sky-soft)}
.ordner{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--line2);background:#fff;font-size:19px}
.chip small{font-size:15px;color:var(--soft);margin-left:2px}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-selected="true"] small{color:#dfe6ec}
.chip.plus{border-style:dashed;border-color:var(--gold);background:var(--sun-soft)}
.ohead,.khead{margin:0 0 14px}
.ohead h2,.khead h2{font-size:30px}
.osel{display:flex;align-items:center;gap:8px}
.osel select{flex:1;min-height:36px;border:1.5px solid var(--line2);border-radius:10px;background:#fff;padding:0 8px;font-size:17px}
.new small{font-size:17px}
.kclass{margin:0 0 30px}
.mem{display:flex;flex-wrap:wrap;gap:6px}
.mem span{background:var(--sky-soft);border-radius:999px;padding:2px 12px;font-size:17px}
.gruppe{background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 4px 12px rgba(63,120,168,.12)}
.switch{display:inline-flex;align-items:center;gap:12px;min-height:46px;padding:4px 10px 4px 14px;border-radius:14px;border:2px solid var(--line2);background:#fff;font-size:18px;text-align:left}
.switch[aria-checked="true"]{border-color:var(--ok);background:#f2f8ef}
.track{flex:none;width:48px;height:28px;border-radius:999px;background:#9aafc6;position:relative}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"] .track{background:var(--ok)}
.switch[aria-checked="true"] .track::after{left:23px}
.ov{position:fixed;inset:0;z-index:40;background:rgba(31,36,33,.35);display:grid;place-items:center;padding:16px}
.ovbox{width:min(620px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:22px;box-shadow:var(--schatten-hoch);padding:22px;display:flex;flex-direction:column;gap:14px}
.ovbox h2{font-size:28px}
.memwahl{display:flex;flex-wrap:wrap;gap:8px}
.memwahl button{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line2);background:#fff;font-size:19px}
.memwahl button[aria-pressed="true"]{background:var(--sky-soft);border-color:var(--sky-deep)}
.memwahl button[aria-pressed="true"]::before{content:"✓ "}
.new.ki{border-color:var(--sky-deep);background:rgba(220,240,253,.55)}
.new.ki:hover{background:var(--sky-soft)}
.new.ki span{color:var(--sky-deep);font-size:40px}
.ovbox.ki{width:min(720px,100%)}
.kischritt{display:flex;gap:12px;align-items:flex-start}
.kischritt>b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--sun-soft);box-shadow:0 0 0 2px var(--gold);display:grid;place-items:center;font-weight:400;font-size:20px}
.kigrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kigrid label{display:flex;flex-direction:column;gap:4px}
#kiIn{font-family:ui-monospace,Menlo,monospace;font-size:14px;min-height:110px}
.textok{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:18px;box-shadow:var(--schatten);padding:18px}
.reihe-ed .ans .nr{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sun-soft);box-shadow:0 0 0 2px var(--gold);display:grid;place-items:center;font-size:22px}

/* Beamer */
.beamer{min-height:100dvh;display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.bhead .grow{flex:1}
.pinbox{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;box-shadow:var(--schatten);padding:6px 16px;font-size:20px}
.pinbox b{font-weight:400;font-size:32px;letter-spacing:.08em}
.lobby{flex:1;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;padding:10px 28px 28px;align-items:start}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:12px;background:#fff;border-radius:24px;box-shadow:var(--schatten);padding:22px;text-align:center}
.qrcard .qr{width:100%;max-width:330px;aspect-ratio:1;display:grid;place-items:center}
.qrcard .qr svg{width:100%;height:auto;display:block}
.qrcard .nummer{font-size:64px;letter-spacing:.1em;line-height:1}
.qrcard .url{font-size:20px;color:var(--sky-deep);word-break:break-all}
.lobby h1{font-size:52px}
.players{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pl{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;box-shadow:0 4px 12px rgba(63,120,168,.16);font-size:24px;animation:pop .35s ease-out;border:0}
.pl .tier{font-size:30px;line-height:1}
button.pl:hover{background:var(--rose-soft);text-decoration:line-through}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.warten{font-size:28px;color:var(--soft);margin-top:24px}
.eule-wackel{animation:wackel 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wackel{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

.bfrage{flex:1;display:flex;flex-direction:column;gap:16px;padding:6px 28px 24px}
.qtext{background:#fff;border-radius:20px;box-shadow:var(--schatten);padding:16px 24px;text-align:center;font-size:clamp(28px,4.2vw,56px);line-height:1.15;word-break:break-word}
.qmid{flex:1;display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:16px;min-height:120px}
.qmid .bild{display:flex;justify-content:center;align-items:center;min-height:0}
.qmid .bild img{max-width:100%;max-height:38vh;border-radius:16px;box-shadow:var(--schatten)}
.uhr{position:relative;width:130px;height:130px;justify-self:center}
.uhr svg{width:100%;height:100%;transform:rotate(-90deg)}
.uhr b{position:absolute;inset:0;display:grid;place-items:center;font-weight:400;font-size:52px}
.zaehler{justify-self:center;text-align:center;font-size:22px;color:var(--soft)}
.zaehler b{display:block;font-weight:400;font-size:56px;color:var(--ink);line-height:1}
.bans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bans .ans{min-height:92px;font-size:clamp(22px,2.6vw,36px);padding:12px 18px;word-break:break-word}
.bans .ans .sym{width:62px;height:62px}
.bans .ans .sym svg{width:38px;height:38px}
.bans .ans.dim{opacity:.35}
.bans .ans .cnt{margin-left:auto;font-size:30px;flex:none}
.bans .ans .bar{position:absolute;left:0;bottom:0;height:6px;border-radius:0 3px 0 0}
.bans .ans{position:relative;overflow:hidden}
.reihe-show{display:flex;flex-direction:column;gap:10px;max-width:900px;width:100%;margin:0 auto}
.reihe-show .ans{min-height:66px;font-size:clamp(22px,2.6vw,34px);padding:8px 14px}
.textlist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.textlist span{background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 12px rgba(63,120,168,.14);font-size:26px}
.textlist span.ok{background:#e4f2df;box-shadow:0 0 0 2px var(--ok)}
.loesung{text-align:center;font-size:30px}
.loesung b{font-weight:400;color:var(--ok)}

.rang{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 28px 28px}
.rang h1{font-size:54px}
.rl{width:min(820px,100%);display:flex;flex-direction:column;gap:10px}
.rl .z{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;box-shadow:var(--schatten);padding:10px 20px;font-size:30px;animation:pop .4s ease-out both}
.rl .z .pl-nr{width:44px;height:44px;border-radius:50%;background:var(--sun-soft);box-shadow:0 0 0 2px var(--gold);display:grid;place-items:center;font-size:24px;flex:none}
.rl .z .tier{font-size:36px}
.rl .z .pts{margin-left:auto}
.rl .z .fire{font-size:22px;color:#c86a1c}
.podest{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:10px}
.podest .p{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(220px,28vw)}
.podest .p .tier{font-size:64px;line-height:1}
.podest .p .n{font-size:30px;text-align:center;word-break:break-word}
.podest .p .blk{width:100%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;font-size:44px;box-shadow:var(--schatten)}
.podest .p1 .blk{height:220px;background:linear-gradient(#f3d98a,#d6ad45)}
.podest .p2 .blk{height:160px;background:linear-gradient(#eef1f4,#c2cbd4)}
.podest .p3 .blk{height:120px;background:linear-gradient(#f1d2b5,#c99064)}
.podest .p .blk small{font-size:22px}
.konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.konfetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.tabelle{width:min(900px,100%);border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--schatten);font-size:20px}
.tabelle th,.tabelle td{padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)}
.tabelle th{font-weight:400;color:var(--soft);background:#f7fafc}
.tabelle td.r,.tabelle th.r{text-align:right}

/* Mitspielen */
.pw{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px max(14px,env(safe-area-inset-left)) 30px}
.pw .box{width:min(560px,100%);display:flex;flex-direction:column;gap:16px;align-items:stretch}
.pw .kopf{display:flex;align-items:center;gap:10px;justify-content:space-between;width:min(760px,100%);margin-bottom:10px;font-size:20px}
.pw .kopf .ich{display:flex;align-items:center;gap:8px}
.pw .kopf .ich .tier{font-size:30px}
.pw h1{font-size:40px;text-align:center}
.pw .gross{font-size:26px;text-align:center}
.pw .eule{width:110px;height:110px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 3px var(--gold),var(--schatten);align-self:center}
.nummerin{font-size:40px;text-align:center;letter-spacing:.2em;min-height:70px}
.tiere{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tiere button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:32px;padding:0}
.tiere button[aria-pressed="true"]{border-color:var(--gold-d);background:var(--sun-soft);box-shadow:0 0 0 2px var(--gold)}
.go{min-height:64px;font-size:28px}
.err{color:#9a3b33;text-align:center;min-height:1.3em;font-size:20px}
.pfrage{width:min(900px,100%);display:flex;flex-direction:column;gap:14px}
.pfrage .qtext{font-size:clamp(24px,5.4vw,40px);padding:14px 18px}
.pfrage .bild{display:flex;justify-content:center}
.pfrage .bild img{max-width:100%;max-height:30vh;border-radius:14px;box-shadow:var(--schatten)}
.zeitbalken{height:12px;border-radius:999px;background:#e6edf3;overflow:hidden}
.zeitbalken i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e8c76b);border-radius:999px;transition:width .25s linear}
.pans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pans button.ans{border:2.5px solid transparent;text-align:left;font-size:clamp(22px,4.6vw,30px);min-height:110px;padding:12px;word-break:break-word}
.pans button.ans:active{transform:scale(.98)}
.pans button.ans[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold),var(--schatten)}
.pans.rf button.ans{min-height:150px;justify-content:center;font-size:34px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;min-height:58px;border:2.5px dashed var(--line2);border-radius:14px;padding:6px 12px;background:rgba(255,255,255,.7);font-size:24px}
.slot.full{border-style:solid;border-color:var(--gold);background:#fff}
.slot .nr{width:38px;height:38px;border-radius:50%;background:var(--sun-soft);box-shadow:0 0 0 2px var(--gold);display:grid;place-items:center;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pool button{min-height:58px;padding:6px 18px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-size:24px;box-shadow:var(--schatten)}
.ergebnis{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:26px 18px;border-radius:24px;color:#fff;box-shadow:var(--schatten-hoch);width:min(560px,100%)}
.ergebnis.ok{background:linear-gradient(160deg,#5aa56a,#3f8a4f)}
.ergebnis.no{background:linear-gradient(160deg,#d9675c,#b5524a)}
.ergebnis.zu{background:linear-gradient(160deg,#7f8c99,#5f6b77)}
.ergebnis .gross{font-size:52px;line-height:1}
.ergebnis .punkte{font-size:30px;background:rgba(255,255,255,.22);border-radius:999px;padding:4px 20px}
.ergebnis .richtig{background:#fff;color:var(--ink);border-radius:14px;padding:8px 16px;font-size:22px}
.platz{font-size:72px;line-height:1;color:var(--gold-d)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-size:19px;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:1050px){
  .ed{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .thumb{flex:none;width:170px}
  .addq{flex-direction:row;flex:none}
  .props{position:static}
  .lobby{grid-template-columns:1fr}
  .qmid{grid-template-columns:110px 1fr 110px}
  .uhr{width:100px;height:100px}.uhr b{font-size:40px}
}
@media (max-width:620px){
  body{font-size:18px}
  .answers,.bans{grid-template-columns:minmax(0,1fr)}
  .pans{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pans button.ans{min-height:140px;flex-direction:column;align-items:flex-start}
  .hero h1{font-size:36px}
  .fragein{font-size:22px}
  .marke b{font-size:24px}
  .qmid{grid-template-columns:1fr 1fr}.qmid .bild{grid-column:1/-1;order:-1}
}
/* kn-back */#knBack,.kn-back{align-items:center;gap:6px;padding:3px 4px 3px 13px!important;min-height:0!important;height:auto!important;border-radius:999px!important;background:#fff!important;color:#1f2421!important;border:0!important;text-decoration:none;font:700 19px/1 system-ui,-apple-system,sans-serif!important;box-shadow:0 4px 14px rgba(63,120,168,.2)!important;flex:none;cursor:pointer}#knBack:not([hidden]),.kn-back{display:inline-flex}#knBack:hover,.kn-back:hover{box-shadow:0 6px 18px rgba(63,120,168,.3)!important;transform:none}#knBack img,.kn-back img{width:34px;height:34px;display:block;border-radius:50%}
</style>
</head>
<body>
<div class="bg"></div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var B = null;
  try { B = window.parent && window.parent !== window && window.parent.knQuiz; } catch (e) { B = null; }
  var app = document.getElementById('app');
  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var tt; function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 3200); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  if (!B) { app.innerHTML = '<div class="main"><div class="card stack"><h1>Quiz</h1><p>Bitte das Quiz in der Klassenkiste öffnen.</p></div></div>'; return; }

  // Symbole und Farben der Antworten (eigene Formen: Stern, Mond, Wolke, Blatt, Herz, Tropfen)
  var FARBE = ['#d9675c', '#3f78a8', '#c48a1c', '#5d8f4a', '#8a62a8', '#2f8f8a'];
  var HELL = ['#fcefed', '#e6f2fc', '#fbf1dc', '#e9f1e3', '#f1eaf7', '#e2f3f2'];
  var FORM = [
    '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>',
    '<path d="M15.5 3a8.5 8.5 0 1 0 5.5 14.6A7 7 0 0 1 15.5 3z"/>',
    '<path d="M7 18.5h10.2a4.3 4.3 0 0 0 .5-8.55A5.7 5.7 0 0 0 6.9 8.7 4.9 4.9 0 0 0 7 18.5z"/>',
    '<path d="M20 4C10 4 4 9 4 16c0 1.5.4 3 1 4 1-4 4-8 9-10-4 3-6.5 6-7.5 10C17 20 20 13 20 4z"/>',
    '<path d="M12 20.5s-8-4.8-8-10.6A4.5 4.5 0 0 1 12 7.2a4.5 4.5 0 0 1 8 2.7c0 5.8-8 10.6-8 10.6z"/>',
    '<path d="M12 2.8s6.5 7.2 6.5 11.7a6.5 6.5 0 0 1-13 0C5.5 10 12 2.8 12 2.8z"/>'
  ];
  var RF = ['<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>',
    '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>'];
  function sym(i, rf) {
    var c = rf ? (i === 0 ? FARBE[3] : FARBE[0]) : FARBE[i % 6];
    return '<span class="sym" style="background:' + c + '"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">' + (rf ? RF[i] : FORM[i % 6]) + '</svg></span>';
  }
  function ansStyle(i, rf) { var k = rf ? (i === 0 ? 3 : 0) : i % 6; return 'background:' + HELL[k]; }
  var TIERE = [['eule', '🦉'], ['fuchs', '🦊'], ['igel', '🦔'], ['otter', '🦦'], ['hase', '🐰'], ['baer', '🐻'], ['frosch', '🐸'], ['katze', '🐱'], ['maus', '🐭'], ['panda', '🐼'], ['loewe', '🦁'], ['pinguin', '🐧']];
  function tier(k) { for (var i = 0; i < TIERE.length; i++) if (TIERE[i][0] === k) return TIERE[i][1]; return '🦉'; }
  var TYPEN = { quiz: ['🎯', 'Quiz'], rf: ['⚖️', 'Richtig oder falsch'], text: ['✏️', 'Antwort eingeben'], reihe: ['🔢', 'Reihenfolge'] };
  var ZEITEN = [5, 10, 20, 30, 45, 60, 90, 120];

  // Klicks
  var ACT = {};
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var f = ACT[el.dataset.a]; if (!f) return;
    Promise.resolve().then(function () { return f(el, e); }).catch(function (x) { console.error(x); toast((x && x.message) || 'Das hat nicht geklappt.'); });
  });
  document.addEventListener('input', function (e) { var el = e.target.closest('[data-in]'); if (el && ACT[el.dataset.in]) ACT[el.dataset.in](el, e); });
  document.addEventListener('change', function (e) { var el = e.target.closest('[data-ch]'); if (el && ACT[el.dataset.ch]) ACT[el.dataset.ch](el, e); });
  var armedKey = null, armedT;
  function armed(k, el) { if (armedKey === k) { armedKey = null; return true; } armedKey = k; clearTimeout(armedT); if (el) { el.classList.add('armed'); el.dataset.old = el.textContent; el.textContent = 'Wirklich?'; }
    armedT = setTimeout(function () { armedKey = null; if (el && el.isConnected) { el.classList.remove('armed'); el.textContent = el.dataset.old; } }, 3500); return false; }
  var timers = [];
  function every(ms, fn) { timers.push(setInterval(fn, ms)); }
  function stop() { timers.forEach(clearInterval); timers = []; }

  function kopf(rechts, zurueck) {
    return '<header class="top">' + (zurueck ? '<button class="btn sm quiet" data-a="' + zurueck + '">← Zurück</button>' : '<button class="kn-back" data-a="back" aria-label="Zurück zur Klassenkiste" title="Zurück zur Klassenkiste"><span aria-hidden="true">←</span><img src="bilder/eule.webp" alt="" width="34" height="34"></button>') +

  }
  ACT.back = function () { B.back(); };

  // =================================================================
  // Lehrperson: Liste der Quiz (teacher_store «quiz» = { list, ordner }, «quiz-<id>» = ein Quiz).
  // Quiz der Kinder (Version 24) liegen in der Datenbank und erscheinen im Ordner «Von den Kindern».
  // =================================================================
  var L = { list: [], ordner: [], view: 'alle', kq: [], kc: [], kl: null, cur: null, sel: 0, saveT: null, dirty: false, saving: false, base: null };
  function neueFrage(typ) {
    var q = { id: uid(), typ: typ || 'quiz', frage: '', bild: '', zeit: 20, punkte: 1, mehrfach: false };
    if (q.typ === 'quiz') { q.antworten = ['', '', '', '']; q.richtig = []; }
    if (q.typ === 'rf') { q.antworten = ['Richtig', 'Falsch']; q.richtig = [0]; }
    if (q.typ === 'text') { q.antworten = null; q.richtig = ['']; q.zeit = 30; }
    if (q.typ === 'reihe') { q.antworten = ['', '', '', '']; q.richtig = null; q.zeit = 30; }
    return q;
  }
  function anzahl(n) { return n === 1 ? '1 Frage' : (n || 0) + ' Fragen'; }
  function datum(t) { return t ? new Date(t).toLocaleDateString('de-CH') : ''; }
  var LADEN = '<div class="main"><p class="muted">Wird geladen …</p></div>';
  async function listStart(view) {
    stop(); L.cur = null; if (view) L.view = view;
    app.innerHTML = kopf() + LADEN;
    try { var d = await B.list(); L.list = d.list || []; L.ordner = d.ordner || []; } catch (e) { L.list = []; L.ordner = []; toast('Die Liste konnte nicht geladen werden.'); }
    if (L.view !== 'alle' && L.view !== 'kinder' && !L.ordner.some(function (o) { return o.id === L.view; })) L.view = 'alle';
    if (L.view === 'kinder') await kidLoad();
    listRender();
  }
  async function kidLoad() {
    try { var r = await Promise.all([B.kidClasses(), B.kidList()]); L.kc = r[0] || []; L.kq = r[1] || []; }
    catch (e) { L.kc = []; L.kq = []; toast('Die Quiz der Kinder konnten nicht geladen werden.'); }
  }
  // Ordnerfarben (sanft, im Stil der Eulenkiste). Karte = helle Fläche, Rand = mittlere Stufe.
  var OFARBEN = ['#e9c46a', '#e8968c', '#9cc48a', '#8fbbe0', '#b9a3d9', '#7fc8bf', '#f0a868', '#c9b48f'];
  function mischen(hex, w) { var n = parseInt(hex.slice(1), 16), f = function (v) { return Math.round(v + (255 - v) * w); };
    return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')'; }
  function ico(d) { return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  var IC = { edit: ico('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'), copy: ico('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
    trash: ico('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>'), group: ico('<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.6 0 4.4 1.6 5 4.5"/>') };
  function oFarbe(o) { return o && /^#[0-9a-f]{6}$/i.test(o.farbe || '') ? o.farbe : null; }
  function karteStil(o) { var f = oFarbe(o); return f ? ' farbig" style="background:' + mischen(f, .78) + ';border-color:' + mischen(f, .35) : ''; }
  function kidName(cid, id) { var c = L.kc.filter(function (x) { return x.id === cid; })[0], k = c && c.kids.filter(function (x) { return x.id === id; })[0]; return k ? k.name : ''; }
  function listRender() {
    var chips = [['alle', 'Alle Quiz', L.list.length]].concat(L.ordner.map(function (o) {

    var hero = L.view === 'alle' ? '<div class="hero"><img class="eule-wackel" src="bilder/kacheln/quiz-buzzer.webp" alt="" width="110" height="110" style="border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 3px var(--gold),var(--schatten)">' +

    app.innerHTML = kopf() + '<div class="main">' + hero + bar + (L.view === 'kinder' ? kidHTML() : ownHTML()) + '</div>';

  function ownHTML() {

    var l = L.list.filter(function (x) { return !o || x.ordner === o.id; }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
    var kopfzeile = o ? '<div class="row ohead"><h2><span class="dot big" style="background:' + (oFarbe(o) || '#d9dee3') + '"></span>' + h(o.name) + '</h2><span class="grow"></span><button class="btn sm" data-a="oRen">✎ Umbenennen</button><button class="btn sm danger" data-a="oDel">Ordner löschen</button></div>' +
      '<div class="farben" style="margin:-4px 0 16px"><span class="muted small">Farbe des Ordners:</span>' + OFARBEN.map(function (f) {
        return '<button data-a="oFarbe" data-f="' + f + '" aria-pressed="' + (oFarbe(o) === f) + '" aria-label="Farbe" style="background:' + mischen(f, .35) + '"></button>'; }).join('') +
      '<button data-a="oFarbe" data-f="" aria-pressed="' + !oFarbe(o) + '" aria-label="Keine Farbe" style="background:#fff;font-size:16px;color:var(--soft)">–</button></div>' : '';
    return kopfzeile + '<div class="qlist"><button class="new" data-a="neu"><span>+</span>Neues Quiz' + (o ? '<small class="muted">in «' + h(o.name) + '»</small>' : '') + '</button>' +
      '<button class="new ki" data-a="kiOpen"><span>✨</span>Mit KI erstellen<small class="muted">aus einem PDF oder Arbeitsblatt</small></button>' + l.map(function (x) {
      var on = L.ordner.filter(function (y) { return y.id === x.ordner; })[0];
      return '<div class="qcard' + karteStil(on) + '"><div class="qc-kopf"><span class="qc-n">' + anzahl(x.n) + '</span>' + (!o && on ? '<span class="qc-o">' + h(on.name) + '</span>' : '') + '</div>' +
        '<h3>' + h(x.titel || 'Ohne Titel') + '</h3><p class="muted small">' + (x.at ? 'geändert ' + datum(x.at) : '') + '</p>' +
        '<div class="qc-main"><button class="btn gold" data-a="live" data-id="' + h(x.id) + '"' + (x.n ? '' : ' disabled') + '>▶ Live spielen</button><button class="btn" data-a="vor" data-id="' + h(x.id) + '"' + (x.n ? '' : ' disabled') + '>👁 Vorschau</button></div>' +
        '<div class="qc-fuss"><button class="ib" data-a="edit" data-id="' + h(x.id) + '">' + IC.edit + 'Bearbeiten</button><button class="ib" data-a="dup" data-id="' + h(x.id) + '" title="Kopie erstellen">' + IC.copy + 'Kopie</button>' +
        (L.ordner.length ? '<select class="ib" data-ch="move" data-id="' + h(x.id) + '" title="In einen Ordner verschieben" aria-label="Ordner"><option value="">Ohne Ordner</option>' +
          L.ordner.map(function (y) { return '<option value="' + h(y.id) + '"' + (x.ordner === y.id ? ' selected' : '') + '>' + h(y.name) + '</option>'; }).join('') + '</select>' : '') +
        '<span class="grow"></span><button class="ib del" data-a="del" data-id="' + h(x.id) + '" title="Löschen" aria-label="Löschen">' + IC.trash + '</button></div></div>';
    }).join('') + '</div>';
  }
  function kidHTML() {
    if (!L.kc.length) return '<div class="card"><p>Sie haben noch keine Klasse.</p></div>';

  // ---------- Gemeinsam bearbeiten: Änderungen von zwei Geräten zusammenführen ----------
  // base = letzter gemeinsamer Stand, local = dieses Gerät, server = neuer Stand der anderen.
  // Fragen, die hier geändert wurden, gewinnen; alles andere kommt von den anderen.
  function merge(base, local, server) {
    var bm = {}; ((base && base.fragen) || []).forEach(function (q) { bm[q.id] = JSON.stringify(q); });
    var lids = local.fragen.map(function (q) { return q.id; }), dirty = {}, gone = {};
    local.fragen.forEach(function (q) { if (bm[q.id] !== JSON.stringify(q)) dirty[q.id] = q; });
    Object.keys(bm).forEach(function (id) { if (lids.indexOf(id) < 0) gone[id] = 1; });
    var out = (server.fragen || []).filter(function (q) { return !gone[q.id]; }).map(function (q) { return dirty[q.id] ? clone(dirty[q.id]) : q; });
    local.fragen.forEach(function (q, i) {
      if (!dirty[q.id] || out.some(function (x) { return x.id === q.id; })) return;
      var pos = 0;
      for (var j = i - 1; j >= 0; j--) { var k = out.map(function (x) { return x.id; }).indexOf(local.fragen[j].id); if (k >= 0) { pos = k + 1; break; } }
      out.splice(pos, 0, clone(q));

      html = bhead() + '<div class="rang"><span class="sterne">✦ ✧ ✦</span><h1>Geschafft!</h1><div class="podest">' + p3.map(function (p, i) {
        if (!p) return '<div class="p"></div>'; var pl = [2, 1, 3][i];
        return '<div class="p p' + pl + '"><span class="tier">' + tier(p.avatar) + '</span><span class="n">' + h(p.name) + '</span><div class="blk">' + pl + '<small>' + p.score + ' Punkte</small></div></div>';
      }).join('') + '</div>' +
        '<table class="tabelle" style="margin-top:22px"><thead><tr><th>Platz</th><th>Name</th><th class="r">Richtig</th><th class="r">Punkte</th></tr></thead><tbody>' + all.map(function (p, i) {
          var ok = Object.keys(p.answers || {}).filter(function (k) { return p.answers[k].ok; }).length;
          return '<tr><td>' + (i + 1) + '</td><td>' + tier(p.avatar) + ' ' + h(p.name) + '</td><td class="r">' + ok + ' von ' + H.qs.length + '</td><td class="r">' + p.score + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn gold" data-a="hNochmal">Nochmals spielen</button><button class="btn" data-a="hSchluss">Fertig</button></div></div>';
      setTimeout(konfetti, 200);
    }
    app.innerHTML = '<div class="beamer">' + html + '</div>';
    hostTick();
  }
  function hostAnswers(q, s, zeigen) {
    var given = s.players.map(function (p) { return p.answers && p.answers[s.q]; }).filter(Boolean);
    if (q.typ === 'text') {
      if (!zeigen) return '<p class="loesung muted">Die Kinder tippen ihre Antwort ein.</p>';
      var cnt = {}; given.forEach(function (g) { var t = String(g.a || '').trim(); if (!t) return; var k = t.toLowerCase(); cnt[k] = cnt[k] || { t: t, n: 0, ok: g.ok }; cnt[k].n++; });
      var ks = Object.keys(cnt).sort(function (a, b) { return cnt[b].n - cnt[a].n; });
      return '<p class="loesung">Richtig: <b>' + h(q.richtig.join(' / ')) + '</b></p><div class="textlist">' + ks.map(function (k) { return '<span class="' + (cnt[k].ok ? 'ok' : '') + '">' + h(cnt[k].t) + (cnt[k].n > 1 ? ' ×' + cnt[k].n : '') + '</span>'; }).join('') + '</div>';
    }
    if (q.typ === 'reihe') {
      var order = zeigen ? q.antworten.map(function (a, i) { return i; }) : q.mix;
      return '<div class="reihe-show">' + order.map(function (i, k) {
        return '<div class="ans" style="background:#fff"><span class="sym" style="background:' + (zeigen ? 'var(--ok)' : 'var(--gold)') + ';color:#fff;font-size:28px">' + (zeigen ? k + 1 : '?') + '</span>' + h(q.antworten[i]) + '</div>'; }).join('') + '</div>';
    }
    var rf = q.typ === 'rf';
    return '<div class="bans">' + q.antworten.map(function (a, i) {
      var n = given.filter(function (g) { return Array.isArray(g.a) && g.a.indexOf(i) >= 0; }).length, ok = q.richtig.indexOf(i) >= 0;
      return '<div class="ans' + (zeigen && !ok ? ' dim' : '') + '" style="' + ansStyle(i, rf) + (zeigen && ok ? ';border-color:var(--ok)' : '') + '">' + sym(i, rf) + '<span>' + h(a) + '</span>' +
        (zeigen ? '<span class="cnt">' + (ok ? '✓ ' : '') + n + '</span><span class="bar" style="width:' + (given.length ? Math.round(n / given.length * 100) : 0) + '%;background:' + (rf ? (i ? FARBE[0] : FARBE[3]) : FARBE[i % 6]) + '"></span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function loesungsSatz(q, s) {
    var n = s.players.length, ok = s.players.filter(function (p) { return p.answers && p.answers[s.q] && p.answers[s.q].ok; }).length;
    return ok + ' von ' + n + ' richtig' + (n && ok === n ? ' – alle! 🎉' : '');
  }
  function hostUpdate() {
    var s = H.st;
    if (s.phase === 'lobby') {
      var ids = s.players.map(function (p) { return p.id; }).join();
      if (ids !== H.lobbyIds) { H.lobbyIds = ids; hostRender(); }
    }
    if (s.phase === 'frage') { var a = document.getElementById('antw'); if (a) a.textContent = answered(s, s.q); }
  }
  ACT.hLos = function () { return step('frage', 0); };
  ACT.hSkip = function () { return step('aufloesung', H.st.q); };
  ACT.hWeiter = function () { return step(H.st.q + 1 < H.qs.length ? 'rangliste' : 'ende', H.st.q); };
  ACT.hNext = function () { return H.st.q + 1 < H.qs.length ? step('frage', H.st.q + 1) : step('ende', H.st.q); };
  ACT.kick = async function (el) { await B.kick(H.live.id, el.dataset.id); H.lobbyIds = ''; await hostPoll(); };
  ACT.voll = function () { var d = document.documentElement; try { if (document.fullscreenElement) document.exitFullscreen(); else (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (e) {} };
  ACT.hEnde = async function (el) {
    if (H.st && H.st.phase !== 'ende' && H.st.phase !== 'lobby' && !armed('hende', el)) return;
    await hostClose();
  };
  async function hostClose() { stop(); var id = H.live && H.live.id; H.live = null; if (id) await B.close(id); if (L.cur) edStart(L.cur); else listStart(); }
  ACT.hSchluss = function () { return hostClose(); };
  ACT.hNochmal = async function () { var Q = H.quiz; stop(); if (H.live) await B.close(H.live.id); H.live = null; hostStart(Q); };
  function konfetti() {
    if (document.querySelector('.konfetti')) return;
    var k = document.createElement('div'); k.className = 'konfetti';
    var c = ['#d6ad45', '#d9675c', '#3f78a8', '#5d8f4a', '#8a62a8', '#f3d98a'];
    for (var i = 0; i < 90; i++) { var e = document.createElement('i'); e.style.left = Math.random() * 100 + 'vw'; e.style.background = c[i % c.length];
      e.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; e.style.animationDelay = (Math.random() * 1.2) + 's'; k.appendChild(e); }
    document.body.appendChild(k); setTimeout(function () { k.remove(); }, 6500);
  }

  // =================================================================
  // Mitspielen (Kinder): Nummer + Name + Tier, dann live mitspielen
  // =================================================================
  var P = { tok: null, pin: '', st: null, key: '', deadline: 0, pick: [], text: '', order: [], busy: false, err: '', name: '', av: 'eule', sent: false };
  function pStore() { try { return JSON.parse(sessionStorage.getItem('kn_quiz') || 'null'); } catch (e) { return null; } }
  function pSave(v) { try { if (v) sessionStorage.setItem('kn_quiz', JSON.stringify(v)); else sessionStorage.removeItem('kn_quiz'); } catch (e) {} }
  async function playStart() {
    P.pin = String(B.pin || '').replace(/\D/g, '');
    P.name = B.name || ''; P.av = TIERE[Math.floor(Math.random() * TIERE.length)][0];
    var s = pStore();
    if (s && s.tok && (!P.pin || s.pin === P.pin)) { P.tok = s.tok; P.pin = s.pin; return pGo(); }
    joinRender();
  }
  function joinRender() {
    app.innerHTML = '<div class="pw"><div class="box"><img class="eule eule-wackel" src="bilder/kacheln/quiz-buzzer.webp" alt=""><h1>Mitspielen <span class="sterne" style="font-size:24px">✦</span></h1>' +
      '<label class="stack" style="gap:4px"><span class="lbl">Nummer</span><input class="input nummerin" id="pin" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123456" value="' + h(P.pin) + '"></label>' +
      '<label class="stack" style="gap:4px"><span class="lbl">Dein Name</span><input class="input" id="pname" maxlength="20" autocomplete="off" placeholder="z. B. Lena" value="' + h(P.name) + '" style="font-size:28px;min-height:60px"></label>' +
      '<div class="stack" style="gap:4px"><span class="lbl">Wähle dein Tier</span><div class="tiere">' + TIERE.map(function (t) { return '<button data-a="pTier" data-t="' + t[0] + '" aria-pressed="' + (P.av === t[0]) + '" aria-label="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div></div>' +
      '<button class="btn gold go" data-a="pJoin"' + (P.busy ? ' disabled' : '') + '>Mitmachen ✦</button><p class="err">' + h(P.err) + '</p>' +
      (B.home ? '<button class="kn-back" style="align-self:center" data-a="pHome" aria-label="Zurück zur Klassenkiste" title="Zurück zur Klassenkiste"><span aria-hidden="true">←</span><img src="bilder/eule.webp" alt="" width="34" height="34"></button>' : '') + '</div></div>';
    var f = document.getElementById(P.pin ? 'pname' : 'pin'); if (f && !P.name) f.focus();
  }
  ACT.pHome = function () { stop(); B.home(); };
  ACT.pTier = function (el) { P.av = el.dataset.t; Array.prototype.forEach.call(document.querySelectorAll('.tiere button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.t === P.av)); }); };
  ACT.pJoin = async function () {
    P.pin = document.getElementById('pin').value.replace(/\D/g, ''); P.name = document.getElementById('pname').value.trim();
    if (P.pin.length !== 6) { P.err = 'Die Nummer hat 6 Ziffern. Sie steht an der Wandtafel.'; return joinRender(); }
    if (!P.name) { P.err = 'Bitte deinen Namen eintippen.'; return joinRender(); }
    P.busy = true; P.err = ''; joinRender();
    try {
      var r = await B.join(P.pin, P.name, P.av);
      if (!r.ok) {
        P.err = { nummer: 'Diese Nummer gibt es nicht. Schau nochmals an die Wandtafel.', vorbei: 'Dieses Quiz ist schon fertig.', name: 'Bitte einen kürzeren Namen ohne Sonderzeichen.',
          vergeben: 'Diesen Namen hat schon jemand. Hänge z. B. einen Buchstaben an.', voll: 'Das Quiz ist voll.' }[r.error] || 'Das hat nicht geklappt.';
        return;
      }
      P.tok = r.token; pSave({ tok: r.token, pin: P.pin }); pGo();
    } catch (e) { P.err = 'Keine Verbindung. Bitte nochmals versuchen.'; }
    finally { P.busy = false; if (!P.tok) joinRender(); }
  };
  function pGo() { stop(); P.key = ''; pPoll(); every(1000, pPoll); every(200, pTick); }
  async function pPoll() {
    if (!P.tok) return;
    var s; try { s = await B.state(P.tok); } catch (e) { return; }
    if (!s || s.gone) { stop(); pSave(null); P.tok = null; P.err = 'Du bist nicht mehr im Quiz. Du kannst neu mitmachen.'; return joinRender(); }
    var neu = s.phase + '|' + s.q;
    if (s.phase === 'frage' && s.left_ms != null) { var d = performance.now() + s.left_ms; if (!P.deadline || Math.abs(d - P.deadline) > 600 || neu !== P.key) P.deadline = d; }
    var k = neu + '|' + (s.mine ? 1 : 0) + (s.phase === 'lobby' ? '|' + s.players : '');
    if (neu !== P.qkey) { P.qkey = neu; P.pick = []; P.text = ''; P.order = []; P.sent = false; }
    P.st = s;
    if (k !== P.key) { P.key = k; pRender(); }
  }
  function pTick() {
    var s = P.st; if (!s || s.phase !== 'frage' || !s.question) return;
    var left = Math.max(0, P.deadline - performance.now()), b = document.getElementById('zb');
    if (b) b.style.width = (left / (s.question.zeit * 1000) * 100) + '%';
  }
  function pKopf(s) { return '<div class="kopf"><span class="ich"><span class="tier">' + tier(s.avatar) + '</span>' + h(s.name) + '</span><span>' + s.score + ' Punkte</span></div>'; }
  function pRender() {
    var s = P.st, q = s.question, html = pKopf(s);
    if (s.phase === 'lobby') {
      html += '<div class="box" style="align-items:center;text-align:center"><img class="eule eule-wackel" src="bilder/kacheln/quiz-buzzer.webp" alt=""><h1>Du bist dabei!</h1><p class="gross">Schau zur Wandtafel. Gleich geht es los.</p>' +
        '<p class="muted">' + (s.players === 1 ? 'Bis jetzt bist nur du da.' : s.players + ' Kinder sind dabei') + '</p></div>';
    } else if (s.phase === 'frage' && q) {
      if (s.mine || P.sent) html += '<div class="box" style="align-items:center;text-align:center"><img class="eule eule-wackel" src="bilder/kacheln/quiz-buzzer.webp" alt=""><h1>Antwort abgegeben ✦</h1><p class="gross">Warte, bis alle fertig sind …</p></div>';
      else html += pFrage(q, s);
    } else if (s.phase === 'aufloesung' && q) {
      var m = s.mine;
      var richtig = q.typ === 'text' ? '' : q.typ === 'reihe' ? q.antworten.map(function (a, i) { return (i + 1) + '. ' + h(a); }).join('<br>') : (s.richtig || []).map(function (i) { return h(q.antworten[i]); }).join(' · ');
      html += '<div class="ergebnis ' + (!m ? 'zu' : m.ok ? 'ok' : 'no') + '"><span class="gross">' + (!m ? '⏰ Zu spät' : m.ok ? '✓ Richtig!' : '✗ Leider falsch') + '</span>' +
        (m && m.ok ? '<span class="punkte">+ ' + m.p + ' Punkte</span>' : '') + (m && m.ok && s.streak >= 2 ? '<span>🔥 ' + s.streak + ' richtig hintereinander</span>' : '') +
        (!(m && m.ok) && q.typ !== 'text' ? '<span>Richtig wäre:</span><span class="richtig">' + richtig + '</span>' : '') +
        (!(m && m.ok) && q.typ === 'text' ? '<span>Schau zur Wandtafel für die Lösung.</span>' : '') + '</div>' +
        '<p class="gross" style="margin-top:16px">Du bist auf Platz ' + s.rank + '</p>';
    } else if (s.phase === 'rangliste') {
      html += '<div class="box" style="align-items:center;text-align:center"><span class="sterne">✦ ✧ ✦</span><p class="gross">Du bist auf</p><span class="platz">Platz ' + s.rank + '</span><p class="gross">' + s.score + ' Punkte</p><p class="muted">Schau zur Wandtafel.</p></div>';
    } else if (s.phase === 'ende') {
      html += '<div class="box" style="align-items:center;text-align:center"><span class="sterne">✦ ✧ ✦</span><h1>Geschafft!</h1><span class="platz">Platz ' + s.rank + '</span><p class="gross">von ' + s.players + ' · ' + s.score + ' Punkte</p>' +
        (s.rank <= 3 ? '<p class="gross">' + ['🥇', '🥈', '🥉'][s.rank - 1] + ' Super gemacht!</p>' : '<p class="gross">Gut gespielt!</p>') +
        '<button class="btn" data-a="pNeu">Anderes Quiz</button></div>';
      if (s.rank <= 3) setTimeout(konfetti, 200);
    } else html += '<div class="box"><p class="gross">Schau zur Wandtafel.</p></div>';
    app.innerHTML = '<div class="pw">' + html + '</div>';
    pTick();
    var ti = document.getElementById('ptext'); if (ti) ti.focus();
  }
  function pFrage(q, s) {
    var out = '<div class="pfrage"><div class="zeitbalken"><i id="zb" style="width:100%"></i></div><p class="muted" style="text-align:center">Frage ' + (s.q + 1) + ' von ' + s.n + '</p>' +
      '<div class="qtext">' + h(q.frage) + '</div>' + (q.bild ? '<div class="bild"><img src="' + h(q.bild) + '" alt=""></div>' : '');
    if (q.typ === 'quiz' || q.typ === 'rf') {
      var rf = q.typ === 'rf';
      if (q.mehrfach) out += '<p class="muted" style="text-align:center">Wähle alle richtigen Antworten und tippe dann auf «Abschicken».</p>';
      out += '<div class="pans' + (rf ? ' rf' : '') + '">' + q.antworten.map(function (a, i) {
        return '<button class="ans" style="' + ansStyle(i, rf) + '" data-a="pAns" data-i="' + i + '" aria-pressed="' + (P.pick.indexOf(i) >= 0) + '">' + sym(i, rf) + '<span>' + h(a) + '</span></button>'; }).join('') + '</div>';
      if (q.mehrfach) out += '<button class="btn gold go" data-a="pSend"' + (P.pick.length ? '' : ' disabled') + '>Abschicken ✦</button>';
    } else if (q.typ === 'text') {
      out += '<form id="pform"><input class="input" id="ptext" data-in="pText" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Deine Antwort" value="' + h(P.text) + '" style="font-size:30px;min-height:70px;text-align:center"></form>' +
        '<button class="btn gold go" data-a="pSend">Abschicken ✦</button>';
    } else if (q.typ === 'reihe') {
      var mix = q.mix || q.antworten.map(function (a, i) { return i; });
      out += '<p class="muted" style="text-align:center">Tippe die Teile in der richtigen Reihenfolge an.</p><div class="slots">' + q.antworten.map(function (a, k) {
        var i = P.order[k]; return '<div class="slot' + (i != null ? ' full' : '') + '"' + (i != null ? ' data-a="pOut" data-k="' + k + '" role="button"' : '') + '><span class="nr">' + (k + 1) + '</span>' + (i != null ? h(q.antworten[i]) + ' <span class="muted small" style="margin-left:auto">✕</span>' : '') + '</div>'; }).join('') + '</div>' +
        '<div class="pool">' + mix.filter(function (i) { return P.order.indexOf(i) < 0; }).map(function (i) { return '<button data-a="pIn" data-i="' + i + '">' + h(q.antworten[i]) + '</button>'; }).join('') + '</div>' +
        '<button class="btn gold go" data-a="pSend"' + (P.order.length === q.antworten.length ? '' : ' disabled') + '>Abschicken ✦</button>';
    }
    return out + '</div>';
  }
  ACT.pAns = function (el) {
    var q = P.st.question, i = +el.dataset.i;
    if (!q.mehrfach) { P.pick = [i]; return send(); }
    var k = P.pick.indexOf(i); if (k >= 0) P.pick.splice(k, 1); else P.pick.push(i); pRender();
  };
  ACT.pText = function (el) { P.text = el.value; };
  ACT.pIn = function (el) { P.order.push(+el.dataset.i); pRender(); };
  ACT.pOut = function (el) { P.order.splice(+el.dataset.k, 1); pRender(); };
  ACT.pSend = function () { return send(); };
  document.addEventListener('submit', function (e) { if (e.target.id === 'pform') { e.preventDefault(); send(); } });
  async function send() {
    if (P.busy || !P.st || P.st.phase !== 'frage') return;
    var q = P.st.question, a;
    if (q.typ === 'text') { a = (document.getElementById('ptext') || {}).value || P.text; if (!String(a).trim()) return toast('Bitte zuerst eine Antwort eintippen.'); a = String(a).trim().slice(0, 60); }
    else if (q.typ === 'reihe') { if (P.order.length !== q.antworten.length) return; a = P.order.slice(); }
    else { if (!P.pick.length) return; a = P.pick.slice().sort(); }
    P.busy = true; P.sent = true; pRender();
    try { var r = await B.answer(P.tok, P.st.q, a); if (!r.ok && r.error === 'vorbei') toast('Die Zeit ist leider um.'); }
    catch (e) { P.sent = false; toast('Keine Verbindung. Bitte nochmals tippen.'); pRender(); }
    finally { P.busy = false; }
    P.key = ''; pPoll();
  }
  ACT.pNeu = function () { stop(); pSave(null); P.tok = null; P.pin = ''; P.err = ''; joinRender(); };

  if (B.mode === 'player') playStart(); else if (B.mode === 'kid') kidStart(); else listStart();
})();
</script>
