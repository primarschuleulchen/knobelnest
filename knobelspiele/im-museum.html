*{box-sizing:border-box}
:root{--bg:#f4f9fd;--ink:#1f2421;--soft:#5f6963;--line:#e1edf7;--line2:#c5d8e8;--gold:#d6ad45;--gold-d:#c4952f;
  --sky:#dcf0fd;--sky-d:#3f78a8;--leaf:#e9f1e3;--rose:#fcefed;--sun:#fbf3dc;--lila:#efe7f7;--ok:#5f9a4a;--no:#c8574e;
  --sch:0 10px 26px rgba(63,120,168,.18),0 2px 6px rgba(63,120,168,.10);--sch-k:0 4px 12px rgba(63,120,168,.14)}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 10% -10%,#e3f1fc 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#fbf3dc 0%,transparent 60%),var(--bg);
  color:var(--ink);font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;font-size:21px;line-height:1.3;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 28px}
.top{width:100%;max-width:960px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top .t{flex:1;text-align:center;font-size:23px}
.top .t::after{content:" ✦";color:var(--gold);font-size:.6em;vertical-align:super}
.pill{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 14px;min-height:46px;box-shadow:var(--sch-k);transition:transform .15s}
.pill:hover{transform:translateY(-2px)}.pill:active{transform:translateY(1px)}
.kopf{text-align:center;margin:6px 0 4px}
.ring{width:104px;height:104px;border-radius:50%;display:inline-grid;place-items:center;font-size:54px;background:var(--sun);border:3px solid var(--gold);
  box-shadow:inset 0 0 0 6px #fff,0 8px 18px rgba(63,120,168,.18)}
.kopf h1{margin:10px 0 2px;font-size:42px;font-weight:400;line-height:1}
.kopf h1::after{content:" ✦";color:var(--gold);font-size:.5em;vertical-align:super}
.kopf p{margin:6px auto 0;max-width:540px;color:var(--soft);font-size:20px}
.deko{color:var(--gold);letter-spacing:.35em;font-size:13px;margin-top:8px}
.lvs{width:100%;max-width:600px;display:grid;gap:12px;margin-top:16px}
.lv{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#fff 0%,#fff 70%,#f7fbfe 100%);border:1.5px solid var(--line);border-radius:24px;
  padding:12px 18px;text-align:left;min-height:78px;box-shadow:var(--sch);transition:transform .15s,box-shadow .15s}
.lv:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(63,120,168,.26),0 3px 8px rgba(63,120,168,.14)}
.lv:active{transform:translateY(1px)}
.lv .n{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid var(--gold);box-shadow:inset 0 0 0 4px #fff}
.lv .tx{flex:1}.lv .tx b{display:block;font-weight:400;font-size:25px;line-height:1.1}.lv .tx span{color:var(--soft);font-size:18px}
.stars{color:var(--gold);font-size:24px;letter-spacing:2px;white-space:nowrap}.stars .off{color:#e6dcc2}
.msg{min-height:60px;font-size:25px;text-align:center;margin:2px 0 10px;max-width:760px;line-height:1.35}
.msg .em{font-size:42px;vertical-align:middle;margin:0 4px;line-height:1}
.msg small{color:var(--soft);font-size:19px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 4px}
.dots i{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--line2);display:block}.dots i.ok{background:var(--ok);border-color:var(--ok)}.dots i.no{background:var(--no);border-color:var(--no)}
.stage{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:min(420px,90%);height:14px;border-radius:99px;background:#fff;border:2px solid var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8c56a,var(--gold));width:100%;transition:width linear}
.go{background:var(--sky);border:2px solid var(--ink);border-radius:16px;padding:8px 22px;font-size:23px;min-height:54px;box-shadow:var(--sch);transition:transform .15s}
.go:hover{transform:translateY(-2px)}.go:active{transform:translateY(1px)}
.go.alt{background:#fff}.go.sun{background:var(--sun)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;display:grid;place-items:center;aspect-ratio:1;font-size:clamp(28px,7vw,54px);line-height:1;
  box-shadow:var(--sch-k);transition:background .2s,border-color .2s,transform .12s;position:relative}
button.card:active{transform:scale(.96)}
.grid{display:grid;gap:clamp(6px,1.6vw,12px);width:100%;margin:0 auto}
.grid .card{font-size:inherit}
.card.cover{background:linear-gradient(135deg,#e6f3fd,#c4e2f8);color:var(--gold);border-color:#b9d6ee}
.card.cover::after{content:"✧";font-size:.45em;opacity:.9}
.card.ok{border-color:var(--ok);background:#f1f7ec}
.card.no{border-color:var(--no);background:#fbefed}
.card.hint{border-color:var(--gold);background:var(--sun)}
.card.zahl{color:var(--sky-d)}
.end{background:linear-gradient(180deg,#fff 0%,#fff 70%,#fbf3dc 100%);border:1.5px solid var(--line);border-radius:30px;padding:26px 22px;text-align:center;max-width:480px;width:100%;box-shadow:var(--sch)}
.end .big{font-size:64px}.end h2{margin:6px 0;font-weight:400;font-size:36px}.end p{color:var(--soft);margin:4px 0 18px;font-size:22px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .3s}@keyframes pp{50%{transform:scale(1.1)}}
.szene{position:relative;width:min(100%,600px);aspect-ratio:3/2;max-height:52vh;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:var(--sch)}
.szene span{position:absolute;transform:translate(-50%,-50%);font-size:clamp(26px,6vw,46px);line-height:1}
.szene.zu{background:linear-gradient(135deg,#e6f3fd,#c4e2f8)}
.nm{position:absolute;left:4px;right:4px;bottom:6%;font-size:clamp(15px,3.2vw,20px);text-align:center;background:var(--sun);border-radius:10px;padding:1px 2px}
.karte{padding-bottom:22%}
@media (max-height:640px){.ring{width:80px;height:80px;font-size:40px}.kopf h1{font-size:32px}.msg{min-height:50px;font-size:21px}}

/* Logo statt Emoji im Kreis oben */
.ring{width:150px;height:150px;background:#fff;border:3px solid var(--gold);padding:5px;box-shadow:0 8px 18px rgba(63,120,168,.18)}.ring .logo{width:100%;height:100%;display:block;border-radius:50%}
/* bis 10 Sterne pro Stufe: rechts in zwei Reihen à 5 */
.lv .stars{flex:none;width:5.3em;font-size:19px;letter-spacing:0;line-height:1.15;white-space:normal;word-break:break-all;text-align:left}
.mu{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start;width:100%;max-width:1040px}

.beschr{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--sch-k);font-size:23px;width:100%;line-height:1.45}

.beschr p{margin:2px 0}
.beschr .zu{color:var(--soft);font-size:19px;text-align:center;padding:6px 0}
.hoer .ico{width:20px;height:20px;vertical-align:-3px}.hoer.gross .ico{width:28px;height:28px;vertical-align:-5px}

.hoer.gross{font-size:26px;min-height:70px;padding:8px 26px}
.drei{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;width:100%;max-width:960px}
.drei button{padding:0;background:none;border:none;border-radius:22px;transition:transform .15s}
.drei button:hover{transform:translateY(-3px)}
.drei button.ok .wand{box-shadow:0 0 0 6px var(--ok),var(--sch)}
.drei button.no .wand{box-shadow:0 0 0 6px var(--no),var(--sch);opacity:.75}
.drei button.hint .wand{box-shadow:0 0 0 6px var(--gold),var(--sch)}
.satz{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;min-height:64px;width:100%;text-align:center;font-size:25px;line-height:1.7;box-shadow:var(--sch-k)}
.slot{display:inline-block;min-width:64px;border-bottom:3px solid var(--line2);margin:0 3px;padding:0 4px;line-height:1.25;color:var(--sky-d)}
.slot.jetzt{border-color:var(--gold);background:var(--sun);border-radius:8px 8px 0 0}
.slot.voll{border-color:transparent;color:#2c3e50;background:#eef6fc;border-radius:8px}
.opts4{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.opts4 button{background:#fff;border:2px solid var(--ink);border-radius:16px;min-height:56px;padding:6px 16px;font-size:23px;box-shadow:var(--sch-k);transition:transform .12s}
.opts4 button:active{transform:scale(.96)}
.opts4 button.no{background:#fbe5e2;border-color:var(--no)}.opts4 button.hint{background:var(--sun);border-color:var(--gold)}
.heft{width:100%;background:repeating-linear-gradient(180deg,#fff 0 38px,#c5d8e8 38px 40px);border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:22px;line-height:40px;min-height:82px}
.heft p{margin:0}
.heft p::before{content:"✎ ";color:var(--gold)}
.werk{display:flex;flex-direction:column;gap:10px;width:100%}
.werk h3{margin:2px 0 -4px;font-weight:400;font-size:18px;color:var(--soft)}
.reihe{display:flex;flex-wrap:wrap;gap:7px}
.tb{background:#fff;border:2px solid var(--line2);border-radius:14px;min-height:50px;padding:4px 10px;font-size:19px;display:inline-flex;align-items:center;gap:6px}
.tb svg{width:26px;height:26px}
.tb[aria-pressed="true"]{border-color:var(--gold-d);background:var(--sun);box-shadow:inset 0 0 0 2px var(--gold)}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid rgba(0,0,0,.22);padding:0}
.sw[aria-pressed="true"]{outline:4px solid var(--gold);outline-offset:2px}
.zelle{fill:transparent;stroke:rgba(40,40,40,.28);stroke-width:1;stroke-dasharray:4 4;cursor:pointer}

.mark{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:8 5;animation:mk 1s linear infinite}
.mark2{fill:none;stroke:#d6ad45;stroke-width:6;opacity:.85}

var HINTER = ['yellow', 'orange', 'purple', 'light blue', 'light green', 'green', 'grey', 'red'];
var FORM = ['circle', 'square', 'triangle', 'rectangle'];
var ORT = ['at the top in the left corner', 'at the top in the middle', 'at the top in the right corner',
  'on the left in the middle', 'in the middle', 'on the right in the middle',
  'at the bottom in the left corner', 'at the bottom in the middle', 'at the bottom in the right corner'];
var RICHT = ['up', 'right', 'down', 'left'], RICHTW = { up: 'facing up', down: 'facing down', left: 'facing to the left', right: 'facing to the right' };
var ZAHL = ['', 'a', 'two', 'three', 'four'];
var LOB = ['Great!', 'Super!', 'Well done!', 'Excellent!', 'Fantastic!', 'Perfect!'];
function fam(c) { return FAM[c] || c; }
function passt(c, bg) { var a = fam(c), b = fam(bg); if (a === b) return false; var x = [a, b].sort().join('/'); return ['orange/yellow', 'purple/red', 'black/brown', 'blue/purple'].indexOf(x) < 0 && !(c === 'white' && /^light/.test(bg)) && !(bg === 'grey' && c === 'white'); }
function plural(s, n) { return n > 1 ? s + 's' : s; }
function art(w) { return /^[aeiou]/.test(w) ? 'an' : 'a'; }

// ---------- Ein Bild: { bg, it: [{ s, c, p, z, d, n }] }  (p = Feld 0…8, z = little/big/'', d = Richtung, n = Anzahl)
function neuesBild(lv) {
  for (var t = 0; t < 500; t++) {
    var k = rnd(lv.min, lv.max), felder = pick(range(9), k), bg = pick(HINTER, 1)[0], liste = lv.alle ? ALLE : GRUND, it = [], ok = true;
    felder.sort(function (a, b) { return a - b; });
    felder.forEach(function (p) {
      var farben = liste.filter(function (c) { return passt(c, bg); }), x = { s: pick(FORM, 1)[0], c: pick(farben, 1)[0], p: p, z: '', d: 'up', n: 1 };
      if (lv.extra) {
        x.z = Math.random() < .5 ? 'little' : 'big';
        if (x.s === 'triangle') x.d = pick(RICHT, 1)[0];
        if (Math.random() < .3) { x.n = rnd(2, 4); x.z = 'little'; }
      }
      it.push(x);
    });
    // Nicht zweimal genau dasselbe
    var keys = it.map(function (x) { return x.s + x.c; });
    if (keys.some(function (q, i) { return keys.indexOf(q) !== i; })) ok = false;
    // Grosse Formen nicht direkt nebeneinander (sonst wird es eng)
    it.forEach(function (a) { it.forEach(function (b) { if (a !== b && a.z === 'big' && b.z === 'big' && Math.abs(a.p - b.p) === 1 && Math.floor(a.p / 3) === Math.floor(b.p / 3)) ok = false; }); });
    if (ok) return { bg: bg, it: it };
  }
}
function schluessel(b, voll) {
  return b.bg + '|' + b.it.map(function (x) { return norm(x, voll); }).sort().join(';');
}
function norm(x, voll) {
  if (!voll) return x.p + ':' + x.s + ':' + x.c;
  return x.p + ':' + x.s + ':' + x.c + ':' + x.n + ':' + (x.n > 1 ? '' : x.z) + ':' + (x.s === 'triangle' ? x.d : '');
}

// ---------- Sätze
function satzHinter(b) { return 'The background is ' + b.bg + '.'; }
function satz(x, voll) {
  var w = [x.n > 1 ? 'There are ' + ZAHL[x.n] : 'There is ' + art(x.z || x.c)];
  if (x.z) w.push(x.z);
  w.push(x.c, plural(x.s, x.n));
  if (voll && x.s === 'triangle') w.push(RICHTW[x.d]);
  w.push(ORT[x.p]);
  return w.join(' ') + '.';
}
function text(b, voll) { return [satzHinter(b)].concat(b.it.map(function (x) { return satz(x, voll); })); }

// ---------- Vorlesen: dieselbe Stimmenwahl wie in der Vokabelkiste (englische Frauenstimme, en-GB bevorzugt, «natural» besser)
var FEMALE = /\b(female|samantha|karen|moira|tessa|serena|kate|stephanie|martha|fiona|victoria|allison|ava|susan|zira|hazel|libby|sonia|aria|jenny|emma|amy|joanna|salli|kimberly|olivia|natasha|clara)\b/i;
var MALE = /\b(male|daniel|alex|fred|oliver|george|ryan|guy|david|mark|james|thomas|arthur|rishi|aaron|gordon|reed|rocko|eddy|grandpa)\b/i;
function stimme() {
  var vs = []; try { vs = speechSynthesis.getVoices().filter(function (v) { return v.lang && /^en/i.test(v.lang); }); } catch (e) {}
  if (!vs.length) return null;
  function sc(v) { var n = v.name.replace(/female/ig, ''); return (FEMALE.test(v.name) ? 10 : 0) - (MALE.test(n) ? 10 : 0) + (/en[-_]gb/i.test(v.lang) ? 3 : 0) + (/natural|neural|premium|enhanced|online/i.test(v.name) ? 4 : 0); }
  return vs.slice().sort(function (a, b) { return sc(b) - sc(a); })[0];
}
function kannSprechen() { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }
// Tempo und Pause zwischen den Sätzen (pro Stufe, gesetzt in G.play)
var TEMPO = .8, PAUSE = 900, SPRICH = 0, AKT_U = null;
// t = ein Satz oder eine Liste von Sätzen; jeder Satz einzeln, mit Pause dazwischen
function sag(t, immer) {
  if ((ST.mute && !immer) || !kannSprechen()) return;
  var liste = [].concat(t), nr = ++SPRICH, i = 0;
  try { var ss = speechSynthesis; if (ss.speaking || ss.pending) ss.cancel(); if (ss.paused) ss.resume(); } catch (e) {}
  function weiter() {
    if (nr !== SPRICH || i >= liste.length) return;
    var satz = liste[i++], fertig = false, notfall;
    function danach() { if (fertig) return; fertig = true; clearTimeout(notfall); if (nr === SPRICH && i < liste.length) setTimeout(weiter, PAUSE); }
    try {
      var u = new SpeechSynthesisUtterance(satz), v = stimme();
      if (v) { u.voice = v; u.lang = String(v.lang).replace('_', '-'); } else u.lang = 'en-GB';
      u.rate = TEMPO; u.pitch = 1; u.onend = danach; u.onerror = danach; AKT_U = u; // Referenz halten (sonst bricht Safari ab)
      speechSynthesis.speak(u);
      notfall = setTimeout(danach, 4000 + satz.length * 140 / TEMPO); // falls das Gerät «fertig» nicht meldet
    } catch (e) {}
  }
  weiter();
}
function still() { SPRICH++; try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }

// ---------- Zeichnen (SVG 360 × 180 = weisses Feld im Museumsbild, 3 × 3 Felder à 120 × 60)
function formSvg(s, cx, cy, r, d, fill, extra) {
  var st = ' fill="' + fill + '" stroke="rgba(0,0,0,.22)" stroke-width="1.3"' + (extra || '');
  if (s === 'circle') return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + st + '/>';
  if (s === 'square') { var a = r * 1.75; return '<rect x="' + (cx - a / 2) + '" y="' + (cy - a / 2) + '" width="' + a + '" height="' + a + '"' + st + '/>'; }
  if (s === 'rectangle') { var w = r * 2.5, hh = r * 1.3; return '<rect x="' + (cx - w / 2) + '" y="' + (cy - hh / 2) + '" width="' + w + '" height="' + hh + '"' + st + '/>'; }

  return '<polygon points="' + cx + ',' + (cy - r) + ' ' + (cx - q) + ',' + (cy + r * .8) + ' ' + (cx + q) + ',' + (cy + r * .8) + '" transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')"' + st + '/>';
}

// opt: { felder: true (Raster zum Malen), mark: Feld hervorheben, fehler: [Felder] }
function bildSvg(b, opt) {

  var api = {
    stage: stage,
    msg: function (t) { msgEl.innerHTML = t; },
    later: function (fn, ms) { TM.push(setTimeout(function () { if (run === RUN) fn(); }, ms)); },
    // Antwort melden. Gibt false zurück, wenn die Runde fertig ist.
    answer: function (ok, quiet) {
      KN.answer(!!ok);
      if (!quiet) { if (ok) good(); else bad(); }
      if (!N) return true;
      res.push(!!ok); dots();
      if (res.length >= N) { var c = res.filter(Boolean).length; api.later(function () { end(i, c + ' von ' + N + ' richtig', c / N); }, 1600); return false; }
      return true;
    },
    // Für Spiele ohne feste Anzahl Aufgaben (Paare finden)
    done: function (line, q) { KN.round(); end(i, line, q); },
    best: function (key, v, lower) {
      ST.best = ST.best || {}; var old = ST.best[key], rec = old == null || (lower ? v < old : v > old);
      if (rec) { ST.best[key] = v; save(); } return { old: old, rec: rec };
    },
    // Merkzeit mit Balken und Knopf «Ich bin bereit»
    watch: function (ms, after) {
      var w = document.createElement('div'); w.className = 'stage'; w.style.gap = '10px';
      w.innerHTML = '<div class="bar"><i></i></div><button class="go alt">Ich bin bereit ✓</button>';
      stage.appendChild(w);
      var bar = w.querySelector('i'), fired = false;
      function fire() { if (fired || run !== RUN) return; fired = true; w.remove(); after(); }
      requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.transitionDuration = ms + 'ms'; bar.style.width = '0%'; }); });
      w.querySelector('button').onclick = fire;
      api.later(fire, ms);
    }
  };
  G.play(lv, api, i);
}

function end(i, line, q) {
  stopAll(); RUN++;
  var em = q >= 0.9 ? '🏆' : q >= 0.7 ? '🌟' : q >= 0.5 ? '👍' : '💪', t = q >= 0.9 ? 'Super gemacht!' : q >= 0.7 ? 'Gut gemacht!' : q >= 0.5 ? 'Geschafft!' : 'Weiter üben!';
  var next = i + 1 < G.levels.length;
  app.innerHTML = '<div class="top"><span style="flex:1"></span>' + sndBtn() + '</div><div class="stage" style="margin-top:30px"><div class="end"><div class="big">' + em + '</div><h2>' + t + '</h2><p>' + line + '</p><div class="row">' +
    '<button class="go" data-again>Nochmal</button>' + (next && q >= 0.7 ? '<button class="go sun" data-next>Nächste Stufe →</button>' : '') + '<button class="go alt" data-menu>Stufen</button></div><div class="deko" style="margin-top:16px">✦ ✧ ✦</div></div></div>';
  app.querySelector('[data-again]').onclick = function () { start(i); };
  if (app.querySelector('[data-next]')) app.querySelector('[data-next]').onclick = function () { start(i + 1); };
  app.querySelector('[data-menu]').onclick = menu;
  if (q >= 0.7) { good(); setTimeout(function () { tone(1320, 0.25); }, 260); }
}

function boot() {
  if (booted) return; booted = true;
  var m = /[?&]stufe=(\d)/.exec(location.search), s = m ? +m[1] - 1 : -1;
  if (s >= 0 && s < G.levels.length) start(s); else menu();
}
if (MODE === 'url') {
  window.addEventListener('message', function (e) {
    var d = e.data; if (e.source !== parent || !d) return;
    if (d.knobelnestInit && !booted) { var x = d.knobelnestInit; loadST(x.store && x.store.ks); if (x.award && typeof x.award === 'object') AW = x.award; boot(); }
    if (d.knobelnestAward) { AW = d.knobelnestAward; if (booted && CUR < 0) menu(); }
  });
  send({ type: 'hello' });
  setTimeout(boot, 2500);
} else {
  try { loadST(localStorage.getItem('ks')); } catch (e) {}
  if (MODE === 'srcdoc') window.addEventListener('knobelnest-sterne', function () { if (CUR < 0) menu(); });
  boot();
}

</script>
</body>
